<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thermal Flow</title>
<style>
:root{
  --bg:#0a0a0b;--panel:#141417;--panel2:#1c1c21;--line:#2a2a31;
  --text:#e6e6ef;--sub:#9a9aa6;--faint:#6a6a74;--accent:#ff5a1f;
  --mono:"SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:12px/1.5 var(--mono);-webkit-font-smoothing:antialiased;overflow:hidden}
#app{display:flex;width:100vw;height:100vh}
#stage{flex:1 1 auto;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;padding:34px;background:
  radial-gradient(1200px 800px at 30% 20%,#101014,var(--bg))}
#view{max-width:100%;max-height:100%;display:block;box-shadow:0 18px 70px rgba(0,0,0,.6),0 0 0 1px #232329;background:#000}
#meta{position:absolute;bottom:14px;right:16px;color:var(--faint);font-size:10px;letter-spacing:.06em;pointer-events:none}
#ov{position:absolute;touch-action:none;cursor:crosshair}
#maskCv{position:absolute;pointer-events:none;display:none}
#txprev{position:absolute;display:none;pointer-events:none;z-index:3;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
#txprev.on{display:flex}
#txprev .tx1{color:#F2EFC9;font:800 1em/1.05 'Helvetica Neue',Futura,sans-serif;letter-spacing:.04em}
#txprev .tx2{color:#111111;font:700 26px/1.2 'Hiragino Sans','Noto Sans JP',sans-serif;letter-spacing:.3em}
#txprev .tx3{color:#F2EFC9;font:600 13px/1.2 ui-monospace,monospace;letter-spacing:.24em;margin-top:18px}
#panel{flex:0 0 320px;width:320px;height:100%;overflow-y:auto;background:var(--panel);
  border-left:1px solid var(--line);padding:0 0 60px}
#panel::-webkit-scrollbar{width:8px}
#panel::-webkit-scrollbar-thumb{background:#2c2c34;border-radius:4px}
#panel header{padding:18px 16px 14px;border-bottom:1px solid var(--line)}
#panel h1{margin:0 0 4px;font-size:15px;letter-spacing:.28em;font-weight:700}
#panel h1 em{color:var(--accent);font-style:normal}
#panel header p{margin:0 0 12px;color:var(--sub);font-size:10.5px;letter-spacing:.02em}
#dice{width:100%;padding:10px;border:none;border-radius:6px;cursor:pointer;
  background:var(--accent);color:#fff;font:700 13px var(--mono);letter-spacing:.14em}
#dice:hover{filter:brightness(1.12)}
#dice:active{transform:translateY(1px)}
.seedrow{display:flex;align-items:center;gap:8px;margin-top:10px}
.seedrow label{color:var(--sub);font-size:10.5px;letter-spacing:.1em}
#seed{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:4px;
  color:var(--text);font:12px var(--mono);padding:5px 8px;min-width:0}
section{border-bottom:1px solid var(--line);padding:13px 16px}
section>h2{margin:0 0 10px;font-size:10.5px;color:var(--sub);letter-spacing:.24em;font-weight:600}
section>h2 b{color:var(--faint);font-weight:600;margin-right:6px}
.sub{margin:12px 0 2px;color:var(--faint);font-size:9.5px;letter-spacing:.18em}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.seg button{flex:1;background:none;border:none;color:var(--sub);font:10.5px var(--mono);
  padding:7px 2px;cursor:pointer;letter-spacing:.02em;white-space:nowrap}
.seg button.on{background:var(--accent);color:#fff}
.seg button:not(.on):hover{color:var(--text)}
.prow{display:flex;align-items:center;gap:8px;margin-top:8px}
.prow>span:first-child{flex:0 0 84px;color:var(--sub);font-size:10.5px}
.prow input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;
  background:#33333c;outline:none;cursor:pointer}
.prow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;
  background:var(--text);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.prow input[type=range]:hover::-webkit-slider-thumb{background:var(--accent)}
.prow .pv{flex:0 0 34px;text-align:right;color:var(--faint);font-size:10px}
.prow select{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:4px;
  color:var(--text);font:11px var(--mono);padding:4px 6px;min-width:0}
.prow input[type=number]{width:64px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;
  color:var(--text);font:11px var(--mono);padding:4px 6px}
.prow input[type=color]{width:26px;height:22px;padding:0;border:1px solid var(--line);border-radius:4px;
  background:var(--panel2);cursor:pointer}
.prow input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:5px;color:var(--text);
  font:11px var(--mono);padding:6px 10px;cursor:pointer;letter-spacing:.04em}
.btn:hover{border-color:var(--accent)}
.btn.wide{width:100%;margin-top:8px}
.btnrow{display:flex;gap:7px;margin-top:8px}
.btnrow .btn{flex:1}
.hint{color:var(--faint);font-size:9.5px;margin-top:6px;letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;color:var(--sub);
  font:10px var(--mono);padding:4px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chips .chip:hover{border-color:var(--accent);color:var(--text)}
.chips .chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
#lutCv{width:100%;height:46px;display:block;margin-top:8px;border-radius:5px;cursor:pointer;
  background:var(--panel2);touch-action:none}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(8px);z-index:99;
  background:var(--panel2);border:1px solid var(--accent);color:var(--text);border-radius:6px;
  padding:8px 16px;font:11px var(--mono);opacity:0;transition:opacity .15s,transform .15s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:760px){
  #app{flex-direction:column}
  #stage{padding:16px;min-height:44vh}
  #panel{flex:1;width:100%;border-left:none;border-top:1px solid var(--line)}
}
</style>
</head>

      <div id="stopCtl"></div>
      <div id="lutOpts"></div>

    <section><h2><b>06</b>グレイン</h2>
      <div class="seg" id="grainSeg"></div>

    <section><h2><b>07</b>仕上げ</h2>

      <div id="maskOpts"></div>

    <section><h2><b>09</b>書き出し</h2>
      <div class="btnrow"><button class="btn" id="btnPng1">PNG ×1</button><button class="btn" id="btnPng2">PNG ×2</button><button class="btn" id="btnPng4">PNG ×4</button></div>
      <div class="btnrow"><button class="btn" id="btnCopy">クリップボードにコピー</button></div>
      <div class="btnrow"><button class="btn" id="btnUrl">設定URLコピー</button></div>
      <div class="hint">設定URLを開くと同じ状態が再現されます。PNG ×4 は最大約8Kのタイルなし一括レンダリング</div>

  </aside>
</div>

<script>
'use strict';
/* ============ utils ============ */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function ce(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function mulberry32(a){a=a>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hex2rgbF(hx){const n=parseInt(hx.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]}
function rgb2hex(r,g,b){const h=v=>('0'+Math.round(clamp(v,0,1)*255).toString(16)).slice(-2);return'#'+h(r)+h(g)+h(b)}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2200)}
function download(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);
}
/* ============ state ============ */
const SIZE_PRESETS={'11':[1080,1080],'45':[1080,1350],'34':[1080,1440],'916':[1080,1920],'a':[1080,1527]};
const state={
  seed:20260816,
  canvas:{mode:'45',w:1080,h:1350},
  field:{
    mode:'warp',
    scale:30,octaves:4,warp1:55,warp2:45,aniso:0,time:0,curl:0,rise:0,ntype:'fbm',nchar:50,kal:0,kalRot:0,linAng:270,linShape:'line',linInv:false,linCx:50,linCy:50,
    peaks:3,sharp:45,peakH:75,sway:40,
    blobN:3,blobSize:52,blobSoft:55,
    gamma:50,contrast:56,offset:0
  },
  lut:{
    stops:[{p:0,c:'#050004',h:0},{p:.28,c:'#3a0002',h:0},{p:.5,c:'#c81400',h:0},{p:.68,c:'#ff6a00',h:0},{p:.84,c:'#ffc95e',h:0},{p:1,c:'#fff6dc',h:0}],
    bands:0,invert:false,shift:0
  },
  grain:{mode:'film',amount:22,size:1,paper:'#f2ead8'},
  finish:{bg:0,bgTop:'#d9c4a8',bgBot:'#26060f'},
  mask:{on:false,src:'text',text:'U19',text2:'U19 eスポーツ選手権2026',size:38,size2:6,ls:0,gap:5,yoff:0,imgSize:70,bg:'#55BCE7',transparent:false},
  motion:{on:false,loop:true,loopSec:8,evo:60,sway:12,speed:24,hue:0},
  pins:[]
};
function fullSize(){
  if(state.canvas.mode==='custom')return[clamp(state.canvas.w|0,64,8192),clamp(state.canvas.h|0,64,8192)];
  return SIZE_PRESETS[state.canvas.mode]||SIZE_PRESETS['45'];
}
function previewSize(){
  const[W,H]=fullSize(),sc=Math.min(1,1100/Math.max(W,H));
  return[Math.max(8,Math.round(W*sc)),Math.max(8,Math.round(H*sc))];
}
/* ============ LUT presets ============ */
function S(p,c,h){return{p,c,h:h||0}}
/* U19決定パレット(青×クリーム×ピーチ×オレンジ)の比較検証セット — 全て同一構成の色違い */
const LUT_PRESETS=[
 {name:'基準',dot:'#FF5A2A',stops:[S(0,'#54B6DF'),S(.12,'#F2EFC9'),S(.315,'#E6A06D'),S(.42,'#FF5A2A'),S(.55,'#E6A06D'),S(.7,'#F2EFC9'),S(.86,'#54B6DF'),S(1,'#89C9D3')]},
 {name:'ハイコントラスト',dot:'#F43D05',stops:[S(0,'#1E9BD8'),S(.12,'#FBF7DF'),S(.315,'#E88E4A'),S(.42,'#F43D05'),S(.55,'#E88E4A'),S(.7,'#FBF7DF'),S(.86,'#1E9BD8'),S(1,'#5FB8D8')]},
 {name:'ホットコア',dot:'#FFD873',stops:[S(0,'#54B6DF'),S(.12,'#F2EFC9'),S(.3,'#E6A06D'),S(.37,'#FF5A2A'),S(.42,'#FFD873'),S(.47,'#FF5A2A'),S(.55,'#E6A06D'),S(.7,'#F2EFC9'),S(.86,'#54B6DF'),S(1,'#89C9D3')]},
 {name:'サーモナイト',dot:'#1C3E5C',stops:[S(0,'#1C3E5C'),S(.1,'#54B6DF'),S(.22,'#F2EFC9'),S(.315,'#E6A06D'),S(.42,'#FF5A2A'),S(.55,'#E6A06D'),S(.68,'#F2EFC9'),S(.83,'#54B6DF'),S(1,'#16324A')]},
 /* ---- 公式カラーシステム(2026-09-01支給) ----
    公式フロー: フィールド調整版。承認フィールド(gamma33/offset-33)は値が低域集中のため熱源を.42中心のミラー構造に再配置。赤#E72F2Dは最高温コア限定(面積比: 赤5〜10%ルール)
    公式フロー原典: ドキュメント記載位置そのまま(リニアグラデ用途) */
 {name:'公式フロー',dot:'#FF6A3D',stops:[S(0,'#55BCE7'),S(.12,'#F8F0C9'),S(.3,'#FFB56B'),S(.38,'#FF6A3D'),S(.42,'#E72F2D'),S(.46,'#FF6A3D'),S(.54,'#FFB56B'),S(.7,'#F8F0C9'),S(.86,'#55BCE7'),S(1,'#BFE8FF')]},
 {name:'公式フロー原典',dot:'#E72F2D',stops:[S(0,'#55BCE7'),S(.22,'#BFE8FF'),S(.43,'#F8F0C9'),S(.64,'#FFB56B'),S(.82,'#FF6A3D'),S(1,'#E72F2D')]},
 {name:'A クールエナジー',dot:'#1E90FF',stops:[S(0,'#0D1B5E'),S(.5,'#1E90FF'),S(1,'#BFF2FF')]},
 {name:'B サンライズ',dot:'#FFA066',stops:[S(0,'#FFF3D6'),S(.5,'#FFA066'),S(1,'#FF3B2E')]},
 {name:'C ナイトアビス',dot:'#5333FF',stops:[S(0,'#0B0F2A'),S(.55,'#1A1F4D'),S(1,'#5333FF')]},
 {name:'D エレクトリック',dot:'#7A3CFF',stops:[S(0,'#246BFF'),S(.5,'#7A3CFF'),S(1,'#FF6A00')]},
 /* ---- ゲームタイトル別トンマナ(2026-09-02) — Riot公式ブランドカラー準拠 ----
    LoL: ヘクステック(深紺#010A13/藍#005A82/魔法ティール#0AC8B9/金#C89B3C/淡金#F0E6D2)
    VALORANT: 赤#FF4655 / オフホワイト#ECE8E1 / ダークネイビー#0F1923 */
 {name:'LoL ヘクステック',dot:'#0AC8B9',stops:[S(0,'#010A13'),S(.22,'#0A323C'),S(.45,'#005A82'),S(.65,'#0AC8B9'),S(.85,'#C8AA6E'),S(1,'#F0E6D2')]},
 {name:'LoL ゴールド',dot:'#C89B3C',stops:[S(0,'#010A13'),S(.3,'#32281E'),S(.55,'#785A28'),S(.78,'#C89B3C'),S(1,'#F0E6D2')]},
 {name:'VALO レッド',dot:'#FF4655',stops:[S(0,'#0F1923'),S(.35,'#1F2A36'),S(.55,'#BD3944'),S(.75,'#FF4655'),S(1,'#ECE8E1')]},
 {name:'VALO ペーパー',dot:'#ECE8E1',stops:[S(0,'#ECE8E1'),S(.45,'#FF4655'),S(.8,'#7A1F29'),S(1,'#0F1923')]}
];
/* ============ look presets — U19 KV制作セット(全て決定パレット) ============ */
const PRESETS=[
 /* 決定KVそのもの: リニア+渦ピン */
 {name:'KVスワール',dot:'#FF5A2A',lut:'基準',
  field:{mode:'linear',linAng:270,scale:0,octaves:4,warp1:51,warp2:0,aniso:-17,curl:74,gamma:33,contrast:28,offset:-33},
  grain:{mode:'film',amount:30,size:1},finish:{bg:0},
  pins:[{x:.4913,y:.4663,r:.392,a:355}]},
 {name:'公式スワール',dot:'#E72F2D',lut:'公式フロー原典',

  grain:{mode:'film',amount:30,size:1},finish:{bg:0},
  pins:[{x:.4913,y:.4663,r:.392,a:355}]},
 {name:'スワール深',dot:'#E6A06D',lut:'基準',
  field:{mode:'linear',linAng:270,scale:0,octaves:4,warp1:56,warp2:0,aniso:-17,curl:82,gamma:33,contrast:30,offset:-30},
  grain:{mode:'film',amount:30,size:1},finish:{bg:0},
  pins:[{x:.49,y:.47,r:.42,a:480},{x:.22,y:.76,r:.16,a:-260}]},
 {name:'グラデ',dot:'#54B6DF',lut:'基準',
  field:{mode:'linear',linAng:270,scale:14,octaves:3,warp1:12,warp2:0,curl:0,gamma:40,contrast:36,offset:-20},
  grain:{mode:'film',amount:30,size:1},finish:{bg:0},pins:[]},
 {name:'ラジアル',dot:'#F2EFC9',lut:'基準',
  field:{mode:'linear',linShape:'radial',linCx:50,linCy:56,scale:12,octaves:3,warp1:18,warp2:0,curl:20,gamma:38,contrast:32,offset:-24},
  grain:{mode:'film',amount:30,size:1},finish:{bg:0},pins:[]},
 {name:'マーブル',dot:'#E08B4E',lut:'基準',
  field:{mode:'warp',scale:26,octaves:5,warp1:64,warp2:55,aniso:-10,time:16,gamma:44,contrast:52,offset:-6},
  grain:{mode:'film',amount:30,size:1},finish:{bg:0},pins:[]},
 {name:'ストライプ',dot:'#2E6E96',lut:'基準',
  field:{mode:'warp',scale:26,octaves:4,warp1:46,warp2:24,aniso:80,time:6,gamma:44,contrast:56,offset:-6},
  grain:{mode:'film',amount:30,size:1},finish:{bg:0},pins:[]},
 /* ---- Web背景(monopo.london参照: 暗場+淡ブルーム+強グレイン+スローループ) ---- */
 {name:'Web宵',dot:'#2E6E96',
  stops:[S(0,'#06070A'),S(.45,'#0A1120'),S(.7,'#16324A'),S(.88,'#2E6E96'),S(1,'#6FB8D8')],
  field:{mode:'blob',scale:18,octaves:2,warp1:24,warp2:0,aniso:0,time:4,blobN:3,blobSize:70,blobSoft:96,gamma:50,contrast:32,offset:0,norm:true},
  motion:{on:true,loop:true,loopSec:16,evo:28,sway:8},
  grain:{mode:'film',amount:50,size:1},finish:{bg:0},pins:[]},
 {name:'Webフロー',dot:'#3E7FA0',
  stops:[S(0,'#07080C'),S(.4,'#0E1B2A'),S(.62,'#16324A'),S(.8,'#3E7FA0'),S(.92,'#C88A5A'),S(1,'#E8C9A0')],
  field:{mode:'warp',scale:10,octaves:2,warp1:62,warp2:28,aniso:-12,time:6,gamma:44,contrast:34,offset:-14,norm:true},

  gl.uniform1i(U['uGrainMode'],{off:0,film:1,shadow:2,dissolve:3}[g.mode]||0);
  gl.uniform1f(U['uGrainAmt'],g.amount/100);
  gl.uniform1f(U['uGrainPx'],g.mode==='dissolve'?g.size*(exScale||1):g.size);
  const pc=hex2rgbF(g.paper);
  gl.uniform3f(U['uPaper'],pc[0],pc[1],pc[2]);
  gl.uniform1f(U['uBgAmt'],(state.finish.bg||0)/100);
  const bt=hex2rgbF(state.finish.bgTop||'#d9c4a8'),bb=hex2rgbF(state.finish.bgBot||'#26060f');
  gl.uniform3f(U['uBgTop'],bt[0],bt[1],bt[2]);
  gl.uniform3f(U['uBgBot'],bb[0],bb[1],bb[2]);
  const pins=state.pins||[];
  gl.uniform1i(U['uPinN'],Math.min(pins.length,6));
  const pp=new Float32Array(12),pr=new Float32Array(6),pa=new Float32Array(6);
  for(let i=0;i<6&&i<pins.length;i++){
    pp[i*2]=pins[i].x;pp[i*2+1]=pins[i].y;
    pr[i]=pins[i].r;pa[i]=pins[i].a*Math.PI/180;
  }
  gl.uniform2fv(U['uPinPos[0]'],pp);
  gl.uniform1fv(U['uPinRad[0]'],pr);
  gl.uniform1fv(U['uPinAng[0]'],pa);
  gl.uniform2f(U['uNormV'],_norm[0],_norm[1]);
  gl.uniform1i(U['uOutField'],0);
  gl.uniform1f(U['uHue'],_animT.h||0);
}
/* モーション: ノイズ空間を楕円軌道(z=evo・x=sway)でサンプリング。1周=ループ秒で完全ループ */
let _animT={z:0,x:0,h:0};
function setAnimPhase(sec){
  const m=state.motion,th=2*Math.PI*(sec/m.loopSec);
  if(m.loop){
    _animT.z=(m.evo/100)*1.5*Math.cos(th);
    _animT.x=(m.sway/100)*.4*Math.sin(th);
    _animT.h=(m.hue||0)*Math.PI/180*Math.sin(th);
  }else{
    _animT.z=sec*(m.speed/100)*.12;_animT.x=0;
    _animT.h=sec*(m.hue||0)*Math.PI/180*.5;
  }
}
/* フルレンジ: トーン後のフィールド値を縮小パスで実測し、1〜99%点を0〜1へストレッチ。
   渦や強いオフセットで値域が偏ってもLUT全色が必ず出る */
let _norm=[0,1];
function measureNorm(W,H){
  const mw=Math.min(160,view.width),mh=Math.min(Math.max(8,Math.round(mw*H/W)),view.height);
  setUniforms(W,H,1);
  gl.uniform2f(U['uNormV'],0,1);
  gl.uniform1i(U['uOutField'],1);
  gl.viewport(0,0,mw,mh);
  gl.drawArrays(gl.TRIANGLES,0,3);
  const px=new Uint8Array(mw*mh*4);
  gl.readPixels(0,0,mw,mh,gl.RGBA,gl.UNSIGNED_BYTE,px);
  const hist=new Uint32Array(256);
  for(let i=0;i<mw*mh;i++)hist[px[i*4]]++;
  const cut=mw*mh*.01;
  let lo=0,hi=255,acc=0;
  for(let i=0;i<256;i++){acc+=hist[i];if(acc>=cut){lo=i;break}}
  acc=0;
  for(let i=255;i>=0;i--){acc+=hist[i];if(acc>=cut){hi=i;break}}
  if(hi-lo<4)return[0,1];
  return[lo/255,hi/255];
}
let _normKey='';
function renderGL(W,H,exScale){
  if(view.width!==W||view.height!==H){view.width=W;view.height=H}
  if(state.field.norm){
    const key=JSON.stringify([state.field,state.pins,state.seed,+(W/H).toFixed(4)]);
    if(key!==_normKey){_norm=measureNorm(W,H);_normKey=key}
  }else{_norm=[0,1];_normKey=''}
  gl.viewport(0,0,W,H);
  setUniforms(W,H,exScale);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
let _dirty=true,_ms=0,_recording=false;
function loop(){
  requestAnimationFrame(loop);
  if(_recording)return;
  syncOverlay();
  if(state.motion.on){setAnimPhase(performance.now()/1000);_dirty=true}
  if(!_dirty)return;
  _dirty=false;
  const t0=performance.now();
  const[pw,ph]=previewSize();
  renderGL(pw,ph,1);
  drawMaskPreview();
  _ms=performance.now()-t0;
  const[W,H]=fullSize();
  meta.textContent=W+'×'+H+'  ·  preview '+pw+'×'+ph+'  ·  '+_ms.toFixed(1)+'ms';
}

const lutCv=$('#lutCv'),lctx=lutCv.getContext('2d');
let selStop=0,_dragStop=-1;
const LBAR_H=56;/* device px in 576x92 canvas (display 288x46 @2x) */
function drawLutBar(){
  const W=lutCv.width,H=lutCv.height;
  lctx.clearRect(0,0,W,H);
  const img=lctx.createImageData(W,LBAR_H);
  for(let x=0;x<W;x++){
    const i=Math.round(x/(W-1)*255)*4;
    for(let y=0;y<LBAR_H;y++){
      const o=(y*W+x)*4;
      img.data[o]=lutData[i];img.data[o+1]=lutData[i+1];img.data[o+2]=lutData[i+2];img.data[o+3]=255;
    }
  }
  lctx.putImageData(img,0,0);
  const st=state.lut.stops;
  st.forEach((s,i)=>{
    const x=s.p*W;
    lctx.beginPath();
    lctx.moveTo(x,LBAR_H+4);lctx.lineTo(x-9,H-6);lctx.lineTo(x+9,H-6);lctx.closePath();
    lctx.fillStyle=s.c;lctx.fill();
    lctx.lineWidth=i===selStop?3:1.5;
    lctx.strokeStyle=i===selStop?'#ffffff':'#55555f';
    lctx.stroke();
  });
}
function lutPointer(e){
  const b=lutCv.getBoundingClientRect();
  return{x:clamp((e.clientX-b.left)/b.width,0,1),y:(e.clientY-b.top)/b.height};
}
function nearStop(px){
  let best=-1,bd=.035;
  state.lut.stops.forEach((s,i)=>{const d=Math.abs(s.p-px);if(d<bd){bd=d;best=i}});
  return best;
}
lutCv.addEventListener('pointerdown',e=>{
  pushUndo();
  const{x,y}=lutPointer(e);
  const hit=nearStop(x);
  if(y>LBAR_H/lutCv.height||hit>=0){
    if(hit>=0){selStop=hit;_dragStop=hit;lutCv.setPointerCapture(e.pointerId)}
  }else{
    const c=sampleStops(x);
    state.lut.stops.push({p:x,c:rgb2hex(c[0],c[1],c[2]),h:0});
    selStop=state.lut.stops.length-1;
    _dragStop=selStop;lutCv.setPointerCapture(e.pointerId);
    buildLut();
  }
  refreshStopCtl();buildLut();redraw();
});
lutCv.addEventListener('pointermove',e=>{
  if(_dragStop<0)return;
  const{x}=lutPointer(e);
  state.lut.stops[_dragStop].p=x;
  buildLut();refreshStopCtl();redraw();
});
lutCv.addEventListener('pointerup',()=>{_dragStop=-1});
lutCv.addEventListener('dblclick',e=>{
  const{x}=lutPointer(e);
  const hit=nearStop(x);
  if(hit>=0&&state.lut.stops.length>2){
    pushUndo();
    state.lut.stops.splice(hit,1);
    selStop=clamp(selStop,0,state.lut.stops.length-1);
    buildLut();refreshStopCtl();redraw();
  }
});

/* ============ randomize ============ */
function applyRandom(seed){
  seed=seed>>>0;
  const r=mulberry32(seed);
  state.seed=seed;
  const f=state.field;
  f.mode=['warp','warp','warp','flame','flame','blob','linear'][(r()*7)|0];
  f.linAng=(r()*360)|0;
  f.scale=18+r()*46;
  f.octaves=3+((r()*3)|0);
  f.warp1=25+r()*60;
  f.warp2=r()*70;
  f.aniso=(r()<.45?0:(r()*2-1)*80)|0;
  f.time=r()*40;
  f.ntype=['fbm','fbm','turb','ridge','voro'][(r()*5)|0];
  f.nchar=Math.round(r()*100);
  f.kal=r()<.18?(2+2*((r()*5)|0)):0;
  f.kalRot=Math.round(r()*360);
  f.curl=r()<.5?Math.round(r()*45):0;
  f.rise=r()<.45?Math.round(r()*50):0;
  f.peaks=1+((r()*5)|0);
  f.sharp=15+r()*60;
  f.peakH=55+r()*70;
  f.sway=15+r()*55;
  f.blobN=1+((r()*5)|0);
  f.blobSize=35+r()*45;
  f.blobSoft=35+r()*50;
  f.gamma=42+r()*16;
  f.contrast=48+r()*24;
  f.offset=(r()*16-8)|0;
  const lp=LUT_PRESETS[(r()*LUT_PRESETS.length)|0];
  state.lut.stops=lp.stops.map(s=>({...s}));
  state.lut.bands=r()<.15?(3+((r()*9)|0)):0;
  state.lut.invert=false;
  state.lut.shift=0;
  const g=state.grain;
  g.mode=['off','film','film','shadow','dissolve'][(r()*5)|0];
  g.amount=g.mode==='dissolve'?60+r()*40:8+r()*55;
  g.size=r()<.3?2:1;
  state.pins=[];
  if(r()<.4){
    const n=1+((r()*2)|0);
    for(let i=0;i<n;i++)state.pins.push({x:.2+r()*.6,y:.3+r()*.5,r:.1+r()*.14,a:(r()<.5?-1:1)*(120+r()*200)});
  }
  selPin=state.pins.length-1;
  selStop=0;_blobs=blobState();
  buildLut();refreshAll();
}
/* ============ URL serialize ============ */
function encodeState(){
  const o={v:1,seed:state.seed,canvas:state.canvas,
    field:{...state.field},
    lut:{stops:state.lut.stops.map(s=>({p:+s.p.toFixed(4),c:s.c,h:s.h||0})),bands:state.lut.bands,invert:state.lut.invert,shift:state.lut.shift},
    grain:{...state.grain},finish:{...state.finish},mask:{...state.mask},motion:{...state.motion},
    pins:(state.pins||[]).map(p=>({x:+p.x.toFixed(4),y:+p.y.toFixed(4),r:+p.r.toFixed(3),a:Math.round(p.a)}))};
  return encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(o)))));
}
function decodeState(hash){
  try{
    const o=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(hash)))));
    if(o.v!==1)return false;
    if(Number.isFinite(o.seed))state.seed=o.seed>>>0;
    if(o.canvas)Object.assign(state.canvas,o.canvas);
    if(o.field)Object.assign(state.field,o.field);
    if(o.lut){
      if(Array.isArray(o.lut.stops)&&o.lut.stops.length>=2)
        state.lut.stops=o.lut.stops.map(s=>({p:clamp(+s.p||0,0,1),c:/^#[0-9a-f]{6}$/i.test(s.c)?s.c:'#888888',h:clamp(+s.h||0,0,100)}));
      state.lut.bands=clamp(o.lut.bands|0,0,24);
      state.lut.invert=!!o.lut.invert;
      state.lut.shift=clamp(+o.lut.shift||0,-100,100);
    }
    if(o.grain)Object.assign(state.grain,o.grain);
    if(o.finish)Object.assign(state.finish,o.finish);
    if(o.mask)Object.assign(state.mask,o.mask);
    if(o.motion)Object.assign(state.motion,o.motion);
    state.pins=Array.isArray(o.pins)?o.pins.slice(0,6).map(p=>({
      x:clamp(+p.x||0,0,1),y:clamp(+p.y||0,0,1),r:clamp(+p.r||.15,.04,.5),a:clamp(+p.a||0,-360,360)})):[];
    selPin=state.pins.length-1;
    selStop=0;_blobs=blobState();
    return true;
  }catch(e){return false}
}

function recordLoopWebM(){
  const m=state.motion;
  if(!m.on||!m.loop){toast('再生+シームレスループON時に録画できます');return}
  if(_recording)return;
  if(!window.MediaRecorder){toast('この環境ではWebM録画に対応していません');return}
  let[W,H]=fullSize();
  const mx=maxRenderSize();
  if(W>mx||H>mx){const sc=mx/Math.max(W,H);W=Math.floor(W*sc);H=Math.floor(H*sc)}
  const rc=document.createElement('canvas');rc.width=W;rc.height=H;
  const rx=rc.getContext('2d');
  const stream=rc.captureStream(30);
  const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';
  const recd=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:24e6});
  const chunks=[];
  recd.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  recd.onstop=()=>{
    _recording=false;
    download(new Blob(chunks,{type:'video/webm'}),'thermal-flow_'+state.seed+'_loop'+m.loopSec+'s.webm');
    toast('WebMを保存しました ('+W+'×'+H+' / '+m.loopSec+'s)');
    const[pw,ph]=previewSize();renderGL(pw,ph,1);
  };
  _recording=true;
  toast('録画中… 1ループ('+m.loopSec+'s)で自動保存します');
  recd.start();
  const t0=performance.now();
  (function frame(){
    const el=(performance.now()-t0)/1000;
    if(el>=m.loopSec){recd.stop();return}
    setAnimPhase(el);
    renderGL(W,H,1);
    rx.clearRect(0,0,W,H);
    rx.drawImage(state.mask.on?composeMasked(W,H):view,0,0);
    requestAnimationFrame(frame);
  })();
}

function drawMaskShape(c,w,h){

  const isTx=m.src==='text';
  [UI.maskText.row,UI.maskText2.row,UI.maskSize.row,UI.maskSize2.row,UI.maskLs.row,UI.maskGap.row]
    .forEach(r=>r.style.display=m.on&&isTx?'':'none');
  UI.maskImgSize.row.style.display=m.on&&!isTx?'':'none';
  UI.maskUpRow.style.display=m.on&&!isTx?'':'none';
  UI.maskYoff.row.style.display=m.on?'':'none';
  UI.maskSrc.row.style.display=m.on?'':'none';
  UI.maskBg.row.style.display=m.on&&!m.transparent?'':'none';
  UI.maskTrans.row.style.display=m.on?'':'none';
}
/* ============ export ============ */
function maxRenderSize(){
  return Math.min(gl.getParameter(gl.MAX_RENDERBUFFER_SIZE)||8192,gl.getParameter(gl.MAX_TEXTURE_SIZE)||8192,10000);
}
function exportPng(mult){
  const[W,H]=fullSize();
  let w=W*mult,h=H*mult;
  const mx=maxRenderSize();
  if(w>mx||h>mx){
    const sc=mx/Math.max(w,h);
    w=Math.floor(w*sc);h=Math.floor(h*sc);
    toast('GPU上限のため '+w+'×'+h+' に縮小して書き出します');
  }
  renderGL(w,h,mult);
  const src=state.mask.on?composeMasked(w,h):view;
  const suffix=state.mask.on?'_mask':'';
  src.toBlob(b=>{
    const[pw,ph]=previewSize();renderGL(pw,ph,1);
    if(b){download(b,'thermal-flow_'+state.seed+'_'+w+'x'+h+suffix+'.png');toast('PNGを保存しました ('+w+'×'+h+')')}
    else toast('書き出しに失敗しました');
  },'image/png');
}
$('#btnPng1').addEventListener('click',()=>exportPng(1));
$('#btnPng2').addEventListener('click',()=>exportPng(2));
$('#btnPng4').addEventListener('click',()=>exportPng(4));
$('#btnCopy').addEventListener('click',()=>{
  if(!navigator.clipboard||!window.ClipboardItem){toast('この環境ではコピーできません');return}
  const[W,H]=fullSize();
  renderGL(W,H,1);
  const cpSrc=state.mask.on?composeMasked(W,H):view;
  try{
    const item=new ClipboardItem({'image/png':new Promise(res=>{cpSrc.toBlob(b=>res(b),'image/png')})});
    navigator.clipboard.write([item]).then(
      ()=>toast('クリップボードにコピーしました'),
      e=>toast('コピー失敗: '+e));
  }catch(e){toast('コピー失敗: '+e.message)}
  const[pw,ph]=previewSize();renderGL(pw,ph,1);
});
/* ============ undo ============ */
const UNDO=[];
function pushUndo(){
  UNDO.push(JSON.stringify({seed:state.seed,canvas:state.canvas,field:state.field,
    lut:{stops:state.lut.stops,bands:state.lut.bands,invert:state.lut.invert,shift:state.lut.shift},
    grain:state.grain,finish:state.finish,mask:state.mask,motion:state.motion,pins:state.pins}));
  if(UNDO.length>60)UNDO.shift();
}
function undo(){
  if(!UNDO.length){toast('これ以上戻れません');return}
  const o=JSON.parse(UNDO.pop());
  state.seed=o.seed;
  Object.assign(state.canvas,o.canvas);
  Object.assign(state.field,o.field);
  state.lut.stops=o.lut.stops;state.lut.bands=o.lut.bands;
  state.lut.invert=o.lut.invert;state.lut.shift=o.lut.shift;
  Object.assign(state.grain,o.grain);
  Object.assign(state.finish,o.finish);
  if(o.mask)Object.assign(state.mask,o.mask);
  if(o.motion)Object.assign(state.motion,o.motion);
  state.pins=o.pins||[];
  selPin=state.pins.length-1;selStop=0;_blobs=blobState();
  buildLut();refreshAll();
  toast('元に戻しました (⌘Z)');
}
/* ============ vortex pins ============ */
const ov=$('#ov'),ovx=ov.getContext('2d');
let selPin=-1,_pinDrag=null,_ovHover=false;
function selPinObj(){return selPin>=0?state.pins[selPin]:null}
function refreshPinCtl(){
  const p=selPinObj();
  if(p){UI.pinRad.set(p.r*100);UI.pinAng.set(p.a)}
}
function syncOverlay(){
  const vb=view.getBoundingClientRect(),sb=$('#stage').getBoundingClientRect();
  const w=Math.round(vb.width),h=Math.round(vb.height);
  ov.style.left=(vb.left-sb.left)+'px';
  ov.style.top=(vb.top-sb.top)+'px';
  const tp=$('#txprev');
  tp.style.left=ov.style.left;tp.style.top=ov.style.top;
  tp.style.width=w+'px';tp.style.height=h+'px';
  tp.style.fontSize=Math.round(w/8)+'px';
  maskCv.style.left=ov.style.left;maskCv.style.top=ov.style.top;
  maskCv.style.width=vb.width+'px';maskCv.style.height=vb.height+'px';
  const mdpr=Math.min(window.devicePixelRatio||1,2),mw=Math.ceil(vb.width*mdpr),mh=Math.ceil(vb.height*mdpr);
  if(maskCv.width!==mw||maskCv.height!==mh){maskCv.width=mw;maskCv.height=mh;drawMaskPreview()}
  if(ov.width!==w||ov.height!==h){ov.width=w;ov.height=h;drawOverlay()}
}
function drawOverlay(){
  const w=ov.width,h=ov.height;
  ovx.clearRect(0,0,w,h);
  ovx.globalAlpha=_ovHover?1:.35;
  if(!(state.pins||[]).length&&_ovHover){
    ovx.font='11px ui-monospace,monospace';
    ovx.fillStyle='rgba(255,255,255,.55)';
    ovx.fillText('クリックで渦ピンを追加',12,22);
  }
  (state.pins||[]).forEach((p,i)=>{
    const x=p.x*w,y=(1-p.y)*h,R=p.r*h,on=i===selPin;
    ovx.beginPath();ovx.arc(x,y,R,0,6.2832);
    ovx.strokeStyle=on?'rgba(255,255,255,.8)':'rgba(255,255,255,.3)';
    ovx.lineWidth=on?1.6:1;
    ovx.setLineDash([4,4]);ovx.stroke();ovx.setLineDash([]);
    /* 回転リング＋ハンドル */
    const dir=p.a>=0?1:-1,a0=-1.5708,a1=a0+dir*Math.max(Math.abs(p.a)/360,.06)*4.2;
    ovx.beginPath();ovx.arc(x,y,R*.55,Math.min(a0,a1),Math.max(a0,a1));
    ovx.strokeStyle=on?'rgba(255,120,40,.95)':'rgba(255,120,40,.5)';
    ovx.lineWidth=2.2;ovx.stroke();
    const hx=x+Math.cos(a1)*R*.55,hy=y+Math.sin(a1)*R*.55;
    ovx.beginPath();ovx.arc(hx,hy,4,0,6.2832);
    ovx.fillStyle='#ff781f';ovx.fill();
    /* 中心ハンドル */
    ovx.beginPath();ovx.arc(x,y,5,0,6.2832);
    ovx.fillStyle=on?'#fff':'rgba(255,255,255,.65)';
    ovx.fill();
    ovx.beginPath();ovx.arc(x,y,5,0,6.2832);
    ovx.strokeStyle='#e05a1f';ovx.lineWidth=2;ovx.stroke();
    if(on){
      ovx.font='10px ui-monospace,monospace';
      ovx.fillStyle='rgba(255,255,255,.7)';
      ovx.fillText(Math.round(p.a)+'°',x+8,y-8);
    }
  });
  ovx.globalAlpha=1;
}
function ovPx(e){
  const b=ov.getBoundingClientRect();
  return{px:e.clientX-b.left,py:e.clientY-b.top};
}
function ovUv(e){
  const{px,py}=ovPx(e);
  return{x:clamp(px/ov.width,0,1),y:clamp(1-py/ov.height,0,1)};
}
/* ゾーン判定: move(中心) / resize(円周) / rotate(円内) */
function hitPinZone(e){
  const{px,py}=ovPx(e);
  let best=null;
  (state.pins||[]).forEach((p,i)=>{
    const x=p.x*ov.width,y=(1-p.y)*ov.height,R=p.r*ov.height;
    const d=Math.hypot(px-x,py-y);
    if(d<11)best={idx:i,zone:'move',d:0};
    else if(Math.abs(d-R)<9&&(!best||best.zone!=='move'))best={idx:i,zone:'resize',d};
    else if(d<R&&!best)best={idx:i,zone:'rotate',d};
  });
  return best;
}
ov.addEventListener('pointerenter',()=>{_ovHover=true;drawOverlay()});
ov.addEventListener('pointerleave',()=>{_ovHover=false;drawOverlay()});
ov.addEventListener('pointerdown',e=>{
  const hit=hitPinZone(e);
  pushUndo();
  if(hit){
    selPin=hit.idx;
    const p=state.pins[selPin];
    const x=p.x*ov.width,y=(1-p.y)*ov.height;
    const{px,py}=ovPx(e);
    _pinDrag={mode:hit.zone,last:Math.atan2(py-y,px-x)};
  }else if((state.pins||[]).length<6){
    const u=ovUv(e);
    state.pins.push({x:u.x,y:u.y,r:.15,a:200});
    selPin=state.pins.length-1;
    _pinDrag={mode:'move',last:0};
    toast('渦ピンを追加（円内ドラッグ＝回転 / 円周＝半径 / 中心＝移動）');
  }else{UNDO.pop();toast('ピンは最大6個です');return}
  ov.setPointerCapture(e.pointerId);
  refreshPinCtl();drawOverlay();redraw();
});
ov.addEventListener('pointermove',e=>{
  if(!_pinDrag){
    const hit=hitPinZone(e);
    ov.style.cursor=!hit?'crosshair':hit.zone==='move'?'move':hit.zone==='resize'?'ew-resize':'grab';
    return;
  }
  const p=selPinObj();
  if(!p)return;
  const{px,py}=ovPx(e);
  if(_pinDrag.mode==='move'){
    const u=ovUv(e);
    p.x=u.x;p.y=u.y;
  }else if(_pinDrag.mode==='resize'){
    const x=p.x*ov.width,y=(1-p.y)*ov.height;
    p.r=clamp(Math.hypot(px-x,py-y)/ov.height,.04,.5);
  }else{
    ov.style.cursor='grabbing';
    const x=p.x*ov.width,y=(1-p.y)*ov.height;
    const cur=Math.atan2(py-y,px-x);
    let d=cur-_pinDrag.last;
    if(d>Math.PI)d-=6.2832;if(d<-Math.PI)d+=6.2832;
    p.a=clamp(p.a+d*57.2958,-360,360);
    _pinDrag.last=cur;
  }
  refreshPinCtl();drawOverlay();redraw();
});
ov.addEventListener('pointerup',()=>{_pinDrag=null});
ov.addEventListener('dblclick',e=>{
  const hit=hitPinZone(e);
  if(hit){state.pins.splice(hit.idx,1);selPin=state.pins.length-1;refreshPinCtl();drawOverlay();redraw()}
});
ov.addEventListener('wheel',e=>{
  const hit=hitPinZone(e);
  if(!hit)return;
  e.preventDefault();
  selPin=hit.idx;
  const p=state.pins[selPin];
  p.a=clamp(p.a+(e.deltaY<0?6:-6),-360,360);
  refreshPinCtl();drawOverlay();redraw();
},{passive:false});
/* ============ misc ============ */
$('#dice').addEventListener('click',()=>{pushUndo();applyRandom((Date.now()^(Math.random()*0xffffffff))>>>0)});
$('#seed').addEventListener('change',()=>{
  const v=Math.abs(parseInt($('#seed').value,10)||0)>>>0;
  pushUndo();
  applyRandom(v);
});
window.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&(e.key==='z'||e.key==='Z')){e.preventDefault();undo();return}
  if(e.target&&/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==='r'||e.key==='R'){e.preventDefault();$('#dice').click()}
  if((e.key==='Backspace'||e.key==='Delete')&&selPin>=0){
    e.preventDefault();pushUndo();
    state.pins.splice(selPin,1);selPin=state.pins.length-1;
    refreshPinCtl();drawOverlay();redraw();
  }
  if(e.key==='Escape'){selPin=-1;drawOverlay()}
});
/* ============ init ============ */
$('#lutSaveBtn').addEventListener('click',commitUserLut);
$('#lutSaveName').addEventListener('keydown',e=>{if(e.key==='Enter')commitUserLut()});
buildPresets();
buildCanvasSec();
buildField();
buildStopCtl();
buildLutOpts();
buildGrain();
buildFinish();
buildMotion();
buildMask();
const qp=new URLSearchParams(location.search).get('p');
if(qp){
  const p=PRESETS.find(x=>x.name.toLowerCase()===qp.toLowerCase());
  if(p){
    if(p.colorOnly&&location.hash.length<=2)applyPreset(PRESETS[0]);
    applyPreset(p);
  }
}else if(location.hash.length<=2){
  applyPreset(PRESETS[0]);
}
if(location.hash.length>2&&decodeState(location.hash.slice(1)))toast('URLから設定を復元しました');
buildLut();
refreshAll();
requestAnimationFrame(loop);
</script>
</body>
