const SKEY = "u19-bracket-gate";
const u8 = b => Uint8Array.from(atob(b), ch => ch.charCodeAt(0));
async function open(id, pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(id.trim().toUpperCase() + "\n" + pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: u8(SALT), iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(IV) }, key, u8(DATA)));
  return { html, key };
}
async function openWithRaw(raw) {
  const key = await crypto.subtle.importKey("raw", u8(raw), "AES-GCM", false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(IV) }, key, u8(DATA)));
}
function show(html) { document.open(); document.write(html); document.close(); }
(async () => { try { const raw = sessionStorage.getItem(SKEY); if (raw) show(await openWithRaw(raw)); } catch (e) { try { sessionStorage.removeItem(SKEY); } catch (_) {} } })();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "確認中…"; err.textContent = "";
  try {
    const { html, key } = await open(document.getElementById("id").value, document.getElementById("pw").value);
    if (document.getElementById("keep").checked) {
      try { const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key)); sessionStorage.setItem(SKEY, btoa(String.fromCharCode(...raw))); } catch (_) {}
    }
    show(html);
  } catch (e2) {
    err.textContent = "IDかパスワードが違います"; btn.disabled = false; btn.textContent = "ログイン";
  }
});
