<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:12px/1.5 "Noto Sans JP",system-ui,sans-serif}
  .app{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:100vh}
  .stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px 24px 40px;min-width:0}
  .frame{position:relative;width:100%;max-width:calc((100vh - 110px) * 16 / 9);aspect-ratio:16/9}
  #cv{width:100%;height:100%;display:block;background:#000;border:1px solid var(--line)}
  .ov{position:absolute;inset:0;pointer-events:none;display:none}
  .ov.on{display:block}
  .ov div{position:absolute;background:rgba(0,0,0,var(--o,.62));border:1px solid rgba(255,255,255,.08)}
  .bar{display:flex;align-items:center;gap:10px;width:100%;max-width:calc((100vh - 110px) * 16 / 9);font:11px/1 var(--font-mono);color:var(--subtext)}
  .bar input[type=range]{flex:1;accent-color:var(--accent)}
  aside{background:var(--panel);border-left:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0}
  .head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  .head h1{font:700 13px/1.2 var(--font-mono);letter-spacing:.1em;margin:0}
  .head p{margin:4px 0 0;color:var(--subtext);font-size:11px}
  .scroll{overflow-y:auto;padding:4px 16px 20px}
  .grp{border-top:1px solid var(--line);padding:10px 0 6px}
  .grp:first-child{border-top:0}
  .grp>h2{font:600 10px/1 var(--font-mono);letter-spacing:.12em;color:var(--subtext);margin:4px 0 9px;text-transform:uppercase}
  .row{display:grid;grid-template-columns:100px minmax(0,1fr) 44px;gap:6px;align-items:center;margin:4px 0}
  .row label{color:var(--text)}
  .row input[type=range]{width:100%;accent-color:var(--accent)}
  .row output{text-align:right;color:var(--subtext);font:11px/1 var(--font-mono)}
  .chk{display:flex;gap:6px;align-items:center;margin:6px 0;color:var(--text)}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  button,select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
  button:hover:not(:disabled),select:hover{border-color:var(--line-hover)}
  button:disabled{opacity:.45;cursor:default}
  button.on{border-color:var(--accent);background:var(--accent-soft)}
  .pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .pri:hover:not(:disabled){filter:brightness(1.1)}
  .lut{height:12px;border-radius:3px;margin:2px 0 4px}
  .note{color:var(--faint);font-size:11px;margin:4px 0}
  .foot{border-top:1px solid var(--line);padding:12px 16px}
  .foot .pri{width:100%;padding:9px}
  #exportNative{display:none;margin-top:8px}
  #exportNative.show{display:block}
  #exStatus{color:var(--subtext);font-size:11px;min-height:1em;margin-top:6px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
  .toast.on{opacity:1}
  @media(max-width:820px){.app{grid-template-columns:1fr;height:auto}aside{border-left:0;border-top:1px solid var(--line)}}
</style>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);

/* ================= settings ================= */
/* 初期値 = 2026-11-02 に maoが書き出したループ（15秒）の見え方 */
const DEF={
  seed:12, arms:3, twist:1.1, density:0.5, warp:0.7, warp2:0.35, octaves:2, detail:0.4,
  inLaps:1, rotLaps:0, loopSec:15, cx:50, cy:50, hole:0.04, holeSoft:0.3, edge:1.0,
  gamma:1.0, contrast:1.15, offset:-0.02, grain:0.02
};
const PRESETS=[
  ['標準',{}],
  ['細かい渦',{seed:7,twist:1.8,density:1.25,warp:1.0,warp2:0.6,octaves:4,detail:0.5,edge:0.15,offset:-0.1,loopSec:8}],
  ['ゆったり',{arms:2,twist:0.8,density:0.4,octaves:1,edge:1.1,loopSec:20}],
  ['湧き出し',{inLaps:-1}],
];
const RANGES={
  seed:[0,99,1],arms:[1,8,1],twist:[-3,3,.05],density:[.3,3,.05],warp:[0,2,.05],warp2:[0,2,.05],octaves:[1,6,1],detail:[.2,.8,.01],
  cx:[0,100,.5],cy:[0,100,.5],hole:[0,.4,.005],holeSoft:[.01,.8,.01],edge:[-1,1.5,.01],
  gamma:[.4,2.5,.01],contrast:[.4,3,.01],offset:[-.6,.6,.01],grain:[0,.15,.005],
  loopSec:[2,30,1],inLaps:[-4,4,1],rotLaps:[-3,3,1]
};
const clampKey=(k,v)=>{const r=RANGES[k];v=Number(v);if(!Number.isFinite(v))return DEF[k];return Math.min(r[1],Math.max(r[0],v));};
let S={...DEF};
function readHash(){
  try{const h=location.hash.slice(1);if(!h)return;const o=JSON.parse(decodeURIComponent(atob(h)));for(const k in DEF)if(k in o)S[k]=clampKey(k,o[k]);}catch(_){}
}
function writeHash(){try{history.replaceState(null,'','#'+btoa(encodeURIComponent(JSON.stringify({v:1,...S}))));}catch(_){}}
readHash();

/* ================= LUT（U19 ミラー黒寄り / B-Spline・OKLab。Thermal Flowと同じ補間） ================= */
const STOPS=[[0,'#000000'],[.05,'#000000'],[.15,'#02070B'],[.28,'#071C2A'],[.38,'#0c3a57'],[.48,'#2c86b4'],[.56,'#54B6DF'],[.65,'#F2EFC9'],[.74,'#E6A06D'],[.82,'#FF5A2A'],[.90,'#FF9A45'],[.96,'#FFC266'],[1,'#FFC266']];
const hex=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)/255);
const toLin=v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);
const fromLin=v=>v<=.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-.055;
function rgb2ok(c){const [r,g,b]=c.map(toLin);
  const l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b),m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b),s=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);
  return[.2104542553*l+.793617785*m-.0040720468*s,1.9779984951*l-2.428592205*m+.4505937099*s,.0259040371*l+.7827717662*m-.808675766*s];}
function ok2rgb([L,a,b]){const l=(L+.3963377774*a+.2158037573*b)**3,m=(L-.1055613458*a-.0638541728*b)**3,s=(L-.0894841775*a-1.291485548*b)**3;
  return[4.0767416621*l-3.3077115913*m+.2309699292*s,-1.2684380046*l+2.6097574011*m-.3413193965*s,-.0041960863*l-.7034186147*m+1.707614701*s].map(v=>Math.min(1,Math.max(0,fromLin(v))));}
function sampleLut(t){
  const st=STOPS;if(t<=st[0][0])return hex(st[0][1]);if(t>=st.at(-1)[0])return hex(st.at(-1)[1]);
  let i=0;while(i<st.length-2&&t>st[i+1][0])i++;
  const u=(t-st[i][0])/Math.max(1e-6,st[i+1][0]-st[i][0]);
  const P=[st[Math.max(0,i-1)],st[i],st[i+1],st[Math.min(st.length-1,i+2)]].map(s=>rgb2ok(hex(s[1])));
  return ok2rgb([0,1,2].map(k=>{const[a,b,c,d]=P.map(v=>v[k]);return((1-u)**3*a+(3*u**3-6*u*u+4)*b+(-3*u**3+3*u*u+3*u+1)*c+u**3*d)/6;}));
}
const LUTN=512,lutPx=new Uint8Array(LUTN*4);
for(let i=0;i<LUTN;i++){const c=sampleLut(i/(LUTN-1));lutPx.set([...c.map(v=>Math.round(v*255)),255],i*4);}

/* ================= WebGL ================= */
const cv=$('#cv'),W=1920,H=1080,FPS=30;
const gl=cv.getContext('webgl',{preserveDrawingBuffer:true,antialias:false});
const VS='attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0,1);}';
const FS=`precision highp float;varying vec2 v;
uniform vec2 uRes,uC,uNorm;uniform float uPhase,uSeed,uArms,uTwist,uDens,uWarp,uWarp2,uDetail,uIn,uRot,uHole,uHoleSoft,uEdge,uGamma,uContrast,uOffset,uGrain;
uniform int uOct,uOut;uniform sampler2D uLut;
const float TAU=6.28318530718;
vec2 hash2(vec2 p){p=vec2(dot(p,vec2(127.1,311.7))+uSeed*17.13,dot(p,vec2(269.5,183.3))+uSeed*9.71);return -1.+2.*fract(sin(p)*43758.5453);}
/* 周期つきグラディエントノイズ：角度方向は腕の数で、半径方向はループで継ぎ目なし */
float pnoise(vec2 p,vec2 per){
  vec2 i=floor(p),f=fract(p);vec2 u=f*f*f*(f*(f*6.-15.)+10.);
  vec2 i00=mod(i,per),i10=mod(i+vec2(1,0),per),i01=mod(i+vec2(0,1),per),i11=mod(i+vec2(1,1),per);
  float a=dot(hash2(i00),f),b=dot(hash2(i10),f-vec2(1,0)),c=dot(hash2(i01),f-vec2(0,1)),d=dot(hash2(i11),f-vec2(1,1));
  return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);
}
float fbm(vec2 p,vec2 per){
  float s=0.,a=.5,n=0.;
  for(int k=0;k<6;k++){if(k>=uOct)break;s+=a*pnoise(p,per);n+=a;p*=2.;per*=2.;a*=uDetail;}
  return s/n;
}
void main(){
  vec2 asp=vec2(uRes.x/uRes.y,1.);
  vec2 d=(v-uC)*asp;
  float r=length(d)+1e-5;
  float th=atan(d.y,d.x)/TAU;
  float lr=log(r);
  /* 対数極座標：x=角度（腕の数で周期）、y=半径の対数。y をずらすと中心へ流れ込む */
  vec2 per=vec2(uArms,4.);
  vec2 q=vec2((th+uTwist*lr/TAU*2.)*uArms+uRot*uPhase*uArms, lr*uDens*1.6+uIn*uPhase*per.y);
  vec2 w1=vec2(fbm(q+vec2(1.7,9.2),per),fbm(q+vec2(8.3,2.8),per));
  vec2 w2=vec2(fbm(q+uWarp*2.*w1+vec2(3.1,5.4),per),fbm(q+uWarp*2.*w1+vec2(6.9,1.3),per));
  float T=fbm(q+uWarp*2.*w1+uWarp2*2.*w2,per)*.5+.5;
  if(uOut==1){gl_FragColor=vec4(T,T,T,1.);return;}
  T=clamp((T-uNorm.x)/max(uNorm.y-uNorm.x,1e-4),0.,1.);
  T=pow(T,uGamma);
  T=(T-.5)*uContrast+.5+uOffset;
  float rn=r/length(asp*.5);
  T+=uEdge*(rn-.5)*.6;
  T*=smoothstep(uHole,uHole+uHoleSoft,r);
  float g=fract(sin(dot(v*uRes+uPhase*91.7,vec2(12.9898,78.233)))*43758.5453)-.5;
  T=clamp(T+g*uGrain,0.,1.);
  gl_FragColor=vec4(texture2D(uLut,vec2(T*(511./512.)+.5/512.,.5)).rgb,1.);
}`;
let U=null,fbo=null,NW=192,NH=108;
if(gl){
  const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(o));return o;};
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const cache={};U=n=>cache[n]||(cache[n]=gl.getUniformLocation(pr,n));
  const ftex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,ftex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,NW,NH,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  fbo=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,ftex,0);gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  const tex=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,LUTN,1,0,gl.RGBA,gl.UNSIGNED_BYTE,lutPx);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
}else{document.body.dataset.mlUnavailable='true';}

function draw(phase,w,h,out,norm){
  gl.viewport(0,0,w,h);
  gl.uniform2f(U('uRes'),W,H);gl.uniform1i(U('uOut'),out);gl.uniform2f(U('uNorm'),norm[0],norm[1]);
  gl.uniform1f(U('uPhase'),phase);
  gl.uniform1f(U('uSeed'),S.seed);gl.uniform1f(U('uArms'),Math.round(S.arms));
  gl.uniform1f(U('uTwist'),S.twist);gl.uniform1f(U('uDens'),S.density);
  gl.uniform1f(U('uWarp'),S.warp);gl.uniform1f(U('uWarp2'),S.warp2);gl.uniform1f(U('uDetail'),S.detail);
  gl.uniform1i(U('uOct'),Math.round(S.octaves));
  gl.uniform1f(U('uIn'),Math.round(S.inLaps));gl.uniform1f(U('uRot'),Math.round(S.rotLaps));
  gl.uniform2f(U('uC'),S.cx/100,1-S.cy/100);
  gl.uniform1f(U('uHole'),S.hole);gl.uniform1f(U('uHoleSoft'),S.holeSoft);gl.uniform1f(U('uEdge'),S.edge);
  gl.uniform1f(U('uGamma'),S.gamma);gl.uniform1f(U('uContrast'),S.contrast);gl.uniform1f(U('uOffset'),S.offset);
  gl.uniform1f(U('uGrain'),S.grain);gl.uniform1i(U('uLut'),0);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
/* フルレンジ：場の明暗を縮小パスで実測し、1〜99%点を0〜1へ。どの設定でもLUTの全色が出る */
let NORM=[0,1],normKey='';
function measure(){
  const key=JSON.stringify([S.seed,S.arms,S.twist,S.density,S.warp,S.warp2,S.octaves,S.detail,S.cx,S.cy]);
  if(key===normKey)return;normKey=key;
  const px=new Uint8Array(NW*NH*4),vals=new Uint8Array(NW*NH*4);let n=0;
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  for(const ph of [0,.25,.5,.75]){draw(ph,NW,NH,1,[0,1]);gl.readPixels(0,0,NW,NH,gl.RGBA,gl.UNSIGNED_BYTE,px);for(let i=0;i<px.length;i+=4)vals[n++]=px[i];}
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  vals.sort();NORM=[vals[Math.floor(n*.01)]/255,vals[Math.floor(n*.99)]/255];
}
function render(phase){if(!gl)return;measure();draw(phase,W,H,0,NORM);}

/* ================= playback ================= */
const EX={on:false,stop:false};
let t=0,playing=true,last=performance.now();
const btnPlay=$('#btnPlay'),seek=$('#seek'),timeEl=$('#time');
function setPlaying(v){playing=v;btnPlay.textContent=v?'Ⅱ':'▶';last=performance.now();}
btnPlay.onclick=()=>setPlaying(!playing);
seek.oninput=()=>{setPlaying(false);t=+seek.value*S.loopSec;};
document.addEventListener('keydown',e=>{if(e.code!=='Space'||e.target.closest('input,select,textarea,button,dialog'))return;e.preventDefault();setPlaying(!playing);});
function tick(now){
  if(!EX.on){
    if(playing)t=(t+(now-last)/1000)%S.loopSec;
    last=now;t=Math.min(t,S.loopSec);render(t/S.loopSec);
    seek.value=String(t/S.loopSec);timeEl.textContent=`${t.toFixed(2)} / ${S.loopSec}s`;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ================= panel ================= */
const ui=$('#ui'),ctrls=[];
function grp(title){const g=document.createElement('div');g.className='grp';const h=document.createElement('h2');h.textContent=title;g.append(h);ui.append(g);return g;}
function rng(g,key,label){
  const [min,max,step]=RANGES[key];
  const r=document.createElement('div');r.className='row';
  const id='r_'+key,l=document.createElement('label');l.textContent=label;l.htmlFor=id;
  const i=document.createElement('input');i.type='range';i.id=id;i.min=min;i.max=max;i.step=step;
  const o=document.createElement('output');
  const sync=()=>{i.value=S[key];o.textContent=step<1?(+S[key]).toFixed(2):String(Math.round(S[key]));};sync();
  i.oninput=()=>{if(EX.on){sync();return;}S[key]=clampKey(key,i.value);sync();writeHash();};
  r.append(l,i,o);g.append(r);ctrls.push(sync);
}
function syncAll(){ctrls.forEach(f=>f());writeHash();}
function note(g,text){const p=document.createElement('p');p.className='note';p.textContent=text;g.append(p);}

let g=grp('プリセット');
const pb=document.createElement('div');pb.className='btns';
PRESETS.forEach(([name,o])=>{const b=document.createElement('button');b.type='button';b.textContent=name;b.onclick=()=>{if(EX.on)return;S={...DEF,...o};t=0;syncAll();};pb.append(b);});
g.append(pb);

g=grp('カラー');
const lb=document.createElement('div');lb.className='lut';
lb.style.background='linear-gradient(90deg,'+Array.from({length:33},(_,i)=>`rgb(${sampleLut(i/32).map(v=>Math.round(v*255))})`).join(',')+')';g.append(lb);

const toastEl=$('#toast');let toastT=0;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('on'),2600);}
const status=$('#exStatus');
const stamp=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;};
async function saveFile(blob,name){
  if(window.claude&&window.claude.use){
    try{const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:name,data:blob});toast(name+' を保存しました');return;}}
    catch(e){if(e&&e.code==='declined')return;toast('保存できませんでした（'+((e&&e.code)||e)+'）');return;}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast(name+' を保存しました');
}

/* MP4 writer (H.264 via WebCodecs) — U19 HUD Sequence / Tile Scroll と同じ */
const enc=new TextEncoder();
function joinBytes(...parts){const arrays=parts.map(p=>typeof p==='string'?enc.encode(p):p),out=new Uint8Array(arrays.reduce((n,a)=>n+a.length,0));let i=0;for(const a of arrays){out.set(a,i);i+=a.length;}return out;}
function be32(...v){const out=new Uint8Array(v.length*4),dv=new DataView(out.buffer);v.forEach((n,i)=>dv.setUint32(i*4,n));return out;}
function be16(...v){const out=new Uint8Array(v.length*2),dv=new DataView(out.buffer);v.forEach((n,i)=>dv.setUint16(i*2,n));return out;}
function atom(type,...parts){const data=joinBytes(...parts);return joinBytes(be32(data.length+8),type,data);}
async function pickMp4Config(w,h,fps){
  if(!('VideoEncoder' in window))return null;
  const bitrate=Math.round(Math.min(120e6,Math.max(8e6,w*h*fps*.33)));
  for(const codec of ['avc1.640028','avc1.4d0028','avc1.42e028']){
    const cfg={codec,width:w,height:h,bitrate,framerate:fps,avc:{format:'avc'},latencyMode:'quality'};
    try{const r=await VideoEncoder.isConfigSupported(cfg);if(r.supported)return cfg;}catch(_){}
  }
  return null;
}
function makeMp4(samples,desc,w,h,fps){
  const N=samples.length,matrix=be32(0x10000,0,0,0,0x10000,0,0,0,0x40000000);
  const ftyp=atom('ftyp','isom',be32(512),'isom','iso2','avc1','mp41');
  const pts=samples.map(s=>Math.round(s.ts*fps/1e6)),D=Math.max(0,...samples.map((s,i)=>i-pts[i]));
  const reorder=pts.some((p,i)=>p!==i);
  const build=off=>{
    const avc1=atom('avc1',new Uint8Array(6),be16(1),be16(0,0),be32(0,0,0),be16(w,h),be32(0x00480000,0x00480000,0),be16(1),new Uint8Array(32),be16(0x18,0xffff),atom('avcC',desc),atom('colr','nclx',be16(1,1,1),new Uint8Array([0])));
    const keys=[];samples.forEach((s,i)=>{if(s.key)keys.push(i+1);});
    const parts=[atom('stsd',be32(0,1),avc1),atom('stts',be32(0,1,N,1))];
    if(reorder)parts.push(atom('ctts',be32(0,N),...samples.map((s,i)=>be32(1,pts[i]-i+D))));
    parts.push(atom('stss',be32(0,keys.length),be32(...keys)),atom('stsc',be32(0,1,1,N,1)),atom('stsz',be32(0,0,N),be32(...samples.map(s=>s.data.length))),atom('stco',be32(0,1,off)));
    const stbl=atom('stbl',...parts);
    const mdia=atom('mdia',atom('mdhd',be32(0,0,0,fps,N),be16(0x55c4,0)),atom('hdlr',be32(0,0),'vide',new Uint8Array(12),'VideoHandler\0'),atom('minf',atom('vmhd',be32(1),be16(0,0,0,0)),atom('dinf',atom('dref',be32(0,1),atom('url ',be32(1)))),stbl));
    const edts=reorder?atom('edts',atom('elst',be32(0,1,N,D,0x10000))):new Uint8Array(0);
    const trak=atom('trak',atom('tkhd',be32(3,0,0,1,0,N),new Uint8Array(8),be16(0,0,0,0),matrix,be32(w*65536,h*65536)),edts,mdia);
    return atom('moov',atom('mvhd',be32(0,0,0,fps,N,0x10000),be16(0x100),new Uint8Array(10),matrix,new Uint8Array(24),be32(2)),trak);
  };
  const mdatSize=samples.reduce((n,s)=>n+s.data.length,8);
  const moov0=build(0),moov=build(ftyp.length+moov0.length+8);
  return new Blob([ftyp,moov,be32(mdatSize),enc.encode('mdat'),...samples.map(s=>s.data)],{type:'video/mp4'});
}

const btnMp4=$('#btnMp4'),btnPng=$('#btnPng'),btnLink=$('#btnLink'),exLoops=$('#exLoops');
async function exportMp4(){
  if(EX.on){EX.stop=true;btnMp4.textContent='中止を待っています…';return;}
  if(!gl){toast('WebGL が使えないため書き出せません');return;}
  EX.on=true;EX.stop=false;btnMp4.textContent='■ 準備中（中止）';
  let encoder=null,rec=null,stream=null,stopped=null;
  try{
    const cfg=await pickMp4Config(W,H,FPS);let mime=null;
    if(!cfg){mime=window.MediaRecorder&&['video/mp4;codecs=avc1.640028','video/mp4','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));if(!mime||!cv.captureStream)throw Error('このブラウザでは動画を書き出せません（Chrome / Edge を使ってください）');}
    const per=Math.round(S.loopSec*FPS),loops=Number(exLoops.value)||1,N=per*loops;
    const samples=[],chunks=[];let desc=null,encErr=null,track=null;
    if(cfg){
      encoder=new VideoEncoder({output:(chunk,meta)=>{if(!desc&&meta&&meta.decoderConfig&&meta.decoderConfig.description)desc=new Uint8Array(meta.decoderConfig.description);const b=new Uint8Array(chunk.byteLength);chunk.copyTo(b);samples.push({data:b,key:chunk.type==='key',ts:chunk.timestamp});},error:e=>{encErr=e;}});
      encoder.configure(cfg);
    }else{
      stream=cv.captureStream(0);track=stream.getVideoTracks()[0];rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:40e6});
      rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};stopped=new Promise(r=>rec.onstop=r);rec.start(200);
    }
    const t0=performance.now();
    for(let i=0;i<N;i++){
      if(EX.stop)break;
      render((i%per)/per);
      if(encoder){
        if(encErr)throw encErr;
        const frame=new VideoFrame(cv,{timestamp:Math.round(i*1e6/FPS),duration:Math.round(1e6/FPS)});
        try{encoder.encode(frame,{keyFrame:i%(FPS*2)===0});}finally{frame.close();}
        while(encoder.encodeQueueSize>6&&!EX.stop&&!encErr)await new Promise(r=>setTimeout(r,2));
      }else{
        while(performance.now()<t0+i*1000/FPS&&!EX.stop)await new Promise(r=>requestAnimationFrame(r));
        track.requestFrame&&track.requestFrame();
      }
      btnMp4.textContent=`■ 中止 ${i+1}/${N}`;status.textContent=`書き出し中 ${Math.round((i+1)/N*100)}%`;
      if(i%2===0)await new Promise(r=>setTimeout(r,0));
    }
    if(encoder){await encoder.flush();if(encErr)throw encErr;}
    else{if(rec.state!=='inactive')rec.stop();await stopped;}
    if(EX.stop){toast('書き出しを中止しました');return;}
    const name=`u19-vortex-${stamp()}_${S.loopSec*loops}s_${FPS}fps`;
    if(encoder){if(!desc||!samples.length)throw Error('MP4 のエンコード結果が空でした');await saveFile(makeMp4(samples,desc,W,H,FPS),name+'.mp4');}
    else{const blob=new Blob(chunks,{type:mime.split(';')[0]});if(!blob.size)throw Error('録画データが空でした');await saveFile(blob,name+(mime.startsWith('video/mp4')?'.mp4':'.webm'));}
  }catch(err){toast('書き出しに失敗しました：'+((err&&err.message)||err));}
  finally{
    try{if(encoder&&encoder.state!=='closed')encoder.close();}catch(_){}
    try{if(rec&&rec.state!=='inactive')rec.stop();}catch(_){}
    try{if(stream)stream.getTracks().forEach(x=>x.stop());}catch(_){}
    EX.on=false;EX.stop=false;btnMp4.textContent='● MP4 を書き出す';status.textContent='';last=performance.now();
  }
}
btnMp4.addEventListener('click',exportMp4);
btnPng.addEventListener('click',()=>{if(!gl||EX.on)return;render(t/S.loopSec);cv.toBlob(b=>b&&saveFile(b,`u19-vortex-${stamp()}.png`),'image/png');});

function setupExport(){
  const X=window.MLExportUI;
  if(!X){$('#mlExport').addEventListener('click',()=>$('#exportNative').classList.toggle('show'));return;}
  X.register({
    id:'u19-vortex',title:'U19 Vortex',trigger:'#mlExport',busy:()=>EX.on,status:['#exStatus'],cancel:()=>{if(EX.on)EX.stop=true;},
    formats:EXPORT_FORMATS,
    fields:{
      size:(f,ui)=>ui.readout('出力サイズ','1920 × 1080 px · 固定'),
      alpha:(f,ui)=>ui.readout('透過','非対応','背景素材として不透明で書き出します。'),
      fps:(f,ui)=>f.id==='mp4'?ui.readout('FPS','30 fps · 固定'):null,
      extra:(f,ui)=>f.id==='mp4'?[ui.readout('長さ',()=>`${S.loopSec * (Number(exLoops.value)||1)} 秒（${S.loopSec} 秒 × ループ回数）`),ui.field('ループ回数',exLoops)]:[]
    },
    actions:[{label:'設定URLをコピー',button:'#btnLink'}]
  });
}
