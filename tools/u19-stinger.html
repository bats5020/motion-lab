  .head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}

  .row input[type=range]{width:100%;accent-color:var(--accent)}
  .row output{text-align:right;color:var(--subtext);font:11px/1 var(--font-mono)}
  .chk{display:flex;gap:6px;align-items:center;margin:6px 0}
  .seg{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}

  button:hover:not(:disabled){border-color:var(--line-hover)}

  button.on{border-color:var(--accent);background:var(--accent-soft)}

  .note{color:var(--faint);font-size:11px;margin:4px 0}

  .drop.has{color:var(--text);border-style:solid}
  @media(max-width:820px){.app{grid-template-columns:1fr;height:auto}aside{border-left:0;border-top:1px solid var(--line)}}

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const W=1920,H=1080,FPS=30;

/* ================= settings ================= */
/* 初期値 = 2026-11-03 に作った3秒案（外から巻き込みで覆う → 1.0秒で切替 → 回転を速めて中心へ消える） */
const DEF={
  dur:3, inEnd:.85, outStart:1.4, outDur:1.5,
  inSpin:.3, outSpin:.6, inLaps:2, edgeW:.45, rimAmt:.55, exitZoom:.35, outSoft:.8, inSoft:.6,
  seed:12, arms:3, twist:1.1, density:.5, warp:.7, warp2:.35,
  bg:'sample', logoOn:0, logoSize:28, logoIn:.55, logoOut:1.3
};
const RANGES={
  dur:[2,5,.1], inEnd:[.3,2,.05], outStart:[.5,3.5,.05], outDur:[.4,3,.05],
  inSpin:[-1,1,.05], outSpin:[-1.5,1.5,.05], inLaps:[0,4,1], edgeW:[0,1,.01], rimAmt:[0,1,.01], exitZoom:[0,.95,.01], outSoft:[0,1,.01], inSoft:[0,1,.01],
  seed:[0,99,1], arms:[1,8,1], twist:[-3,3,.05], density:[.3,3,.05], warp:[0,2,.05], warp2:[0,2,.05],
  logoOn:[0,1,1], logoSize:[5,80,1], logoIn:[0,4,.05], logoOut:[0,5,.05]
};
const clampKey=(k,v)=>{if(k==='bg')return ['sample','check','black'].includes(v)?v:DEF.bg;const r=RANGES[k];v=Number(v);return Number.isFinite(v)?Math.min(r[1],Math.max(r[0],v)):DEF[k];};
let S={...DEF};
try{const h=location.hash.slice(1);if(h){const o=JSON.parse(decodeURIComponent(atob(h)));for(const k in DEF)if(k in o)S[k]=clampKey(k,o[k]);}}catch(_){}
function writeHash(){try{history.replaceState(null,'','#'+btoa(encodeURIComponent(JSON.stringify({v:1,...S}))));}catch(_){}}

/* ================= LUT（U19 ミラー黒寄り / B-Spline・OKLab。U19 Vortex と同じ） ================= */
const STOPS=[[0,'#000000'],[.05,'#000000'],[.15,'#02070B'],[.28,'#071C2A'],[.38,'#0c3a57'],[.48,'#2c86b4'],[.56,'#54B6DF'],[.65,'#F2EFC9'],[.74,'#E6A06D'],[.82,'#FF5A2A'],[.90,'#FF9A45'],[.96,'#FFC266'],[1,'#FFC266']];
const hex=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)/255);
const toLin=v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);
const fromLin=v=>v<=.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-.055;
function rgb2ok(c){const [r,g,b]=c.map(toLin);
  const l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b),m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b),s=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);
  return[.2104542553*l+.793617785*m-.0040720468*s,1.9779984951*l-2.428592205*m+.4505937099*s,.0259040371*l+.7827717662*m-.808675766*s];}
function ok2rgb([L,a,b]){const l=(L+.3963377774*a+.2158037573*b)**3,m=(L-.1055613458*a-.0638541728*b)**3,s=(L-.0894841775*a-1.291485548*b)**3;
  return[4.0767416621*l-3.3077115913*m+.2309699292*s,-1.2684380046*l+2.6097574011*m-.3413193965*s,-.0041960863*l-.7034186147*m+1.707614701*s].map(v=>Math.min(1,Math.max(0,fromLin(v))));}
function sampleLut(t){
  const st=STOPS;if(t<=st[0][0])return hex(st[0][1]);if(t>=st.at(-1)[0])return hex(st.at(-1)[1]);
  let i=0;while(i<st.length-2&&t>st[i+1][0])i++;
  const u=(t-st[i][0])/Math.max(1e-6,st[i+1][0]-st[i][0]);
  const P=[st[Math.max(0,i-1)],st[i],st[i+1],st[Math.min(st.length-1,i+2)]].map(s=>rgb2ok(hex(s[1])));
  return ok2rgb([0,1,2].map(k=>{const[a,b,c,d]=P.map(v=>v[k]);return((1-u)**3*a+(3*u**3-6*u*u+4)*b+(-3*u**3+3*u*u+3*u+1)*c+u**3*d)/6;}));
}
const LUTN=512,lutPx=new Uint8Array(LUTN*4);
for(let i=0;i<LUTN;i++){const c=sampleLut(i/(LUTN-1));lutPx.set([...c.map(v=>Math.round(v*255)),255],i*4);}

/* ================= WebGL（渦＋マスク。透過付き） ================= */
const glc=document.createElement('canvas');glc.width=W;glc.height=H;
const gl=glc.getContext('webgl',{preserveDrawingBuffer:true,antialias:false,alpha:true,premultipliedAlpha:true});
const VS='attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0,1);}';
const FS=`precision highp float;varying vec2 v;
uniform vec2 uRes,uNorm;uniform float uPhase,uSeed,uArms,uTwist,uDens,uWarp,uWarp2,uIn,uRin,uRout,uZoom,uSpin,uEdgeW,uRimAmt,uPout,uOutSoft,uPin,uInSoft;
uniform int uOut;uniform sampler2D uLut;
const float TAU=6.28318530718;
vec2 hash2(vec2 p){p=vec2(dot(p,vec2(127.1,311.7))+uSeed*17.13,dot(p,vec2(269.5,183.3))+uSeed*9.71);return -1.+2.*fract(sin(p)*43758.5453);}
float pnoise(vec2 p,vec2 per){
  vec2 i=floor(p),f=fract(p);vec2 u=f*f*f*(f*(f*6.-15.)+10.);
  vec2 i00=mod(i,per),i10=mod(i+vec2(1,0),per),i01=mod(i+vec2(0,1),per),i11=mod(i+vec2(1,1),per);
  float a=dot(hash2(i00),f),b=dot(hash2(i10),f-vec2(1,0)),c=dot(hash2(i01),f-vec2(0,1)),d=dot(hash2(i11),f-vec2(1,1));
  return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);
}
float fbm(vec2 p,vec2 per){float s=0.,a=.5,n=0.;for(int k=0;k<2;k++){s+=a*pnoise(p,per);n+=a;p*=2.;per*=2.;a*=.4;}return s/n;}
void main(){
  vec2 asp=vec2(uRes.x/uRes.y,1.);
  vec2 d=(v-.5)*asp;
  float r0=length(d)+1e-5,r=r0/uZoom;
  float th=atan(d.y,d.x)/TAU+uSpin;
  float lr=log(r);
  vec2 per=vec2(uArms,4.);
  vec2 q=vec2((th+uTwist*lr/TAU*2.)*uArms, lr*uDens*1.6+uIn*uPhase*per.y);
  vec2 w1=vec2(fbm(q+vec2(1.7,9.2),per),fbm(q+vec2(8.3,2.8),per));
  vec2 w2=vec2(fbm(q+uWarp*2.*w1+vec2(3.1,5.4),per),fbm(q+uWarp*2.*w1+vec2(6.9,1.3),per));
  float T=fbm(q+uWarp*2.*w1+uWarp2*2.*w2,per)*.5+.5;
  if(uOut==1){gl_FragColor=vec4(T,T,T,1.);return;}
  T=clamp((T-uNorm.x)/max(uNorm.y-uNorm.x,1e-4),0.,1.);
  T=(T-.5)*1.15+.48;
  float s=r0/length(asp*.5);
  T+=(s-.5)*.6;
  vec3 col=texture2D(uLut,vec2(clamp(T,0.,1.)*(511./512.)+.5/512.,.5)).rgb;
  /* マスク：渦の腕に沿ったギザで、外から入って中心へ消える */
  float nz=fbm(vec2((th+2.2*log(r0)/TAU*2.)*uArms+uSpin*2.,log(r0)*.6+3.7),per);
  /* 入り：腕に沿ったギザでくっきり巻き込む */
  /* 巻きのギザは外側だけ。中心近くは log 半径で巻きが詰まり、細い縞になるので消す */
  float e=(nz+.6*sin(TAU*(th*uArms+1.6*log(r0))+uSpin*6.)*smoothstep(.12,.6,s))*uEdgeW;
  /* 抜け：渦巻きのギザをやめ、縁をぼかしながら全体を溶かす（細い帯が残らない） */
  float so=uOutSoft*uPout;
  float eo=nz*uEdgeW*(1.-.6*so);
  float fo=.015+.38*so;
  /* 入りの柔らかさ：出だしは縁を大きくぼかし、覆いきるにつれてくっきりさせる。全体もふわっと出す */
  float si=uInSoft*(1.-uPin);
  float fi=.015+.3*si+.12*(1.-smoothstep(0.,.4,s));   /* 中心近くは穴をふんわり閉じる */
  float m=smoothstep(uRin-fi,uRin+fi,s+e)*(1.-smoothstep(uRout-fo,uRout+fo,s+eo));
  m*=mix(1.,smoothstep(0.,.45,uPin),uInSoft);
  m*=1.-uOutSoft*smoothstep(.45,1.,uPout);
  float rim=(1.-smoothstep(0.,.05+.2*si,abs(s+e-uRin)))*(1.-.7*si)*smoothstep(.15,.55,s)+(1.-smoothstep(0.,.05+.2*so,abs(s+eo-uRout)))*(1.-uPout);
  col=mix(col,vec3(1.,.76,.4),clamp(rim,0.,1.)*uRimAmt*m);
  gl_FragColor=vec4(col*m,m);
}`;
let U=null,fbo=null;const NW=192,NH=108;
if(gl){
  const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(o));return o;};
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const cache={};U=n=>cache[n]||(cache[n]=gl.getUniformLocation(pr,n));
  const ft=gl.createTexture();gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,ft);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,NW,NH,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  fbo=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,ft,0);gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  const tex=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,LUTN,1,0,gl.RGBA,gl.UNSIGNED_BYTE,lutPx);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
}else document.body.dataset.mlUnavailable='true';

/* 時間 → マスク・回転・ズーム */
const cl=x=>Math.min(1,Math.max(0,x)),easeOut=x=>1-(1-x)**2.5,easeIn=x=>x**1.2;
function anim(t){
  const pin=easeOut(cl(t/S.inEnd)),pout=easeIn(cl((t-S.outStart)/S.outDur));
  return {phase:t/S.dur,rin:1.75-S.inSoft*.3-pin*(2.45-S.inSoft*.3),pin,rout:1.55-pout*2.35,pout,zoom:1-pout*S.exitZoom,spin:-S.inSpin*(1-pin)+.1*t+S.outSpin*pout*pout};
}
function draw(t,w,h,out,norm){
  const a=anim(t),f=(n,x)=>gl.uniform1f(U(n),x);
  gl.viewport(0,0,w,h);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(U('uRes'),W,H);gl.uniform1i(U('uOut'),out);gl.uniform2f(U('uNorm'),norm[0],norm[1]);
  f('uPhase',out?t:a.phase);f('uSeed',S.seed);f('uArms',Math.round(S.arms));f('uTwist',S.twist);f('uDens',S.density);f('uWarp',S.warp);f('uWarp2',S.warp2);
  f('uIn',Math.round(S.inLaps));f('uRin',out?-9:a.rin);f('uRout',out?9:a.rout);f('uZoom',out?1:a.zoom);f('uSpin',out?0:a.spin);f('uEdgeW',S.edgeW);f('uRimAmt',S.rimAmt);f('uPout',out?0:a.pout);f('uOutSoft',S.outSoft);f('uPin',out?1:a.pin);f('uInSoft',S.inSoft);
  gl.uniform1i(U('uLut'),0);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
/* フルレンジ（形が変わったときだけ測る） */
let NORM=[0,1],normKey='';
function measure(){
  const key=JSON.stringify([S.seed,S.arms,S.twist,S.density,S.warp,S.warp2]);if(key===normKey)return;normKey=key;
  const px=new Uint8Array(NW*NH*4),vals=new Uint8Array(NW*NH*4);let n=0;
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  for(const ph of [0,.25,.5,.75]){draw(ph,NW,NH,1,[0,1]);gl.readPixels(0,0,NW,NH,gl.RGBA,gl.UNSIGNED_BYTE,px);for(let i=0;i<px.length;i+=4)vals[n++]=px[i];}
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);vals.sort();NORM=[vals[Math.floor(n*.01)]/255,vals[Math.floor(n*.99)]/255];
}
/* 画面が完全に覆われている区間を実測 → 切替点（OBS のトランジションポイント） */
let COVER={from:null,to:null,cut:null},coverKey='';
function measureCover(){
  const key=JSON.stringify([S.dur,S.inEnd,S.outStart,S.outDur,S.inSpin,S.outSpin,S.edgeW,S.exitZoom,S.outSoft,S.inSoft,S.seed,S.arms,S.twist]);if(key===coverKey)return;coverKey=key;
  measure();const px=new Uint8Array(NW*NH*4),full=[];
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  const N=Math.round(S.dur*FPS);
  for(let i=0;i<N;i++){draw(i/FPS,NW,NH,0,NORM);gl.readPixels(0,0,NW,NH,gl.RGBA,gl.UNSIGNED_BYTE,px);let ok=true;for(let k=3;k<px.length;k+=4)if(px[k]<250){ok=false;break;}full.push(ok);}
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);

const enc=new TextEncoder();
function joinBytes(...parts){const arrays=parts.map(p=>typeof p==='string'?enc.encode(p):p),out=new Uint8Array(arrays.reduce((n,a)=>n+a.length,0));let i=0;for(const a of arrays){out.set(a,i);i+=a.length;}return out;}

function be16(...v){const out=new Uint8Array(v.length*2),dv=new DataView(out.buffer);v.forEach((n,i)=>dv.setUint16(i*2,n));return out;}

/* ロスレスMOV（PNG・透過付き）— Flame Transition / Thermal Flow と同じ書き出し方式 */
function makeLosslessMov(frames,w,h,fps){
  const count=frames.length,matrix=be32(0x10000,0,0,0,0x10000,0,0,0,0x40000000),ftyp=atom('ftyp','qt  ',be32(0),'qt  '),mdatSize=frames.reduce((n,f)=>n+f.length,8);
  const mvhd=atom('mvhd',be32(0,0,0,fps,count,0x10000),be16(0x100),new Uint8Array(10),matrix,new Uint8Array(24),be32(2));
  const tkhd=atom('tkhd',be32(7,0,0,1,0,count),new Uint8Array(8),be16(0,0,0,0),matrix,be32(w*65536,h*65536));
  const mdhd=atom('mdhd',be32(0,0,0,fps,count),be16(0,0));
  const hdlr=atom('hdlr',be32(0),'mhlr','vide',new Uint8Array(12),new Uint8Array([12]),'VideoHandler');
  const vmhd=atom('vmhd',be32(1),be16(0,0,0,0));
  const dinf=atom('dinf',atom('dref',be32(0,1),atom('url ',be32(1))));
  const compressor=new Uint8Array(32);compressor[0]=3;compressor.set(enc.encode('PNG'),1);
  const sample=atom('png ',new Uint8Array(6),be16(1,0,0),be32(0,0,0),be16(w,h),be32(72*65536,72*65536,0),be16(1),compressor,be16(32,65535));
  const stbl=atom('stbl',atom('stsd',be32(0,1),sample),atom('stts',be32(0,1,count,1)),atom('stsc',be32(0,1,1,count,1)),atom('stsz',be32(0,0,count),be32(...frames.map(f=>f.length))),atom('stco',be32(0,1,ftyp.length+8)));
  const moov=atom('moov',mvhd,atom('trak',tkhd,atom('mdia',mdhd,hdlr,atom('minf',vmhd,dinf,stbl))));
  return new Blob([ftyp,be32(mdatSize),enc.encode('mdat'),...frames,moov],{type:'video/quicktime'});
}
/* MP4（H.264・WebCodecs） — U19 Vortex と同じ */
async function pickMp4Config(w,h,fps){
  if(!('VideoEncoder' in window))return null;
  const bitrate=Math.round(Math.min(120e6,Math.max(16e6,w*h*fps*.6)));
  for(const codec of ['avc1.640028','avc1.4d0028','avc1.42e028']){
    const cfg={codec,width:w,height:h,bitrate,framerate:fps,avc:{format:'avc'},latencyMode:'quality'};
    try{const r=await VideoEncoder.isConfigSupported(cfg);if(r.supported)return cfg;}catch(_){}
  }
  return null;
}
function makeMp4(samples,desc,w,h,fps){
  const N=samples.length,matrix=be32(0x10000,0,0,0,0x10000,0,0,0,0x40000000);
  const ftyp=atom('ftyp','isom',be32(512),'isom','iso2','avc1','mp41');
  const pts=samples.map(s=>Math.round(s.ts*fps/1e6)),D=Math.max(0,...samples.map((s,i)=>i-pts[i]));
  const reorder=pts.some((p,i)=>p!==i);
  const build=off=>{
    const avc1=atom('avc1',new Uint8Array(6),be16(1),be16(0,0),be32(0,0,0),be16(w,h),be32(0x00480000,0x00480000,0),be16(1),new Uint8Array(32),be16(0x18,0xffff),atom('avcC',desc),atom('colr','nclx',be16(1,1,1),new Uint8Array([0])));
    const keys=[];samples.forEach((s,i)=>{if(s.key)keys.push(i+1);});
    const parts=[atom('stsd',be32(0,1),avc1),atom('stts',be32(0,1,N,1))];
    if(reorder)parts.push(atom('ctts',be32(0,N),...samples.map((s,i)=>be32(1,pts[i]-i+D))));
    parts.push(atom('stss',be32(0,keys.length),be32(...keys)),atom('stsc',be32(0,1,1,N,1)),atom('stsz',be32(0,0,N),be32(...samples.map(s=>s.data.length))),atom('stco',be32(0,1,off)));
    const stbl=atom('stbl',...parts);
    const mdia=atom('mdia',atom('mdhd',be32(0,0,0,fps,N),be16(0x55c4,0)),atom('hdlr',be32(0,0),'vide',new Uint8Array(12),'VideoHandler\0'),atom('minf',atom('vmhd',be32(1),be16(0,0,0,0)),atom('dinf',atom('dref',be32(0,1),atom('url ',be32(1)))),stbl));
    const edts=reorder?atom('edts',atom('elst',be32(0,1,N,D,0x10000))):new Uint8Array(0);
    const trak=atom('trak',atom('tkhd',be32(3,0,0,1,0,N),new Uint8Array(8),be16(0,0,0,0),matrix,be32(w*65536,h*65536)),edts,mdia);
    return atom('moov',atom('mvhd',be32(0,0,0,fps,N,0x10000),be16(0x100),new Uint8Array(10),matrix,new Uint8Array(24),be32(2)),trak);
  };
  const mdatSize=samples.reduce((n,s)=>n+s.data.length,8);
  const moov0=build(0),moov=build(ftyp.length+moov0.length+8);
  return new Blob([ftyp,moov,be32(mdatSize),enc.encode('mdat'),...samples.map(s=>s.data)],{type:'video/mp4'});
}

async function exportMov(){

    }

    await saveFile(makeLosslessMov(frames,W,H,FPS),`u19-stinger-${stamp()}${cut}_${FPS}fps.mov`);

async function exportMp4(){
  if(EX.on){EX.stop=true;return;}
  if(!gl){toast('WebGL が使えないため書き出せません');return;}
  begin(btnMp4);let encoder=null;
  try{
    const cfg=await pickMp4Config(W,H,FPS);
    if(!cfg)throw Error('このブラウザは MP4（WebCodecs）に対応していません。Chrome / Edge を使うか、透過MOV を書き出してください');
    const N=Math.round(S.dur*FPS),samples=[];let desc=null,encErr=null;
    encoder=new VideoEncoder({output:(chunk,meta)=>{if(!desc&&meta&&meta.decoderConfig&&meta.decoderConfig.description)desc=new Uint8Array(meta.decoderConfig.description);const b=new Uint8Array(chunk.byteLength);chunk.copyTo(b);samples.push({data:b,key:chunk.type==='key',ts:chunk.timestamp});},error:e=>{encErr=e;}});
    encoder.configure(cfg);
    const bg=S.bg==='sample'?'sample':'black';
    for(let i=0;i<N;i++){
      if(EX.stop)break;if(encErr)throw encErr;
      compose(i/FPS,bg);
      /* 合成済みのピクセルを直接読んでコマにする（キャンバスのスナップショットによるコマ重複を防ぐ） */
      const px=vx.getImageData(0,0,W,H).data;
      const frame=new VideoFrame(px,{format:'RGBA',codedWidth:W,codedHeight:H,timestamp:Math.round(i*1e6/FPS),duration:Math.round(1e6/FPS)});
      try{encoder.encode(frame,{keyFrame:i%(FPS*2)===0});}finally{frame.close();}
      while(encoder.encodeQueueSize>6&&!EX.stop&&!encErr)await new Promise(r=>setTimeout(r,2));
      btnMp4.textContent=`■ 中止 ${i+1}/${N}`;status.textContent=`書き出し中 ${Math.round((i+1)/N*100)}%`;
      if(i%2===0)await new Promise(r=>setTimeout(r,0));
    }
    await encoder.flush();if(encErr)throw encErr;
    if(EX.stop){toast('書き出しを中止しました');return;}
    if(!desc||!samples.length)throw Error('MP4 のエンコード結果が空でした');
    await saveFile(makeMp4(samples,desc,W,H,FPS),`u19-stinger-${stamp()}_${bg}_${FPS}fps.mp4`);
  }catch(err){toast('書き出しに失敗しました：'+((err&&err.message)||err));}
  finally{try{if(encoder&&encoder.state!=='closed')encoder.close();}catch(_){}end(btnMp4,'mp4');}
}

btnLink.addEventListener('click',async()=>{writeHash();try{await navigator.clipboard.writeText(location.href);toast('設定URLをコピーしました');}catch(_){toast('コピーできませんでした。アドレスバーのURLをそのまま使えます');}});

const okGL=()=>gl?{ok:true}:{ok:false,reason:'WebGL が利用できないため書き出せません。'};
function setupExport(){
  const X=window.MLExportUI;
  if(!X){$('#mlExport').addEventListener('click',()=>$('#exportNative').classList.toggle('show'));return;}
  X.register({
    id:'u19-stinger',title:'U19 Stinger',trigger:'#mlExport',busy:()=>EX.on,status:['#exStatus'],cancel:()=>{if(EX.on)EX.stop=true;},
    formats:[
      {id:'mov',label:'透過MOV（PNG・ロスレス）',button:'#btnMov',available:okGL,note:'OBS のスティンガー・AE・Premiere 用。背景なし（透過）で、ロゴも含めて書き出します。3秒で数十MBになります。'},
      {id:'mp4',label:'MP4（背景と合成）',button:'#btnMp4',available:()=>!gl?okGL():('VideoEncoder' in window)?{ok:true}:{ok:false,reason:'このブラウザは WebCodecs に対応していません。Chrome / Edge を使ってください。'},note:'確認・共有用。プレビュー背景（サンプル A→B、チェッカーのときは黒）と合成します。'},
      {id:'png',label:'PNG（現在のコマ・透過）',button:'#btnPng',available:okGL}
    ],
    fields:{
      size:(f,ui)=>ui.readout('出力サイズ','1920 × 1080 px · 固定'),
      alpha:(f,ui)=>ui.readout('透過',f.id==='mp4'?'なし（背景と合成）':'あり'),
      fps:(f,ui)=>f.id==='png'?null:ui.readout('FPS','30 fps · 固定'),
      extra:(f,ui)=>f.id==='png'?[]:[ui.readout('長さ',()=>`${S.dur.toFixed(1)} 秒（${Math.round(S.dur*FPS)} コマ）`),ui.readout('トランジションポイント',()=>COVER.cut!=null?`${Math.round(COVER.cut*1000)} ms`:'覆いきれていません','OBS のスティンガー設定に入れる値です。')]
    },
    actions:[{label:'設定URLをコピー',button:'#btnLink'}]
  });
}
if(document.readyState==='complete')setupExport();else window.addEventListener('load',setupExport);
if(gl){measureCover();requestAnimationFrame(tick);}
window.U19Stinger={get state(){return {...S};},get cover(){return {...COVER};},compose,DEF};
})();
</script>
