<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smearworks</title>
<style>
/* Layout: preview stage on the left, one narrow panel (blur / color / finish) on the right. */
:root{
  --bg:#0a0a0b;
  --panel:#141417;
  --line:#2a2a31;
  --text:#e6e6ef;
  --sub:#9a9aa6;
  --faint:#6a6a74;
  --accent:#4f5cff;
  --mono:"SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
  --jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.5 var(--jp);display:flex}
#stage{flex:1 1 auto;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 800px at 30% 20%,#101014,var(--bg))}
#wrap{position:relative;box-shadow:0 18px 70px rgba(0,0,0,.6),0 0 0 1px #232329;touch-action:none}
#wrap canvas{display:block;width:100%;height:100%}
#ov{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;cursor:crosshair}
#ov .h{cursor:grab}
#info{position:absolute;top:14px;left:16px;font:10.5px/1.4 var(--mono);color:var(--faint);letter-spacing:.04em}
#hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11px;color:var(--faint);pointer-events:none}
#drop{position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;
  color:var(--accent);font-size:14px;letter-spacing:.2em;background:rgba(79,92,255,.08);pointer-events:none;z-index:5}
.error{max-width:420px;padding:16px;background:var(--panel);border:1px solid var(--line)}
#panel{flex:0 0 300px;height:100%;overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
#panel header{padding:18px 18px 14px;border-bottom:1px solid var(--line);display:grid;gap:12px}
#panel h1{margin:0;font:700 15px/1 var(--mono);letter-spacing:.28em}
#panel h1 b{color:#e5141d;font-weight:700}
.row{display:flex;gap:6px;flex-wrap:wrap}
button{font:500 12px/1 var(--jp);border:1px solid var(--line);background:#1c1c21;color:var(--text);padding:9px 12px;border-radius:4px;cursor:pointer}
button:hover{border-color:#3d3d46}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.grow{flex:1}
section{padding:16px 18px 18px;border-bottom:1px solid var(--line);display:grid;gap:12px}
section h2{margin:0;font:700 10.5px/1 var(--mono);letter-spacing:.16em;color:var(--sub)}
.ctl{display:grid;gap:2px}
.ctl .top{display:flex;justify-content:space-between;align-items:baseline}
.ctl label{font-size:12.5px}
output{font:10.5px/1 var(--mono);color:var(--faint);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--text);margin-top:-5.5px;border:2px solid var(--panel)}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--text);border:2px solid var(--panel)}
.colors{display:flex;gap:8px;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--panel);outline:1px solid var(--line);padding:0;cursor:pointer}
.sw[aria-pressed="true"]{outline:2px solid var(--text)}
input[type=color]{width:34px;height:28px;border:1px solid var(--line);background:#1c1c21;padding:2px;border-radius:4px;cursor:pointer}
.check{display:flex;align-items:center;gap:8px;font-size:12.5px}
.foot{margin-top:auto;padding:16px 18px 56px;display:grid;gap:8px}
.note{margin:0;font-size:11px;color:var(--faint)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;font-size:12.5px;border-radius:4px;z-index:40}
#modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:24px 16px}
#modal div{background:var(--panel);padding:16px;display:grid;gap:12px;max-width:min(560px,100%);max-height:100%;overflow:auto}
#modal img{max-height:70vh;width:auto;margin:0 auto;display:block}
#modal p{margin:0;font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a href="../index.html" id="mlab-home" title="MOTION LAB ホームへ" style="position:fixed;bottom:12px;left:12px;z-index:2147483647;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(10,10,12,.72);border:1px solid rgba(255,255,255,.16);color:#e6e6ef;font:600 11px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.08em;text-decoration:none;opacity:.55;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .15s" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.55">&#9670; MOTION LAB</a>

<div id="stage">
  <div id="info">サンプル画像 · 写真をドロップして差し替え</div>
  <div id="wrap"><canvas id="gl"></canvas><svg id="ov" aria-label="ブラーの中心と色の境界"></svg></div>
  <div id="hint">ドラッグでブラーの中心を移動 · 白い点で色の境界を移動 · スペースキーでBefore</div>
  <div id="drop" hidden>ドロップして読み込み</div>
</div>

<aside id="panel">
  <header>
    <h1>SMEAR<b>WORKS</b></h1>
    <div class="row">
      <button type="button" id="pick" class="grow">写真を開く</button>
      <button type="button" id="before" title="押している間、元の写真を表示">Before</button>
    </div>
    <input id="file" type="file" accept="image/*" hidden>
  </header>

  <section>
    <h2>BLUR 人物のブラー</h2>
    <div class="ctl"><div class="top"><label for="blur">強さ</label><output data-o="blur"></output></div><input id="blur" type="range" min="0" max="1" step="0.01" data-k="blur"></div>
    <div class="ctl"><div class="top"><label for="focus">中心の残し方</label><output data-o="focus"></output></div><input id="focus" type="range" min="0" max="1" step="0.01" data-k="focus"></div>
    <div class="ctl"><div class="top"><label for="echo">残像</label><output data-o="echo"></output></div><input id="echo" type="range" min="0" max="1" step="0.01" data-k="echo"></div>
  </section>

  <section>
    <h2>COLOR 右側の色</h2>
    <div class="colors">
      <button type="button" class="sw" data-c="#e5141d" style="background:#e5141d" aria-label="赤"></button>
      <button type="button" class="sw" data-c="#1f4dff" style="background:#1f4dff" aria-label="青"></button>
      <button type="button" class="sw" data-c="#f2cf00" style="background:#f2cf00" aria-label="黄"></button>
      <button type="button" class="sw" data-c="#ff5a1f" style="background:#ff5a1f" aria-label="オレンジ"></button>
      <input type="color" id="col" data-k="col" aria-label="色を選ぶ">
    </div>
    <div class="ctl"><div class="top"><label for="pos">位置</label><output data-o="pos"></output></div><input id="pos" type="range" min="0" max="1" step="0.005" data-k="pos"></div>
    <div class="ctl"><div class="top"><label for="soft">境界のぼかし</label><output data-o="soft"></output></div><input id="soft" type="range" min="0" max="1" step="0.01" data-k="soft"></div>
    <div class="ctl"><div class="top"><label for="face">顔の残り方</label><output data-o="face"></output></div><input id="face" type="range" min="0" max="1" step="0.01" data-k="face"></div>
    <div class="ctl"><div class="top"><label for="angle">角度</label><output data-o="angle"></output></div><input id="angle" type="range" min="-30" max="30" step="1" data-k="angle"></div>
  </section>

  <section>
    <h2>FINISH 仕上げ</h2>
    <div class="ctl"><div class="top"><label for="con">コントラスト</label><output data-o="con"></output></div><input id="con" type="range" min="0.6" max="2.4" step="0.01" data-k="con"></div>
    <div class="ctl"><div class="top"><label for="grain">粒子</label><output data-o="grain"></output></div><input id="grain" type="range" min="0" max="1" step="0.01" data-k="grain"></div>
    <label class="check"><input type="checkbox" id="frame" data-k="frame"> 枠をつける</label>
  </section>

  <div class="foot">
    <button type="button" class="primary" id="export">PNGで書き出す</button>
    <button type="button" id="reset">初期値に戻す</button>
    <p class="note">書き出しは写真の解像度のまま（長辺最大4096px）</p>
  </div>
</aside>

<div id="toast" hidden></div>
<div id="modal" hidden><div><img id="modalImg" alt="書き出した画像"><p>この画面ではファイル保存が使えません。画像を右クリックして保存してください。</p><button type="button" id="modalClose">閉じる</button></div></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);

/* ───── shaders ───── */
const VS = `#version 300 es
out vec2 vUv;
void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); vUv = p; gl_Position = vec4(p*2.-1., 0., 1.); }`;
const HEAD = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform vec2 uRes;
const vec3 LUM = vec3(.2126,.7152,.0722);
vec2 toQ(vec2 uv){ return vec2(uv.x, uv.y*uRes.y/uRes.x); }
vec2 toUV(vec2 q){ return vec2(q.x, q.y*uRes.x/uRes.y); }
float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
`;
const FS = {
  /* 白黒化＋コントラスト（リニアで保持） */
  tone: `uniform sampler2D uTex; uniform float uCon;
void main(){
  float l = dot(texture(uTex, vUv).rgb, LUM);
  l = clamp((l-.5)*uCon + .5, 0., 1.);
  o = vec4(vec3(pow(l, 2.2)), 1.);
}`,
  /* 放射ブラー：中心から離れるほど強く流れ、中心付近は元のまま */
  zoom: `uniform sampler2D uIn; uniform vec2 uC; uniform float uS, uFocus;
void main(){
  vec2 q = toQ(vUv);
  float d = length(q - uC);
  float r0 = uFocus*.32;
  float s = uS*smoothstep(r0, r0 + .28, d);
  if(s < .0005){ o = texture(uIn, vUv); return; }
  float j = hash(gl_FragCoord.xy);
  vec3 a = vec3(0.);
  for(int i=0;i<64;i++){ float t = (float(i)+j)/64.; a += texture(uIn, toUV(mix(q, uC, s*t))).rgb; }
  o = vec4(a/64., 1.);
}`,
  /* 残像：中心から少し拡大したコピーをスクリーンで重ねる */
  echo: `uniform sampler2D uIn; uniform vec2 uC; uniform float uE;
void main(){
  vec2 q = toQ(vUv);
  vec3 c = texture(uIn, vUv).rgb;
  if(uE <= 0.){ o = vec4(c, 1.); return; }
  vec3 g1 = texture(uIn, toUV(uC + (q-uC)/(1. + uE*.09))).rgb;
  vec3 g2 = texture(uIn, toUV(uC + (q-uC)/(1. + uE*.2) + vec2(uE*.015, 0.))).rgb;
  c = mix(c, 1.-(1.-c)*(1.-g1), uE*.55);
  c = mix(c, 1.-(1.-c)*(1.-g2), uE*.3);
  o = vec4(c, 1.);
}`,
  /* 色の入り方＋粒子＋枠 */
  final: `uniform sampler2D uIn, uSrc; uniform vec3 uCol; uniform vec2 uP, uDir;
uniform float uSoft, uFace, uGrain, uFrame, uFlip, uOrig;
void main(){
  vec2 uv = uFlip > .5 ? vec2(vUv.x, 1.-vUv.y) : vUv;
  if(uOrig > .5){ o = vec4(texture(uSrc, uv).rgb, 1.); return; }
  vec2 q = toQ(uv), pc = uv*uRes;
  float l = pow(clamp(texture(uIn, uv).r, 0., 1.), 1./2.2);
  vec3 c = vec3(l);
  /* 右側：明るさを色のランプに通し（暗部は深い色、明部は少し明るい色）、ベタ塗りと混ぜる */
  vec3 C = uCol;
  vec3 ramp = l < .5 ? mix(C*.12, C, l*2.) : mix(C, mix(C, vec3(1.), .3), (l-.5)*2.);
  vec3 layer = mix(C, ramp, uFace);
  float w = .004 + uSoft*.55;
  float m = smoothstep(-w, w, dot(q - uP, uDir));
  c = mix(c, layer, m);
  if(uGrain > 0.){
    float s = uRes.x/1400.;
    vec2 g = floor(pc/max(s, 1.));
    float n = hash(g) + hash(g + 17.3) - 1.;
    c += n*uGrain*.14*(1. - pow(abs(dot(c, LUM) - .5)*2., 2.)*.6);
  }
  if(uFrame > 0.){ float f = uFrame*uRes.x; if(min(min(pc.x, uRes.x-pc.x), min(pc.y, uRes.y-pc.y)) < f) c = vec3(.17); }
  o = vec4(clamp(c, 0., 1.), 1.);
}`
};

/* ───── GL ───── */
const canvas = $('#gl');
const gl = canvas.getContext('webgl2', {antialias:false, premultipliedAlpha:false});
function fatal(m){ $('#stage').innerHTML = `<div class="error"><p><strong>表示できません</strong></p><p>${m}</p></div>`; }
if(!gl){ fatal('このブラウザではWebGL2が使えません。最新のChromeで開いてください。'); return; }
const HALF = !!gl.getExtension('EXT_color_buffer_float') || !!gl.getExtension('EXT_color_buffer_half_float');
const MAXTEX = gl.getParameter(gl.MAX_TEXTURE_SIZE);
gl.bindVertexArray(gl.createVertexArray());
function compile(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const P = {};
try {
  const vs = compile(gl.VERTEX_SHADER, VS);
  for(const [k, src] of Object.entries(FS)){
    const p = gl.createProgram(); gl.attachShader(p, vs); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, HEAD + src)); gl.linkProgram(p);
    if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for(let i=0;i<n;i++){ const info = gl.getActiveUniform(p, i); u[info.name] = gl.getUniformLocation(p, info.name); }
    P[k] = {p, u};
  }
} catch(e){ console.error(e); fatal('シェーダーの初期化に失敗しました。'); return; }
function setU(prog, vals){
  let unit = 0;
  for(const [k, v] of Object.entries(vals)){
    const loc = prog.u[k]; if(!loc) continue;
    if(v instanceof WebGLTexture){ gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, v); gl.uniform1i(loc, unit++); }
    else if(typeof v === 'number') gl.uniform1f(loc, v);
    else if(v.length === 2) gl.uniform2f(loc, v[0], v[1]);
    else gl.uniform3f(loc, v[0], v[1], v[2]);
  }
}
function texParams(min){ gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, min || gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); }
function target(w, h, half){
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, half ? gl.RGBA16F : gl.RGBA8, w, h, 0, gl.RGBA, half ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null); texParams();
  const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return {tex, fb, w, h, ok:gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE};
}
const free = t => { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); };
const makeSet = (w, h) => { const s = {w, h, A:target(w, h, HALF), B:target(w, h, HALF)}; s.ok = s.A.ok && s.B.ok; return s; };
const freeSet = s => { free(s.A); free(s.B); };

let src = null, srcW = 0, srcH = 0;
function upload(img){
  if(src) gl.deleteTexture(src);
  src = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, src);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, img);
  gl.generateMipmap(gl.TEXTURE_2D); texParams(gl.LINEAR_MIPMAP_LINEAR);
  srcW = img.width; srcH = img.height;
}

/* ───── state ───── */
const DEF = {blur:.42, focus:.45, echo:.4, cx:.5, cy:.62, col:'#e5141d', pos:.5, soft:.28, face:.45, angle:0, con:1.45, grain:.35, frame:true};
let S = {...DEF};
const hex3 = h => { const n = parseInt(h.slice(1), 16); return [(n>>16&255)/255, (n>>8&255)/255, (n&255)/255]; };

function pass(prog, t, vals){
  gl.useProgram(prog.p); gl.bindFramebuffer(gl.FRAMEBUFFER, t ? t.fb : null);
  gl.viewport(0, 0, t ? t.w : canvas.width, t ? t.h : canvas.height);
  setU(prog, vals); gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function run(set, out, opts = {}){
  const {w, h} = set, a = h/w, res = [w, h], C = [S.cx, S.cy*a];
  const ang = S.angle*Math.PI/180, dir = [Math.cos(ang), Math.sin(ang)];
  pass(P.tone, set.A, {uRes:res, uTex:src, uCon:S.con});
  pass(P.zoom, set.B, {uRes:res, uIn:set.A.tex, uC:C, uS:S.blur*.55, uFocus:S.focus});
  pass(P.echo, set.A, {uRes:res, uIn:set.B.tex, uC:C, uE:S.echo});
  pass(P.final, out, {uRes:res, uIn:set.A.tex, uSrc:src, uCol:hex3(S.col), uP:[S.pos, .5*a], uDir:dir,
    uSoft:S.soft, uFace:S.face, uGrain:S.grain, uFrame:S.frame ? .012 : 0, uFlip:out ? 0 : 1, uOrig:opts.orig ? 1 : 0});
}
let cache = {}, before = false, sliding = false, dragging = false, raf = 0;
function previewSize(full){
  const lim = !full && (sliding || dragging) ? 900 : 1600, k = Math.min(1, lim/Math.max(srcW, srcH));
  return [Math.max(2, Math.round(srcW*k)), Math.max(2, Math.round(srcH*k))];
}
function draw(){
  raf = 0;
  const [w, h] = previewSize(), key = w + 'x' + h;
  if(canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
  if(!cache[key]){ const ks = Object.keys(cache); if(ks.length >= 2){ freeSet(cache[ks[0]]); delete cache[ks[0]]; } cache[key] = makeSet(w, h); }
  run(cache[key], null, {orig:before});
}
function schedule(){ if(!raf) raf = requestAnimationFrame(draw); overlay(); }

/* ───── layout & handles ───── */
const wrap = $('#wrap'), ov = $('#ov');
function fit(){
  const r = $('#stage').getBoundingClientRect(), k = Math.min((r.width - 80)/srcW, (r.height - 100)/srcH);
  wrap.style.width = srcW*k + 'px'; wrap.style.height = srcH*k + 'px'; overlay();
}
new ResizeObserver(fit).observe($('#stage'));
const NS = 'http://www.w3.org/2000/svg';
function el(tag, at){ const e = document.createElementNS(NS, tag); for(const [k, v] of Object.entries(at)) e.setAttribute(k, v); ov.appendChild(e); return e; }
function overlay(){
  ov.innerHTML = '';
  const W = wrap.clientWidth, H = wrap.clientHeight;
  if(!W || before) return;
  /* 色の境界線（向きに垂直な線） */
  const ang = S.angle*Math.PI/180, dx = Math.cos(ang), dy = Math.sin(ang), px = S.pos*W, py = H/2;
  const L = Math.hypot(W, H), tx = -dy*L, ty = dx*L;
  /* ハンドルは線上の上端寄り（顔に重ならない位置） */
  const hy = H*.06, hx = px - (hy - py)*dy/dx;
  el('line', {x1:px - tx, y1:py - ty, x2:px + tx, y2:py + ty, stroke:'rgba(0,0,0,.5)', 'stroke-width':3});
  el('line', {x1:px - tx, y1:py - ty, x2:px + tx, y2:py + ty, stroke:'#fff', 'stroke-width':1.2, 'stroke-dasharray':'6 6', 'stroke-opacity':.8});
  el('circle', {cx:hx, cy:hy, r:8, fill:'#fff', stroke:'#111', 'stroke-width':1.5, class:'h', 'data-h':'pos'});
  /* ブラーの中心 */
  const cx = S.cx*W, cy = S.cy*H;
  el('circle', {cx, cy, r:11, fill:'none', stroke:'rgba(0,0,0,.55)', 'stroke-width':4});
  el('circle', {cx, cy, r:11, fill:'none', stroke:'#fff', 'stroke-width':1.8});
  el('circle', {cx, cy, r:2.5, fill:'#fff'});
  el('circle', {cx, cy, r:16, fill:'transparent', class:'h', 'data-h':'center'});
}
let dragKey = null;
const uvOf = e => { const r = ov.getBoundingClientRect(); return [(e.clientX - r.left)/r.width, (e.clientY - r.top)/r.height]; };
ov.addEventListener('pointerdown', e => {
  dragKey = e.target.dataset?.h || 'center'; dragging = true;
  ov.setPointerCapture(e.pointerId); move(e);
});
ov.addEventListener('pointermove', e => { if(dragKey) move(e); });
const end = () => { if(dragKey){ dragKey = null; dragging = false; sync(); schedule(); } };
ov.addEventListener('pointerup', end); ov.addEventListener('pointercancel', end);
function move(e){
  const [u, v] = uvOf(e), cl = x => Math.min(1, Math.max(0, x));
  if(dragKey === 'center'){ S.cx = cl(u); S.cy = cl(v); }
  else {
    const a = srcH/srcW, ang = S.angle*Math.PI/180;
    /* 向きに沿った位置だけ動かす */
    const d = (u - S.pos)*Math.cos(ang) + (v - .5)*a*Math.sin(ang);
    S.pos = cl(S.pos + d*Math.cos(ang));
    sync();
  }
  schedule();
}

/* ───── controls ───── */
const FMT = {blur:'pct', focus:'pct', echo:'pct', pos:'pct', soft:'pct', face:'pct', grain:'pct', angle:'deg', con:'x'};
const fmt = (k, v) => FMT[k] === 'pct' ? Math.round(v*100) + '%' : FMT[k] === 'deg' ? v + '°' : '×' + (+v).toFixed(2);
function sync(){
  document.querySelectorAll('[data-k]').forEach(i => {
    const v = S[i.dataset.k];
    if(i.type === 'checkbox') i.checked = !!v; else i.value = v;
    const o = document.querySelector(`output[data-o="${i.dataset.k}"]`); if(o) o.textContent = fmt(i.dataset.k, v);
  });
  document.querySelectorAll('.sw').forEach(b => b.setAttribute('aria-pressed', b.dataset.c.toLowerCase() === S.col.toLowerCase()));
}
document.querySelectorAll('[data-k]').forEach(i => i.addEventListener('input', () => {
  S[i.dataset.k] = i.type === 'checkbox' ? i.checked : i.type === 'range' ? parseFloat(i.value) : i.value;
  sync(); schedule();
}));
document.querySelectorAll('.sw').forEach(b => b.addEventListener('click', () => { S.col = b.dataset.c; sync(); schedule(); }));
document.addEventListener('pointerdown', e => { if(e.target.matches?.('input[type=range]')) sliding = true; });
document.addEventListener('pointerup', () => { if(sliding){ sliding = false; schedule(); } });
$('#reset').addEventListener('click', () => { const {cx, cy} = S; S = {...DEF, cx, cy}; sync(); schedule(); toast('初期値に戻しました'); });
function setBefore(on){ if(before === on) return; before = on; $('#before').setAttribute('aria-pressed', on); schedule(); }
$('#before').addEventListener('pointerdown', () => setBefore(true));
['pointerup','pointerleave','pointercancel'].forEach(ev => $('#before').addEventListener(ev, () => setBefore(false)));
document.addEventListener('keydown', e => { if(e.code === 'Space' && !e.repeat && !/INPUT|BUTTON/.test(e.target.tagName)){ e.preventDefault(); setBefore(true); } });
document.addEventListener('keyup', e => { if(e.code === 'Space') setBefore(false); });

/* ───── photo ───── */
function sample(){
  const c = document.createElement('canvas'), W = 1200, H = 1600; c.width = W; c.height = H;
  const g = c.getContext('2d');
  let gr = g.createLinearGradient(0, 0, W, H); gr.addColorStop(0, '#dadada'); gr.addColorStop(1, '#6a6a6a'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.fillStyle = '#141414'; g.beginPath(); g.ellipse(570, 560, 440, 420, 0, 0, Math.PI*2); g.fill();
  g.fillStyle = '#1d1d1d'; g.beginPath(); g.ellipse(600, 1820, 660, 540, 0, 0, Math.PI*2); g.fill();
  g.fillStyle = '#5a3f33'; g.fillRect(470, 1150, 260, 420);
  gr = g.createRadialGradient(470, 620, 60, 600, 820, 540); gr.addColorStop(0, '#d8b29a'); gr.addColorStop(.55, '#8a5f4b'); gr.addColorStop(1, '#33201a');
  g.fillStyle = gr; g.beginPath(); g.ellipse(600, 820, 320, 430, 0, 0, Math.PI*2); g.fill();
  g.strokeStyle = '#1a0f0b'; g.lineCap = 'round';
  g.lineWidth = 24; [[470, 650], [730, 650]].forEach(([x, y]) => { g.beginPath(); g.moveTo(x-80, y-14); g.quadraticCurveTo(x, y+30, x+80, y-14); g.stroke(); });
  g.lineWidth = 18; [[470, 570], [730, 570]].forEach(([x, y]) => { g.beginPath(); g.moveTo(x-90, y+10); g.quadraticCurveTo(x, y-30, x+90, y+4); g.stroke(); });
  g.fillStyle = 'rgba(40,20,15,.55)'; g.beginPath(); g.ellipse(600, 815, 72, 40, 0, 0, Math.PI*2); g.fill();
  g.fillStyle = '#120505'; g.beginPath(); g.ellipse(600, 1010, 150, 190, 0, 0, Math.PI*2); g.fill();
  g.fillStyle = '#efe6df'; g.beginPath(); g.ellipse(600, 842, 118, 36, 0, 0, Math.PI); g.fill();
  g.fillStyle = '#8c2a2a'; g.beginPath(); g.ellipse(600, 1132, 95, 55, 0, 0, Math.PI*2); g.fill();
  return c;
}
let name = 'smearworks';
function load(f){
  if(!f || !f.type.startsWith('image/')){ toast('画像ファイルを選んでください（JPG / PNG / WebP）'); return; }
  const url = URL.createObjectURL(f), img = new Image();
  img.onload = () => {
    const s = Math.min(1, Math.min(6000, MAXTEX)/Math.max(img.naturalWidth, img.naturalHeight));
    let im = img;
    if(s < 1){ im = document.createElement('canvas'); im.width = Math.round(img.naturalWidth*s); im.height = Math.round(img.naturalHeight*s); im.getContext('2d').drawImage(img, 0, 0, im.width, im.height); }
    upload(im); URL.revokeObjectURL(url);
    name = (f.name || 'image').replace(/\.[^.]+$/, '');
    $('#info').textContent = `${srcW} × ${srcH} · ${f.name || ''}`;
    fit(); schedule(); toast('読み込みました。◎ を口元あたりに合わせてください');
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('この画像は読み込めませんでした'); };
  img.src = url;
}
$('#pick').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', e => { load(e.target.files[0]); e.target.value = ''; });
let depth = 0;
document.addEventListener('dragenter', e => { if([...(e.dataTransfer?.types || [])].includes('Files')){ depth++; $('#drop').hidden = false; } });
document.addEventListener('dragleave', () => { if(--depth <= 0){ depth = 0; $('#drop').hidden = true; } });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); depth = 0; $('#drop').hidden = true; if(e.dataTransfer.files.length) load(e.dataTransfer.files[0]); });
document.addEventListener('paste', e => { const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/')); if(it) load(it.getAsFile()); });

/* ───── export ───── */
let tt = 0;
function toast(m){ const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 3200); }
function fallback(blob){ $('#modalImg').src = URL.createObjectURL(blob); $('#modal').hidden = false; }
$('#modalClose').addEventListener('click', () => $('#modal').hidden = true);
async function save(filename, blob){
  if(window.claude?.use){
    let dl = null; try { dl = await window.claude.use('downloads'); } catch {}
    if(!dl){ fallback(blob); return; }
    try { await dl.save({filename, data:blob}); toast('保存しました'); }
    catch(e){ if(e?.code === 'declined') toast('保存をキャンセルしました'); else if(e?.code === 'rate_limited') toast('保存の確認がすでに開いています'); else fallback(blob); }
    return;
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000); toast('保存しました');
}
$('#export').addEventListener('click', async () => {
  const k = Math.min(1, Math.min(4096, MAXTEX)/Math.max(srcW, srcH)), w = Math.round(srcW*k), h = Math.round(srcH*k);
  toast(`${w} × ${h}px で書き出し中…`);
  await new Promise(r => setTimeout(r, 40));
  const set = makeSet(w, h), out = target(w, h, false);
  if(!set.ok || !out.ok){ freeSet(set); free(out); toast('メモリが足りません。小さい写真で試してください'); return; }
  run(set, out);
  const px = new Uint8Array(w*h*4); gl.bindFramebuffer(gl.FRAMEBUFFER, out.fb); gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
  freeSet(set); free(out); schedule();
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(px.buffer), w, h), 0, 0);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  $('#toast').hidden = true;
  save(`${name}-smear-${w}x${h}.png`, blob);
});

/* ───── boot ───── */
upload(sample()); sync(); fit(); draw(); overlay();
})();
</script>
