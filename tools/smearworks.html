<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smearworks</title>
<style>
/* Layout: darkroom bench — large preview stage left, grouped effect cards right; mode switch and file actions in the top bar. */
:root{
  --ground:#0a0a0b;
  --panel:#141417;
  --ink:#e6e6ef;
  --muted:#9a9aa6;
  --line:#2a2a31;
  --stage:#050506;
  --tone:#4f5cff;
  --tone-ink:#ffffff;
  --brand:#e5141d;
  --font-display:"Helvetica Neue","Arial Black",Arial,sans-serif;
  --font-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;
  --font-mono:"SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:var(--ground);color:var(--ink);font-family:var(--font-body);font-size:13px;line-height:1.5;
  padding-left:16px;padding-right:16px;
  display:flex;flex-direction:column;
}
header{display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-width:0}
.brand h1{margin:0;font-family:var(--font-mono);font-weight:700;font-size:15px;letter-spacing:.28em;line-height:1}
.brand h1 b{color:var(--brand);font-weight:700}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button,.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:2px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--tone);outline-offset:2px}
.primary{background:var(--tone);border-color:var(--tone);color:var(--tone-ink);font-weight:600}
.primary:hover{border-color:var(--ink)}
button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
select,input[type=text],input[type=number]{font:inherit;min-width:0;padding:6px 8px;border:1px solid var(--line);background:var(--ground);color:var(--ink);border-radius:2px}
.vsep{width:1px;height:22px;background:var(--line);margin-inline:4px}
.modes{display:inline-flex;border:1px solid var(--ink);border-radius:2px;overflow:hidden}
.modes button{border:0;border-radius:0;padding:6px 12px;font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.08em;background:transparent;color:var(--ink)}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 368px;padding-block:14px}
.stage{position:relative;background:radial-gradient(1200px 800px at 30% 20%,#101014,var(--stage));min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wrap{position:relative;box-shadow:0 14px 40px rgba(0,0,0,.3);touch-action:none}
.wrap canvas{display:block;width:100%;height:100%}
.wrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;cursor:crosshair}
.wrap svg .h{cursor:grab}
.stage-top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;z-index:2;pointer-events:none}
.stage-top>*{pointer-events:auto}
.chip{font-family:var(--font-mono);font-size:11px;background:var(--panel);color:var(--muted);padding:4px 8px;border:1px solid var(--line)}
.chip strong{color:var(--ink);font-weight:700}
.stage-top .bar button{font-size:11.5px;padding:4px 9px}
.stage-hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);pointer-events:none;padding-inline:12px}
.drophint{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--stage) 82%,transparent);border:2px dashed var(--tone);font-weight:600;font-size:15px}
.error{max-width:420px;padding:16px;background:var(--panel);border:1px solid var(--line)}
aside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-height:0}
.group{font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:var(--muted);padding:14px 16px 6px;border-bottom:1px solid var(--line);background:var(--ground)}
.card{border-bottom:1px solid var(--line)}
.card-h{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 16px}
.card-h .title{flex:1;min-width:0;background:none;border:0;padding:4px 0;font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);justify-content:flex-start;gap:8px}
.card-h .title .jp{font-family:var(--font-body);font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:600}
.card-h .title::after{content:"＋";margin-left:auto;color:var(--muted);font-family:var(--font-body)}
.card.open .card-h .title::after{content:"−"}
.card.active .card-h{background:var(--ink)}
.card.active .card-h .title,.card.active .card-h .title .jp,.card.active .card-h .title::after{color:var(--panel)}
.card-b{padding:4px 16px 16px;display:grid;gap:10px}
.card:not(.open) .card-b{display:none}
.card.off .card-b{opacity:.45}
.sw{position:relative;width:34px;height:20px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:10px;background:var(--line);transition:background .15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--panel);transition:transform .15s}
.sw input:checked+span{background:var(--tone)}
.sw input:checked+span::after{transform:translateX(14px)}
.sw input:focus-visible+span{outline:2px solid var(--tone);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.ctl{display:grid;gap:1px;min-width:0}
.ctl.wide{grid-column:1/-1}
.ctl .row{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.ctl label{font-size:12px}
output{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--ink);margin-top:-5.5px;border:2px solid var(--panel)}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--ink);border:2px solid var(--panel)}
input[type=color]{width:100%;height:28px;border:1px solid var(--line);background:var(--ground);padding:2px;border-radius:2px;cursor:pointer}
.lut{height:14px;border:1px solid var(--line);border-radius:2px}
.mask{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:8px}
.mask .mh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mask .mh span{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:4px 8px;font-size:11.5px;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.check{display:flex;align-items:center;gap:6px;font-size:12px}
.note{font-size:11.5px;color:var(--muted);margin:0}
.small{font-size:11.5px;padding:4px 9px}
.out{padding:16px;display:grid;gap:10px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;font-size:12.5px;border-radius:2px;z-index:40;max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.modal-card{background:var(--panel);padding:16px;display:grid;gap:12px;max-width:min(560px,100%);max-height:100%;overflow:auto}
.modal-card img{max-height:66vh;width:auto;margin:0 auto;display:block}
.modal-card textarea{width:100%;height:240px;font-family:var(--font-mono);font-size:11px;background:var(--ground);color:var(--ink);border:1px solid var(--line)}
.modal-card p{margin:0;font-size:12.5px}

.thermal-link{font-family:var(--font-mono);font-size:11px;color:var(--muted);text-decoration:none;border-bottom:1px dashed var(--line);padding-bottom:1px}
.thermal-link:hover{color:var(--ink)}
body{min-width:1080px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a href="../index.html" id="mlab-home" title="MOTION LAB ホームへ" style="position:fixed;bottom:12px;left:12px;z-index:2147483647;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(10,10,12,.72);border:1px solid rgba(255,255,255,.16);color:#e6e6ef;font:600 11px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.08em;text-decoration:none;opacity:.55;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .15s" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.55">&#9670; MOTION LAB</a>

<header>
  <div class="brand">
    <h1>SMEAR<b>WORKS</b></h1>
    <div class="modes" role="group" aria-label="モード">
      <button type="button" data-mode="portrait">PORTRAIT</button>
      <button type="button" data-mode="hybrid">HYBRID</button>

    <button type="button" id="before" title="押している間、元画像を表示（スペースキーでも可）">Before</button>

<main>
  <div class="stage" id="stage">

      <div class="bar">
        <button type="button" id="showMask" aria-pressed="false" title="編集中の項目のマスク（フローならフロー場）を表示">マスク表示</button>

        <button type="button" class="small" id="jsonIn">JSONを読み込む</button>
      </div>
    </div>
  </aside>
</main>

<div class="toast" id="toast" hidden></div>
<div class="modal" id="modal" hidden>

  </div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);

/* ═════════ shaders ═════════ */
const VS = `#version 300 es
out vec2 vUv;
void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); vUv = p; gl_Position = vec4(p*2.-1., 0., 1.); }`;

const HEAD = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform vec2 uRes; uniform float uSeed;
uniform float uFScale, uFWarp, uFAng, uFStretch, uFEvolve;
const vec3 LUM = vec3(.2126,.7152,.0722);
vec2 toQ(vec2 uv){ return vec2(uv.x, uv.y*uRes.y/uRes.x); }
vec2 toUV(vec2 q){ return vec2(q.x, q.y*uRes.x/uRes.y); }
float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f); vec2 s = vec2(uSeed*17.13, uSeed*5.71);
  float a = hash(i+s), b = hash(i+vec2(1,0)+s), c = hash(i+vec2(0,1)+s), d = hash(i+vec2(1,1)+s);
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}
vec2 rot(vec2 v, float a){ float c = cos(a), s = sin(a); return vec2(c*v.x - s*v.y, s*v.x + c*v.y); }
float fbm(vec2 p){ float s = 0., a = .5; for(int i=0;i<5;i++){ s += a*vnoise(p); p = mat2(1.6,1.2,-1.2,1.6)*p + vec2(11.7,3.1); a *= .5; } return s/.96875; }
vec2 flowP(vec2 q){ vec2 p = rot(q - vec2(.5, .5*uRes.y/uRes.x), -uFAng); p.x /= max(uFStretch, .2); return p*uFScale + uFEvolve; }
float field(vec2 q){
  vec2 p = flowP(q);
  vec2 w = vec2(fbm(p+vec2(1.7,9.2)), fbm(p+vec2(8.3,2.8)));
  p += (w-.5)*uFWarp*3.;
  vec2 w2 = vec2(fbm(p+vec2(4.1,1.3)), fbm(p+vec2(2.6,7.7)));
  return smoothstep(.2, .8, fbm(p + (w2-.5)*uFWarp*2.));
}
vec2 warpVec(vec2 q){ vec2 p = flowP(q)*1.4 + 3.3; return vec2(fbm(p), fbm(p+vec2(5.2,1.3))) - .5; }
struct Mask { int kind; float inv, feather, warp, thr; vec2 c, r, a, b; };
uniform Mask uM;
float maskOf(Mask M, vec2 q){
  if(M.kind == 0) return 1. - M.inv;
  float m;
  if(M.kind == 4){ float f = max(M.feather, .01)*.5; m = smoothstep(M.thr - f, M.thr + f, field(q)); }
  else {
    vec2 qq = M.warp > 0. ? q + warpVec(q)*M.warp*.45 : q;
    if(M.kind == 1){ float r = length((qq-M.c)/max(M.r, vec2(1e-4))); m = 1. - smoothstep(1.-max(M.feather,.001), 1., r); }
    else {
      vec2 ab = M.b - M.a; float t = dot(qq-M.a, ab)/max(dot(ab,ab), 1e-6);
      m = M.kind == 2 ? smoothstep(0., 1., clamp(t,0.,1.)) : smoothstep(0., 1., clamp(1.-abs(t*2.-1.), 0., 1.));
    }
  }
  return mix(m, 1.-m, M.inv);
}
float mask(vec2 q){ return maskOf(uM, q); }
`;

const FS = {
tone: `uniform sampler2D uTex; uniform vec4 uCrop; uniform float uSat,uCon,uBri,uHi,uSh,uLinear;
void main(){
  vec3 c = texture(uTex, uCrop.xy + vUv*uCrop.zw).rgb; float l = dot(c, LUM);
  c = mix(vec3(l), c, uSat);
  c += uSh*.5*(1.-smoothstep(0.,.55,l));
  c += uHi*.5*smoothstep(.45,1.,l);
  c = clamp((c-.5)*uCon + .5 + uBri, 0., 1.);
  o = vec4(uLinear > .5 ? pow(c, vec3(2.2)) : c, 1.);
}`,
zoom: `uniform sampler2D uIn; uniform vec2 uC; uniform float uS;
void main(){
  vec2 q = toQ(vUv); float s = uS*mask(q);
  if(s < .0005){ o = texture(uIn, vUv); return; }
  float j = hash(gl_FragCoord.xy + uSeed);
  vec3 a = vec3(0.);
  for(int i=0;i<48;i++){ float t = (float(i)+j)/48.; a += texture(uIn, toUV(mix(q, uC, s*t))).rgb; }
  o = vec4(a/48., 1.);
}`,
smear: `uniform sampler2D uIn; uniform vec2 uDir, uO; uniform float uLen,uDecay,uMax,uStretch,uSLen,uRough,uDist,uRand;
vec2 remap(vec2 q, float m){
  if(uStretch <= 0.) return q;
  vec2 perp = vec2(-uDir.y, uDir.x);
  float L = max(uSLen, 1e-4);
  float d = dot(q-uO, uDir) - (vnoise(vec2(dot(q-uO, perp)*14., 3.1))-.5)*uRough*L*.9;
  if(d <= 0.) return q;
  float k = 1. + uStretch*7.;
  float nd = d < L ? L*pow(d/L, k) : d;
  return q - uDir*(d - nd)*m;
}
void main(){
  vec2 q = toQ(vUv); float m = mask(q);
  if(m < .001){ o = texture(uIn, vUv); return; }
  vec2 dir = rot(uDir, (vnoise(q*3.2)-.5)*uDist*2.4);
  float len = uLen*m*max(0., 1. + uRand*(vnoise(q*vec2(2.,9.)+11.)-.5)*2.);
  vec2 base = remap(q, m);
  if(len < .0005){ o = texture(uIn, toUV(base)); return; }
  float j = hash(gl_FragCoord.xy + uSeed*3.);
  vec3 acc = vec3(0.), mx = vec3(0.); float ws = 0.;
  for(int i=0;i<56;i++){
    float t = (float(i)+j)/56.;
    float w = exp(-uDecay*t*5.);
    vec3 c = texture(uIn, toUV(base - dir*len*t)).rgb;
    acc += c*w; ws += w; mx = max(mx, c*mix(1., w, .6));
  }
  o = vec4(mix(acc/ws, mx, uMax), 1.);
}`,
echo: `uniform sampler2D uIn; uniform vec2 uDir, uZC; uniform float uGap,uOp,uScale; uniform int uN, uBlend;
void main(){
  vec2 q = toQ(vUv); float m = mask(q);
  vec3 col = texture(uIn, vUv).rgb;
  for(int j=1;j<=5;j++){
    if(j > uN) break;
    float fj = float(j);
    vec2 qq = uZC + (q-uZC)/pow(uScale, fj) - uDir*uGap*fj;
    vec3 g = texture(uIn, toUV(qq)).rgb;
    float a = uOp*(1.-(fj-1.)/(float(uN)+1.))*m;
    vec3 b = uBlend == 0 ? g : uBlend == 1 ? 1.-(1.-col)*(1.-g) : max(col, g);
    col = mix(col, b, a);
  }
  o = vec4(col, 1.);
}`,
blur: `uniform sampler2D uIn; uniform vec2 uStep;
void main(){
  vec3 a = texture(uIn, vUv).rgb*.2270270270;
  a += (texture(uIn, vUv+uStep*1.3846153846).rgb + texture(uIn, vUv-uStep*1.3846153846).rgb)*.3162162162;
  a += (texture(uIn, vUv+uStep*3.2307692308).rgb + texture(uIn, vUv-uStep*3.2307692308).rgb)*.0702702703;
  o = vec4(a, 1.);
}`,
detail: `uniform sampler2D uIn, uOrig, uBlur; uniform float uAmt, uRestore;
void main(){
  vec2 q = toQ(vUv); float m = mask(q);
  vec3 c = texture(uIn, vUv).rgb, og = texture(uOrig, vUv).rgb;
  c = mix(c, og, uRestore*m);
  c += (og - texture(uBlur, vUv).rgb)*uAmt*m*2.;
  o = vec4(max(c, 0.), 1.);
}`,
final: `uniform sampler2D uIn, uSrc, uLut; uniform Mask uM2; uniform vec4 uCrop;
uniform vec3 uCol, uFrameCol, uGlowCol;
uniform float uFill,uOpac,uGrain,uGSize,uFrame,uFlip,uLinear,uColorOn,uShowOrig,uThermalMode;
uniform int uMode;
uniform float uThOn,uThMix,uThCon,uThShift,uThBands,uThBandSoft,uThOp; uniform int uThBlend;
uniform float uGlowOn,uGlowW,uGlowAmt,uGlowIso,uGlowLut,uGlowUseLut; uniform int uGlowSrc,uGlowSide;
uniform float uDitherAmt,uDitherCell,uScan,uScanGap,uSpeck; uniform int uDitherType;
const float BAYER[16] = float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);
vec3 overlayB(vec3 a, vec3 b){ return mix(2.*a*b, 1.-2.*(1.-a)*(1.-b), step(.5, a)); }
float lumAt(vec2 uv){ vec3 c = texture(uIn, uv).rgb; if(uLinear > .5) c = pow(max(c,0.), vec3(1./2.2)); return dot(c, LUM); }
void main(){
  vec2 uv = uFlip > .5 ? vec2(vUv.x, 1.-vUv.y) : vUv;
  vec2 q = toQ(uv), pc = uv*uRes;
  if(uShowOrig > .5){ o = vec4(texture(uSrc, uCrop.xy + uv*uCrop.zw).rgb, 1.); return; }

    if(f > .03) svg('ellipse', {cx, cy, rx:rx*f, ry:ry*f, fill:'none', stroke:'rgba(255,255,255,.55)', 'stroke-width':1, 'stroke-dasharray':'2 4'});
    handle(cx, cy, owner + ':m.c', 'dot', 'マスクの中心');
    handle(cx + rx, cy, owner + ':m.rx', 'small', 'マスクの横幅');
    handle(cx, cy + ry, owner + ':m.ry', 'small', 'マスクの高さ');
  } else {
    const x1 = m.ax*W, y1 = m.ay*H, x2 = m.bx*W, y2 = m.by*H;
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, px = -dy/L*26, py = dx/L*26;
    line(x1 - px, y1 - py, x1 + px, y1 + py); line(x2 - px, y2 - py, x2 + px, y2 + py);
    if(m.type === 'band'){ const mx = (x1 + x2)/2, my = (y1 + y2)/2; line(mx - px*1.6, my - py*1.6, mx + px*1.6, my + py*1.6, true); }
    line(x1, y1, x2, y2, true);
    handle(x1, y1, owner + ':m.a', 'dot', 'マスクの始点');
    handle(x2, y2, owner + ':m.b', 'dot', 'マスクの終点');
  }
}
function smearHandles(W, H){
  const st = S.smear, ox = st.ox*W, oy = st.oy*H, ang = st.angle*Math.PI/180, dx = Math.cos(ang), dy = Math.sin(ang);
  const len = Math.max(st.len, .04)*W, tx = ox + dx*len, ty = oy + dy*len;
  if(st.stretch > 0){
    const px = -dy*40, py = dx*40;
    line(ox - px, oy - py, ox + px, oy + py, true);
    const sx = ox + dx*st.slen*W, sy = oy + dy*st.slen*W;
    line(sx - px*.5, sy - py*.5, sx + px*.5, sy + py*.5, true);
  }
  line(ox, oy, tx, ty);
  const ah = 10, l1 = ang + Math.PI*.82, l2 = ang - Math.PI*.82;
  line(tx, ty, tx + Math.cos(l1)*ah, ty + Math.sin(l1)*ah); line(tx, ty, tx + Math.cos(l2)*ah, ty + Math.sin(l2)*ah);
  handle(ox, oy, 'smear.o', 'dot', 'スミアの起点');
  handle(tx, ty, 'smear.t', 'small', '方向と長さ');
}
function drawOverlay(){
  ov.innerHTML = '';
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const id = active, st = S[id], E = EFFECTS[id];
  ov.style.cursor = id === 'crop' ? 'grab' : '';
  $('#hint').textContent = (E.hint || '') + (S.mode !== 'thermal' ? ' · スペースキーでBefore' : '');
  if(!W || showOrig) return;
  if(id === 'quick'){
    if(S.color.on) maskHandles(S.color.mask, 'color', W, H);
    else if(S.mode === 'hybrid' && S.thermal.on) maskHandles(S.thermal.mask, 'thermal', W, H);
    if(S.smear.on) smearHandles(W, H);
    return;
  }
  if(id === 'crop') return;
  if(st.mask) maskHandles(st.mask, id, W, H);
  if(S.mode === 'thermal') return;
  if(id === 'zoom') handle(st.cx*W, st.cy*H, 'zoom.c', 'ring', 'ブラーの中心');
  if(id === 'echo') handle(S.zoom.cx*W, S.zoom.cy*H, 'zoom.c', 'ring', '拡大の中心');
  if(id === 'smear') smearHandles(W, H);
}
let drag = null;
function uvFrom(e){ const r = ov.getBoundingClientRect(); return [(e.clientX - r.left)/r.width, (e.clientY - r.top)/r.height]; }
function primaryHandle(){
  if(active === 'crop') return 'crop.pan';
  if(S.mode !== 'thermal'){
    if(active === 'quick' || active === 'smear') return 'smear.o';
    if(active === 'zoom' || active === 'echo') return 'zoom.c';
  }
  if(S[active].mask && S[active].mask.type === 'ellipse') return active + ':m.c';
  return null;
}
ov.addEventListener('pointerdown', e => {
  const key = e.target.dataset?.h || primaryHandle();
  if(!key) return;
  e.preventDefault(); ov.setPointerCapture(e.pointerId);
  const [u, v] = uvFrom(e);
  drag = {key, u0:u, v0:v, cx:S.crop.cx, cy:S.crop.cy, rect:cropRect()};
  if(key === 'crop.pan') ov.style.cursor = 'grabbing'; else moveHandle(e);
});
ov.addEventListener('pointermove', e => { if(drag) moveHandle(e); });
const endDrag = () => { if(drag){ drag = null; syncUI(); schedule(); } };
ov.addEventListener('pointerup', endDrag);
ov.addEventListener('pointercancel', endDrag);
ov.addEventListener('wheel', e => {
  if(active !== 'crop' || S.mode === 'thermal') return;
  e.preventDefault();
  S.crop.zoom = Math.min(4, Math.max(1, S.crop.zoom*Math.exp(-e.deltaY*.0015)));
  cropRect(); syncUI(); schedule();
}, {passive:false});
function moveHandle(e){
  const [u, v] = uvFrom(e), [W, H] = dims(), a = H/W, cl = x => Math.min(1.2, Math.max(-.2, x));
  const key = drag.key;
  if(key === 'crop.pan'){
    const r = drag.rect;
    S.crop.cx = drag.cx - (u - drag.u0)*r[2]; S.crop.cy = drag.cy - (v - drag.v0)*r[3];
    cropRect(); schedule(); return;
  }
  if(key === 'zoom.c'){ S.zoom.cx = cl(u); S.zoom.cy = cl(v); }
  else if(key === 'smear.o'){ S.smear.ox = cl(u); S.smear.oy = cl(v); }
  else if(key === 'smear.t'){
    const dx = u - S.smear.ox, dy = (v - S.smear.oy)*a;
    S.smear.len = Math.min(.6, Math.max(0, Math.hypot(dx, dy)));
    S.smear.angle = Math.round(Math.atan2(dy, dx)*180/Math.PI);
    syncUI();
  } else {
    const [owner, k] = key.split(':'), m = S[owner].mask;
    if(k === 'm.c'){ m.cx = cl(u); m.cy = cl(v); }
    else if(k === 'm.rx'){ m.rx = Math.max(.01, Math.abs(u - m.cx)); }
    else if(k === 'm.ry'){ m.ry = Math.max(.01, Math.abs(v - m.cy)*a); }
    else if(k === 'm.a'){ m.ax = cl(u); m.ay = cl(v); }
    else if(k === 'm.b'){ m.bx = cl(u); m.by = cl(v); }
  }
  schedule();
}
document.addEventListener('pointerdown', e => { if(e.target.matches?.('input[type=range]')) sliding = true; });
document.addEventListener('pointerup', () => { if(sliding){ sliding = false; schedule(); } });
$('#showMask').addEventListener('click', () => { showMask = !showMask; $('#showMask').setAttribute('aria-pressed', showMask); schedule(); });

/* ═════════ image loading ═════════ */
function makeSample(){
  const c = document.createElement('canvas'), W = 1200, H = 1600; c.width = W; c.height = H;
  const g = c.getContext('2d');
  let gr = g.createLinearGradient(0, 0, W, H); gr.addColorStop(0, '#dadada'); gr.addColorStop(1, '#6a6a6a');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.fillStyle = '#141414'; g.beginPath(); g.ellipse(570, 560, 440, 420, 0, 0, Math.PI*2); g.fill();
  g.fillStyle = '#1d1d1d'; g.beginPath(); g.ellipse(600, 1820, 660, 540, 0, 0, Math.PI*2); g.fill();
  g.fillStyle = '#5a3f33'; g.fillRect(470, 1150, 260, 420);
  gr = g.createRadialGradient(470, 620, 60, 600, 820, 540); gr.addColorStop(0, '#d8b29a'); gr.addColorStop(.55, '#8a5f4b'); gr.addColorStop(1, '#33201a');
  g.fillStyle = gr; g.beginPath(); g.ellipse(600, 820, 320, 430, 0, 0, Math.PI*2); g.fill();
  g.strokeStyle = '#1a0f0b'; g.lineCap = 'round';
  g.lineWidth = 24; [[470, 650], [730, 650]].forEach(([x, y]) => { g.beginPath(); g.moveTo(x-80, y-14); g.quadraticCurveTo(x, y+30, x+80, y-14); g.stroke(); });
  g.lineWidth = 18; [[470, 570], [730, 570]].forEach(([x, y]) => { g.beginPath(); g.moveTo(x-90, y+10); g.quadraticCurveTo(x, y-30, x+90, y+4); g.stroke(); });
  g.fillStyle = 'rgba(40,20,15,.55)'; g.beginPath(); g.ellipse(600, 815, 72, 40, 0, 0, Math.PI*2); g.fill();
  g.strokeStyle = 'rgba(225,180,160,.55)'; g.lineWidth = 16; g.beginPath(); g.ellipse(600, 1010, 166, 206, 0, 0, Math.PI*2); g.stroke();
  g.fillStyle = '#120505'; g.beginPath(); g.ellipse(600, 1010, 150, 190, 0, 0, Math.PI*2); g.fill();
  g.fillStyle = '#efe6df'; g.beginPath(); g.ellipse(600, 842, 118, 36, 0, 0, Math.PI); g.fill();
  g.fillStyle = '#8c2a2a'; g.beginPath(); g.ellipse(600, 1132, 95, 55, 0, 0, Math.PI*2); g.fill();
  return c;
}
let fileName = 'smearworks';
const escapeHTML = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function loadFile(f){
  if(!f || !f.type.startsWith('image/')){ toast('画像ファイルを選んでください（JPG / PNG / WebP など）'); return; }
  const url = URL.createObjectURL(f), img = new Image();
  img.onload = () => {
    const cap = Math.min(6000, MAXTEX), s = Math.min(1, cap/Math.max(img.naturalWidth, img.naturalHeight));
    let src = img;
    if(s < 1){ src = document.createElement('canvas'); src.width = Math.round(img.naturalWidth*s); src.height = Math.round(img.naturalHeight*s); src.getContext('2d').drawImage(img, 0, 0, src.width, src.height); }
    uploadSource(src); URL.revokeObjectURL(url);
    S.crop = {aspect:S.crop.aspect, zoom:1, cx:.5, cy:.5};
    fileName = (f.name || 'image').replace(/\.[^.]+$/, '');
    srcLabel = `<strong>${srcW} × ${srcH}</strong> · ${escapeHTML(f.name || '画像')}`;
    if(S.mode === 'thermal'){ S.mode = 'hybrid'; syncUI(); toast('写真を読み込んだのでHYBRIDに切り替えました'); }
    else toast('読み込みました。スミアの起点とマスクを顔に合わせてください');
    updateInfo(); fit(); schedule();
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('この画像は読み込めませんでした。JPG か PNG で試してください'); };
  img.src = url;
}
$('#pick').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
let dragDepth = 0;
document.addEventListener('dragenter', e => { if([...(e.dataTransfer?.types || [])].includes('Files')){ dragDepth++; $('#drophint').hidden = false; } });
document.addEventListener('dragleave', () => { if(--dragDepth <= 0){ dragDepth = 0; $('#drophint').hidden = true; } });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('#drophint').hidden = true; if(e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]); });
document.addEventListener('paste', e => { const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/')); if(it) loadFile(it.getAsFile()); });

/* ═════════ before / after ═════════ */
function setBefore(on){ if(showOrig === on || (on && S.mode === 'thermal')) return; showOrig = on; $('#before').setAttribute('aria-pressed', on); schedule(); }
const bb = $('#before');
bb.addEventListener('pointerdown', () => setBefore(true));
['pointerup','pointerleave','pointercancel'].forEach(ev => bb.addEventListener(ev, () => setBefore(false)));
document.addEventListener('keydown', e => { if(e.code === 'Space' && !e.repeat && !/INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName)){ e.preventDefault(); setBefore(true); } });
document.addEventListener('keyup', e => { if(e.code === 'Space') setBefore(false); });

/* ═════════ presets ═════════ */
function buildPresetSelect(){
  const groups = ['Portrait','Hybrid'];
  $('#preset').innerHTML = `<option value="" disabled>プリセット</option>` +
    groups.map(g => `<optgroup label="${g}">${PRESETS.map((p, i) => p.group === g ? `<option value="b${i}">${p.name}</option>` : '').join('')}</optgroup>`).join('') +
    (userPresets.length ? `<optgroup label="保存した設定">${userPresets.map((p, i) => `<option value="u${i}">${escapeHTML(p.name)}</option>`).join('')}</optgroup>` : '');
}
function applyState(s, keepCrop = true){
  const crop = clone(S.crop);
  S = merge(BASE, s);
  if(keepCrop && !s.crop) S.crop = crop;
  if(S.mode === 'thermal') S.mode = 'hybrid';
  buildLut(S.thermal.palette); syncUI(); fit(); schedule();
}
$('#preset').addEventListener('change', e => {
  const v = e.target.value, p = v[0] === 'b' ? PRESETS[+v.slice(1)] : userPresets[+v.slice(1)];
  if(p){ applyState(clone(p.s)); toast(`「${p.name}」を適用しました`); }
});
$('#savePreset').addEventListener('click', () => {
  const d = new Date(), name = `${S.mode.toUpperCase()} ${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  userPresets.push({name, s:clone(S)});
  try { localStorage.setItem('smearworks.presets', JSON.stringify(userPresets)); toast(`「${name}」として保存しました`); }
  catch { toast('このブラウザでは保存できません。JSONで書き出してください'); }
  buildPresetSelect(); $('#preset').value = 'u' + (userPresets.length - 1);
});
$('#reset').addEventListener('click', () => {
  const mode = S.mode, p = PRESETS.find(p => p.group.toLowerCase() === mode);
  applyState(clone(p.s)); $('#preset').value = 'b' + PRESETS.indexOf(p); toast(`${mode.toUpperCase()} の初期設定に戻しました`);
});

/* ═════════ export ═════════ */
let toastT = 0;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3400); }
let dlP = null;
function downloads(){
  if(!dlP) dlP = (async () => { try { return window.claude?.use ? await window.claude.use('downloads') : null; } catch { return null; } })();
  return dlP;
}
if(window.claude?.use) downloads();
let modalURL = null;
function modal({img, text, msg}){
  if(modalURL){ URL.revokeObjectURL(modalURL); modalURL = null; }
  $('#modalImg').hidden = !img; $('#modalText').hidden = !text;
  if(img){ modalURL = URL.createObjectURL(img); $('#modalImg').src = modalURL; }
  if(text) $('#modalText').value = text;
  $('#modalMsg').textContent = msg; $('#modal').hidden = false;
}
$('#modalClose').addEventListener('click', () => $('#modal').hidden = true);
function plainDownload(name, data){
  const blob = data instanceof Blob ? data : new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('保存しました');
}
async function save(name, data, fallback){
  if(!window.claude?.use){ plainDownload(name, data); return; }
  const dl = await downloads();
  if(!dl){ fallback(); return; }
  try { await dl.save({filename:name, data}); toast('保存しました'); }
  catch(e){
    if(e?.code === 'declined') toast('保存をキャンセルしました');
    else if(e?.code === 'rate_limited') toast('保存の確認がすでに開いています');
    else fallback();
  }
}
async function exportImage(){
  const fmt = $('#exFmt').value;
  let w, h;
  if($('#exSize').value === 'preview') [w, h] = previewSize(true);
  else { const [W, H] = dims(), cap = Math.min(4096, MAXTEX), k = S.mode === 'thermal' ? cap/Math.max(W, H) : Math.min(1, cap/Math.max(W, H)); w = Math.round(W*k); h = Math.round(H*k); }
  toast(`${w} × ${h}px で書き出し中…`);
  await new Promise(r => setTimeout(r, 40));
  const set = S.mode === 'thermal' ? null : makeSet(w, h), outT = makeTarget(w, h, false);
  if((set && !set.ok) || !outT.ok){ if(set) freeSet(set); freeTarget(outT); toast('メモリが足りません。サイズを「プレビューと同じ」にして試してください'); return; }
  runPipeline(set, outT, w, h);
  const px = new Uint8Array(w*h*4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, outT.fb);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
  if(set) freeSet(set); freeTarget(outT);
  schedule();
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(px.buffer), w, h), 0, 0);
  const blob = await new Promise(r => c.toBlob(r, fmt === 'jpg' ? 'image/jpeg' : 'image/png', .95));
  $('#toast').hidden = true;
  save(`${S.mode === 'thermal' ? 'thermal' : fileName}-${S.mode}-${w}x${h}.${fmt}`, blob, () => modal({img:blob, msg:'この画面ではファイル保存が使えません。画像を長押し、または右クリックして保存してください。'}));
}
$('#export').addEventListener('click', exportImage);
$('#export2').addEventListener('click', exportImage);
$('#jsonOut').addEventListener('click', () => {
  const text = JSON.stringify({app:'smearworks', version:2, settings:S}, null, 2);
  save('smearworks-settings.json', text, () => modal({text, msg:'この画面ではファイル保存が使えません。上のテキストをコピーして保存してください。'}));
});
$('#jsonIn').addEventListener('click', () => $('#jsonFile').click());
$('#jsonFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if(!f) return;
  try { const j = JSON.parse(await f.text()); applyState(j.settings || j); toast('設定を読み込みました'); }
  catch { toast('JSONを読み込めませんでした。書き出したファイルか確認してください'); }
});

/* ═════════ boot ═════════ */
uploadSource(makeSample());
buildLut(S.thermal.palette);
buildCards(); buildPresetSelect(); $('#preset').value = 'b0';
syncUI(); fit(); draw(); drawOverlay();
window.__sw = {applyPreset:i => applyState(clone(PRESETS[i].s)), setActive, toggleMask:() => $('#showMask').click()};
})();
</script>
