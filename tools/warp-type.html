<style>
:root{
  --bg:#0a0a0b; --panel:#141417; --panel2:#1c1c21; --line:#2a2a31;
  --text:#e6e6ef; --sub:#9a9aa6; --faint:#6a6a74; --accent:#4f5cff;
  --mono:"SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:12px/1.5 var(--mono);overflow:hidden}
#app{display:flex;height:100vh;width:100vw}
#stage{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
#topbar{display:flex;align-items:baseline;gap:14px;padding:14px 20px 0;flex:0 0 auto}
#topbar h1{font-size:13px;font-weight:700;letter-spacing:.28em;color:var(--text)}
#topbar p{font-size:10px;color:var(--faint);letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#view{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:20px;position:relative}
#cv{display:block;background:#000;border:1px solid var(--panel2);box-shadow:0 8px 40px rgba(0,0,0,.55)}
#panel{flex:0 0 300px;width:300px;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;overflow-x:hidden}
#panel::-webkit-scrollbar{width:8px}
#panel::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
#panel::-webkit-scrollbar-track{background:transparent}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:11px 16px;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--sub);cursor:pointer;user-select:none;-webkit-user-select:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";font-size:9px;color:var(--faint);transition:transform .15s}
details:not([open]) summary::after{transform:rotate(-90deg)}
summary:hover{color:var(--text)}
.body{padding:4px 16px 14px}
.row{display:flex;align-items:center;gap:8px;min-height:28px;margin:3px 0}
.row>label{flex:0 0 84px;font-size:11px;color:var(--sub);letter-spacing:.02em}
.row .val{flex:0 0 44px;text-align:right;font-size:10px;color:var(--faint);white-space:nowrap}
input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:3px;background:var(--line);border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;background:var(--text);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);transition:background .12s}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:active::-webkit-slider-thumb{background:var(--accent)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--text);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
input[type=range]::-moz-range-track{height:3px;background:var(--line);border-radius:2px}
select,input[type=text],input[type=number]{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--text);font:11px var(--mono);padding:5px 7px;border-radius:5px;outline:none}
select:focus,input[type=text]:focus,input[type=number]:focus{border-color:var(--accent)}
select{cursor:pointer;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);background-position:calc(100% - 14px) 55%,calc(100% - 10px) 55%;background-size:4px 4px;background-repeat:no-repeat;padding-right:24px}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=color]{flex:0 0 40px;width:40px;height:24px;padding:0;border:1px solid var(--line);border-radius:5px;background:var(--panel2);cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
input[type=color]::-webkit-color-swatch{border:none;border-radius:3px}
input[type=color]::-moz-color-swatch{border:none;border-radius:3px}
button{background:var(--panel2);border:1px solid var(--line);color:var(--text);font:600 11px var(--mono);letter-spacing:.05em;padding:8px 10px;border-radius:6px;cursor:pointer;transition:border-color .12s,background .12s}
button:hover:not(:disabled){border-color:var(--accent)}
button:active:not(:disabled){background:#22222a}
button:disabled{opacity:.4;cursor:not-allowed}
button.rec-on{border-color:#ff4f5c;color:#ff4f5c}
.btn-row{display:flex;gap:8px;margin:6px 0}
.btn-row button{flex:1}
.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
#btn-random{width:100%;margin-top:2px;border-style:dashed}
.note{font-size:10px;color:var(--faint);margin:4px 0 2px;line-height:1.6}
</style>

<div id="app">
  <main id="stage">
    <div id="topbar">
      <h1>WARP TYPE</h1>
      <p>テキストをテクスチャ化し、UV座標をパーリンノイズで揺らすスペースタイプ系ジェネレーター</p>
    </div>
    <div id="view"><canvas id="cv"></canvas></div>
  </main>
  <aside id="panel">

    <details open>
      <summary>キャンバス</summary>
      <div class="body">
        <div class="row"><label>アスペクト</label>
          <select id="i-aspect">
            <option value="16:9" selected>16:9</option><option value="4:3">4:3</option>
            <option value="1:1">1:1</option><option value="9:16">9:16</option>

        </div>
        <div class="row"><label>サイズ px</label>
          <input type="number" id="i-expw" min="200" max="4096" step="1" value="1600">
          <span class="val" id="v-exp">×900</span>
        </div>
      </div>

    <details open>

        <div class="row"><label>フォント</label>
          <select id="i-font">
            <option value="0" selected>Playfair Display</option>
            <option value="1">Work Sans</option>
            <option value="2">Roboto Condensed Bold</option>
            <option value="3">Aguafina Script</option>
            <option value="4">Roboto Thin</option>
            <option value="5">Noto Sans JP Black</option>
            <option value="6">Noto Serif JP</option>

        </div>
        <div class="row"><label>文字サイズ</label><input type="range" id="i-fsize" min="20" max="500" step="1" value="170"><span class="val" id="v-fsize">170</span></div>
        <div class="row"><label>行送り</label><input type="range" id="i-leading" min="0" max="2" step="0.01" value="0.6"><span class="val" id="v-leading">0.60</span></div>

    <details open>

        <div class="row"><label>うねり量</label><input type="range" id="i-radius" min="0" max="1" step="0.01" value="0.25"><span class="val" id="v-radius">0.25</span></div>
        <div class="row"><label>複雑さ</label><input type="range" id="i-tumult" min="0" max="18.85" step="0.1" value="6.28"><span class="val" id="v-tumult">2.0π</span></div>
        <div class="row"><label>列</label><input type="range" id="i-cols" min="1" max="150" step="1" value="45"><span class="val" id="v-cols">45</span></div>
        <div class="row"><label>行</label><input type="range" id="i-rows" min="1" max="150" step="1" value="45"><span class="val" id="v-rows">45</span></div>
        <div class="row"><label>歪みの偏り</label>

        <div class="row"><label>背景色</label><input type="color" id="i-back" value="#000000"><span class="val" id="v-back">#000000</span></div>
        <div class="btn-row"><button id="btn-invert">反転</button></div>

    </details>

    <details open>
      <summary>プリセット</summary>

          <button data-preset="default">DEFAULT</button>
          <button data-preset="yours">ALL YOURS</button>
          <button data-preset="ok">JUST OK</button>
          <button data-preset="notsogood">NOT SO GOOD</button>
          <button data-preset="circle">CIRCLE</button>
          <button data-preset="kiken">危険（JP）</button>

        <button id="btn-random">ランダム</button>
      </div>

    <details open>
      <summary>書き出し</summary>
      <div class="body">
        <div class="btn-row"><button id="btn-png">PNG保存</button><button id="btn-webm">WebM録画</button></div>
        <p class="note">録画はもう一度押すと停止してダウンロードされます。</p>
      </div>
    </details>

  </aside>
</div>

<script>
"use strict";
/* =====================================================================
   Warp Type — spacetypegenerator.com/danger の手法を素のWebGLで再実装
   仕組み:
     1) テキスト1行ごとにオフスクリーン2D canvasへ白文字で描画しテクスチャ化
     2) 各行を 列×行 のグリッド（TRIANGLE_STRIP）で描画。頂点位置は固定
     3) UV座標だけを3Dパーリンノイズ（p5互換の4オクターブ値ノイズ）で
        角度に変換し、sin/cos で揺らす。振幅は右上アンカーからの距離で減衰
   ===================================================================== */

const FONTS = [
  { family:"Playfair Display",  weight:500, tall:false },
  { family:"Work Sans",         weight:400, tall:false },
  { family:"Roboto Condensed",  weight:700, tall:false },
  { family:"Aguafina Script",   weight:400, tall:true  },
  { family:"Roboto",            weight:100, tall:false },
  { family:"Noto Sans JP",      weight:900, tall:false },
  { family:"Noto Serif JP",     weight:600, tall:false },
];

const state = {
  expW:1600, expH:900, aspect:"16:9",
  text:"ALL|GOOD|THINGS|I HOPE.",
  font:0, fontSize:170, leading:0.6,
  speed:20, radius:0.25, tumult:2*Math.PI,
  cols:45, rows:45, falloff:"diag",
  fore:"#ffffff", back:"#000000",
  paused:false,
};

/* ---------- p5互換ノイズ（4オクターブ・値ノイズ / cosine補間） ---------- */
const NZ = (()=>{
  const YWRAPB=4, YWRAP=1<<YWRAPB, ZWRAPB=8, ZWRAP=1<<ZWRAPB, SIZE=4095;
  const OCTAVES=4, FALLOFF=0.5;
  let perlin;
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function seed(s){
    const rnd = mulberry32(s);
    perlin = new Float32Array(SIZE+1);
    for(let i=0;i<=SIZE;i++) perlin[i]=rnd();
  }
  const scos = i => 0.5*(1-Math.cos(i*Math.PI));
  function noise(x,y,z){
    if(x<0)x=-x; if(y<0)y=-y; if(z<0)z=-z;
    let xi=Math.floor(x), yi=Math.floor(y), zi=Math.floor(z);
    let xf=x-xi, yf=y-yi, zf=z-zi;
    let r=0, ampl=0.5;
    for(let o=0;o<OCTAVES;o++){
      let of=xi+(yi<<YWRAPB)+(zi<<ZWRAPB);
      const rxf=scos(xf), ryf=scos(yf);
      let n1=perlin[of&SIZE];        n1+=rxf*(perlin[(of+1)&SIZE]-n1);
      let n2=perlin[(of+YWRAP)&SIZE];n2+=rxf*(perlin[(of+YWRAP+1)&SIZE]-n2);
      n1+=ryf*(n2-n1);
      of+=ZWRAP;
      let n3=perlin[of&SIZE];        n3+=rxf*(perlin[(of+1)&SIZE]-n3);
      let n4=perlin[(of+YWRAP)&SIZE];n4+=rxf*(perlin[(of+YWRAP+1)&SIZE]-n4);
      n3+=ryf*(n4-n3);
      n1+=scos(zf)*(n3-n1);
      r+=n1*ampl; ampl*=FALLOFF;
      xi<<=1; xf*=2; yi<<=1; yf*=2; zi<<=1; zf*=2;
      if(xf>=1){xi++;xf--} if(yf>=1){yi++;yf--} if(zf>=1){zi++;zf--}
    }
    return r;
  }
  seed(1234);
  return { noise, seed };
})();

/* ---------- WebGL ---------- */
const cv = document.getElementById("cv");
const gl = cv.getContext("webgl", { preserveDrawingBuffer:true, alpha:false, antialias:true });

const VS = `
attribute vec2 a_pos; attribute vec2 a_uv;
uniform vec2 u_res; uniform vec2 u_offset;
varying vec2 v_uv;
void main(){
  vec2 p = (a_pos + u_offset) / u_res * 2.0 - 1.0;
  gl_Position = vec4(p.x, -p.y, 0.0, 1.0);
  v_uv = a_uv;
}`;
const FS = `
precision mediump float;
uniform sampler2D u_tex; uniform vec3 u_color;
varying vec2 v_uv;
void main(){
  float a = texture2D(u_tex, v_uv).a;
  gl_FragColor = vec4(u_color * a, a);
}`;

function makeShader(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, makeShader(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, makeShader(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const loc = {
  pos: gl.getAttribLocation(prog,"a_pos"), uv: gl.getAttribLocation(prog,"a_uv"),
  res: gl.getUniformLocation(prog,"u_res"), offset: gl.getUniformLocation(prog,"u_offset"),
  tex: gl.getUniformLocation(prog,"u_tex"), color: gl.getUniformLocation(prog,"u_color"),
};
gl.enableVertexAttribArray(loc.pos);
gl.enableVertexAttribArray(loc.uv);
gl.enable(gl.BLEND);
gl.blendFuncSeparate(gl.ONE, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);

/* ---------- 行ごとのテクスチャ＋メッシュ ---------- */
/* lines[i] = { texW, texH, tex, posBuf, uvBuf, posArr, uvArr, vertCount } */
let lines = [];
let texH = 0;     // 全行共通のテクスチャ高さ（行送りの基準）
const measureCtx = document.createElement("canvas").getContext("2d");

function fontCSS(sizePx){
  const f = FONTS[state.font];
  return `${f.weight} ${sizePx}px "${f.family}"`;
}

async function rebuildTextures(){
  const f = FONTS[state.font];
  try { await document.fonts.load(fontCSS(100), "AGありOK"); } catch(e){}
  for(const L of lines){ gl.deleteTexture(L.tex); gl.deleteBuffer(L.posBuf); gl.deleteBuffer(L.uvBuf); }
  lines = [];

  const fs = state.fontSize;
  const hMul = f.tall ? 1.75 : 1.2;
  const wMul = f.tall ? 1.75 : 1.4;
  const nudge = f.tall ? fs*0.35/2 : fs*0.35;
  texH = Math.max(4, Math.round(fs*hMul));

  measureCtx.font = fontCSS(fs);
  const parts = state.text.split("|");
  for(const part of parts){
    const w = Math.max(10, measureCtx.measureText(part).width*1.015);
    const texW = Math.max(4, Math.round(w*wMul));
    const c = document.createElement("canvas");
    c.width = texW; c.height = texH;
    const ctx = c.getContext("2d");
    ctx.font = fontCSS(fs);
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#ffffff";
    ctx.fillText(part, texW/2, texH/2 + nudge);

    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

    lines.push({ texW, texH, tex, posBuf:gl.createBuffer(), uvBuf:gl.createBuffer(), posArr:null, uvArr:null, vertCount:0 });
  }
  rebuildMesh();
}

/* 頂点位置は固定。行ストリップ間はデジェネレート頂点で連結して1ドローに */
function rebuildMesh(){
  const cols = state.cols, rows = state.rows;
  for(const L of lines){
    const xs = L.texW/cols, ys = L.texH/rows;
    const n = rows*(cols+1)*2 + (rows-1)*2;
    const pos = new Float32Array(n*2);
    let p = 0;
    const put = (x,y)=>{ pos[p++]=x; pos[p++]=y; };
    for(let y=0;y<rows;y++){
      if(y>0){ put(cols*xs, y*ys); put(0, y*ys); }       // degenerate join
      for(let x=0;x<=cols;x++){ put(x*xs, y*ys); put(x*xs, (y+1)*ys); }
    }
    L.posArr = pos;
    L.uvArr = new Float32Array(n*2);
    L.vertCount = n;
    gl.bindBuffer(gl.ARRAY_BUFFER, L.posBuf);
    gl.bufferData(gl.ARRAY_BUFFER, pos, gl.STATIC_DRAW);
  }
}

/* 本家と同じイージング: t^4 / (t^4 + (1-t)^4) */
function easer(t){ const a=t*t*t*t, b=(1-t)*(1-t)*(1-t)*(1-t); return a/(a+b); }

/* 毎フレーム: グリッド格子点のノイズ角度→UVを計算 */
const gridA = { arr:null, w:0, h:0 };
function updateUVs(L, z, frame){
  const cols = state.cols, rows = state.rows;
  const xs = L.texW/cols, ys = L.texH/rows;
  const ns = state.speed/1000;
  const tumult = state.tumult;
  const radiusNoise = state.radius * state.fontSize * 2;   // 本家: slider × map(fontSize,0,1,0,2)
  const ax = L.texW, ay = -L.texH*2;                       // 歪み減衰のアンカー（右上遠方）
  const baseSpot = Math.hypot(0-ax, L.texH-ay);
  const uniform = state.falloff === "uniform";

  const gw = cols+1, gh = rows+1;
  if(gridA.w!==gw || gridA.h!==gh){ gridA.arr = new Float32Array(gw*gh*2); gridA.w=gw; gridA.h=gh; }
  const G = gridA.arr;   // [angle, radius] per格子点
  const nx0 = -(ns*15)*frame, ny0 = (ns*5)*frame, nz = frame*ns;
  for(let y=0;y<gh;y++){
    for(let x=0;x<gw;x++){
      const nv = NZ.noise((x+nx0)*0.1, (y + z*rows + ny0)*0.1, nz);
      const angle = -tumult + nv*(2*tumult);
      let radius;
      if(uniform){
        radius = radiusNoise;
      } else {
        const d = Math.hypot(x*xs-ax, y*ys-ay);
        let t = 1 - d/baseSpot; if(t<0)t=0; if(t>1)t=1;
        radius = easer(t)*radiusNoise;
      }
      const i=(y*gw+x)*2; G[i]=angle; G[i+1]=radius;
    }
  }

  const uv = L.uvArr;
  let p = 0;
  const iw = 1/L.texW, ih = 1/L.texH;
  const putUV = (u,v)=>{ uv[p++]=u; uv[p++]=v; };
  for(let y=0;y<rows;y++){
    if(y>0){
      // degenerate: 直前の最終頂点と次行の先頭頂点を複製（UV値は描画に影響しない）
      putUV(uv[p-2], uv[p-1]); putUV(0,0);
    }
    for(let x=0;x<=cols;x++){
      const it=(y*gw+x)*2, ib=((y+1)*gw+x)*2;
      const aT=G[it], rT=G[it+1], aB=G[ib], rB=G[ib+1];
      // 本家仕様: u は上端頂点のノイズを上下で共有、v は各行のノイズ
      const u  = (x*xs + Math.sin(aT)*rT)*iw;
      const vT = (y*ys     + Math.cos(aT)*rT)*ih;
      const vB = ((y+1)*ys + Math.cos(aB)*rB)*ih;
      putUV(u, vT); putUV(u, vB);
    }
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, L.uvBuf);
  gl.bufferData(gl.ARRAY_BUFFER, uv, gl.DYNAMIC_DRAW);
}

/* ---------- 描画ループ ---------- */
function hexRGB(hex){ return [parseInt(hex.slice(1,3),16)/255, parseInt(hex.slice(3,5),16)/255, parseInt(hex.slice(5,7),16)/255]; }

let frame = 0, lastT = 0;
function render(t){
  requestAnimationFrame(render);
  const dt = lastT ? Math.min(0.1,(t-lastT)/1000) : 0;
  lastT = t;
  if(!state.paused) frame += dt*30;   // 本家は30fps基準のframeCount

  const [br,bg,bb] = hexRGB(state.back);
  gl.viewport(0,0,cv.width,cv.height);
  gl.clearColor(br,bg,bb,1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(loc.res, cv.width, cv.height);
  gl.uniform3fv(loc.color, hexRGB(state.fore));
  gl.uniform1i(loc.tex, 0);
  gl.activeTexture(gl.TEXTURE0);

  const n = lines.length;
  for(let z=0;z<n;z++){
    const L = lines[z];
    updateUVs(L, z, frame);
    // 本家の配置: 中央基準で行送り分スタック
    const ox = cv.width/2 - L.texW/2;
    const oy = cv.height/2 - L.texH/2 - L.texH*state.leading*(n-1)/2 + L.texH*z*state.leading;
    gl.uniform2f(loc.offset, ox, oy);
    gl.bindTexture(gl.TEXTURE_2D, L.tex);
    gl.bindBuffer(gl.ARRAY_BUFFER, L.posBuf);
    gl.vertexAttribPointer(loc.pos, 2, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, L.uvBuf);
    gl.vertexAttribPointer(loc.uv, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, L.vertCount);
  }
}

/* ---------- キャンバスサイズ ---------- */
const view = document.getElementById("view");
function applySize(){
  const [aw,ah] = state.aspect.split(":").map(Number);
  state.expH = Math.round(state.expW*ah/aw);
  cv.width = state.expW; cv.height = state.expH;
  document.getElementById("v-exp").textContent = "×"+state.expH;
  fitPreview();
}
function fitPreview(){
  const r = view.getBoundingClientRect();
  const availW = r.width-40, availH = r.height-40;
  const s = Math.min(availW/cv.width, availH/cv.height, 1);
  cv.style.width = Math.round(cv.width*s)+"px";
  cv.style.height = Math.round(cv.height*s)+"px";
}
window.addEventListener("resize", fitPreview);

/* ---------- UIバインド ---------- */
const $ = id => document.getElementById(id);
function bindRange(id, key, vid, fmt){
  $(id).addEventListener("input", e=>{
    state[key] = parseFloat(e.target.value);
    $(vid).textContent = fmt ? fmt(state[key]) : e.target.value;
    if(key==="fontSize"||key==="leading") rebuildTextures();
    if(key==="cols"||key==="rows") rebuildMesh();
  });
}
bindRange("i-fsize","fontSize","v-fsize");
bindRange("i-leading","leading","v-leading", v=>v.toFixed(2));
bindRange("i-speed","speed","v-speed");
bindRange("i-radius","radius","v-radius", v=>v.toFixed(2));
bindRange("i-tumult","tumult","v-tumult", v=>(v/Math.PI).toFixed(1)+"π");
bindRange("i-cols","cols","v-cols");
bindRange("i-rows","rows","v-rows");

$("i-text").addEventListener("input", e=>{ state.text = e.target.value; rebuildTextures(); });
$("i-font").addEventListener("change", e=>{ state.font = +e.target.value; rebuildTextures(); });
$("i-falloff").addEventListener("change", e=>{ state.falloff = e.target.value; });
$("i-aspect").addEventListener("change", e=>{ state.aspect = e.target.value; applySize(); });
$("i-expw").addEventListener("change", e=>{
  state.expW = Math.max(200, Math.min(4096, +e.target.value||1600));
  e.target.value = state.expW; applySize();
});
$("i-fore").addEventListener("input", e=>{ state.fore=e.target.value; $("v-fore").textContent=e.target.value; });
$("i-back").addEventListener("input", e=>{ state.back=e.target.value; $("v-back").textContent=e.target.value; });
$("btn-invert").addEventListener("click", ()=>{
  [state.fore, state.back] = [state.back, state.fore];
  $("i-fore").value = state.fore; $("v-fore").textContent = state.fore;
  $("i-back").value = state.back; $("v-back").textContent = state.back;
});
$("btn-pause").addEventListener("click", e=>{
  state.paused = !state.paused;
  e.target.textContent = state.paused ? "再生" : "一時停止";
});
$("btn-reseed").addEventListener("click", ()=>{ NZ.seed((Math.random()*1e9)|0); });

/* ---------- プリセット ---------- */
const PRESETS = {
  default:   { text:"ALL|GOOD|THINGS|I HOPE.", font:0, fontSize:170, leading:0.6,  speed:20, radius:0.25, tumult:2*Math.PI, cols:45, rows:45,  fore:"#ffffff", back:"#000000" },
  yours:     { text:"One|day|all|this|will|be|yours.", font:0, fontSize:85, leading:0.75, speed:20, radius:0.8, tumult:5*Math.PI, cols:45, rows:45, fore:"#ffffff", back:"#000000" },
  ok:        { text:"OK", font:4, fontSize:500, leading:0.6, speed:12, radius:0.8, tumult:5*Math.PI, cols:15, rows:150, fore:"#ffffff", back:"#000000" },
  notsogood: { text:"NOT|SO|GOOD", font:2, fontSize:220, leading:0.65, speed:10, radius:1, tumult:5*Math.PI, cols:30, rows:30, fore:"#000000", back:"#ffffff" },
  circle:    { text:" O ", font:1, fontSize:500, leading:0, speed:20, radius:1, tumult:2*Math.PI, cols:30, rows:150, fore:"#000000", back:"#ffffff" },
  kiken:     { text:"危険|注意", font:5, fontSize:200, leading:0.75, speed:14, radius:0.6, tumult:4*Math.PI, cols:60, rows:60, fore:"#ffdd00", back:"#111111" },
};
function applyState(){
  $("i-text").value = state.text;
  $("i-font").value = String(state.font);
  $("i-fsize").value = state.fontSize; $("v-fsize").textContent = state.fontSize;
  $("i-leading").value = state.leading; $("v-leading").textContent = state.leading.toFixed(2);
  $("i-speed").value = state.speed; $("v-speed").textContent = state.speed;
  $("i-radius").value = state.radius; $("v-radius").textContent = state.radius.toFixed(2);
  $("i-tumult").value = state.tumult; $("v-tumult").textContent = (state.tumult/Math.PI).toFixed(1)+"π";
  $("i-cols").value = state.cols; $("v-cols").textContent = state.cols;
  $("i-rows").value = state.rows; $("v-rows").textContent = state.rows;
  $("i-fore").value = state.fore; $("v-fore").textContent = state.fore;
  $("i-back").value = state.back; $("v-back").textContent = state.back;
  rebuildTextures();
}
document.querySelectorAll("[data-preset]").forEach(b=>{
  b.addEventListener("click", ()=>{ Object.assign(state, PRESETS[b.dataset.preset]); applyState(); });
});
$("btn-random").addEventListener("click", ()=>{
  const r=(a,b)=>a+Math.random()*(b-a);
  Object.assign(state, {
    speed: Math.round(r(5,35)), radius:+r(0.1,1).toFixed(2),
    tumult:+r(Math.PI,6*Math.PI).toFixed(2),
    cols: Math.round(r(10,120)), rows: Math.round(r(10,120)),
    font: (Math.random()*FONTS.length)|0,
  });
  NZ.seed((Math.random()*1e9)|0);
  applyState();
});

/* ---------- 書き出し ---------- */
$("btn-png").addEventListener("click", ()=>{
  cv.toBlob(b=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b); a.download="warp-type.png"; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  },"image/png");
});

const btnWebm = $("btn-webm");
let recorder=null, recording=false, chunks=[];
let canRec = !!(window.MediaRecorder && HTMLCanvasElement.prototype.captureStream);
let recMime = "";
if(canRec){
  for(const m of ["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"]){
    if(MediaRecorder.isTypeSupported(m)){ recMime=m; break; }
  }
  if(!recMime) canRec=false;
}
if(!canRec){ btnWebm.disabled=true; btnWebm.title="このブラウザはWebM録画（MediaRecorder）に対応していません"; }
btnWebm.addEventListener("click", ()=>{
  if(!canRec) return;
  if(recording){ recorder.stop(); return; }
  chunks=[];
  const stream = cv.captureStream(60);
  try { recorder = new MediaRecorder(stream, { mimeType:recMime, videoBitsPerSecond:12000000 }); }
  catch(e){ btnWebm.disabled=true; return; }
  recorder.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
  recorder.onstop = ()=>{
    recording=false; btnWebm.classList.remove("rec-on"); btnWebm.textContent="WebM録画";
    const blob = new Blob(chunks,{type:"video/webm"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="warp-type.webm"; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  };
  recorder.start();
  recording=true; btnWebm.classList.add("rec-on"); btnWebm.textContent="録画停止";
});

/* ---------- 起動 ---------- */
applySize();
rebuildTextures();
requestAnimationFrame(render);
// Webフォント読み込み完了後に文字を描き直す
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>rebuildTextures());
</script>
</body>
</html>
