<title>U19 Aberration</title>
<style>
:root{
  --bg:#0a0a0b;--panel:#141417;--panel2:#1c1c21;--line:#2a2a31;

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:12px/1.5 var(--mono);-webkit-font-smoothing:antialiased;overflow:hidden}
#app{display:flex;width:100vw;height:100vh}
#stage{flex:1 1 auto;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;padding:34px;background:

#view{max-width:100%;max-height:100%;display:block;box-shadow:0 18px 70px rgba(0,0,0,.6),0 0 0 1px #232329;background:#000}
#meta{position:absolute;bottom:14px;right:16px;color:var(--faint);font-size:10px;letter-spacing:.06em;pointer-events:none}
#recbadge{position:absolute;top:18px;left:20px;display:none;align-items:center;gap:7px;color:#ff5a5a;

  border-radius:999px;padding:6px 14px;pointer-events:none}
#recbadge.on{display:inline-flex}
#recbadge i{width:8px;height:8px;border-radius:50%;background:#ff3040;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
#panel{flex:0 0 330px;width:330px;height:100%;overflow-y:auto;background:var(--panel);

#panel::-webkit-scrollbar{width:8px}

#panel h1 em{color:var(--accent);font-style:normal}
#panel header p{margin:0 0 12px;color:var(--sub);font-size:10.5px;letter-spacing:.02em}
#dice{width:100%;padding:10px;border:none;border-radius:6px;cursor:pointer;

.seedrow label{color:var(--sub);font-size:10.5px;letter-spacing:.1em}
#seed{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:4px;

section>h2{margin:0 0 10px;font-size:10.5px;color:var(--sub);letter-spacing:.24em;font-weight:600}
section>h2 b{color:var(--faint);font-weight:600;margin-right:6px}
.sub{margin:12px 0 2px;color:var(--faint);font-size:9.5px;letter-spacing:.18em}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.seg button{flex:1;background:none;border:none;color:var(--sub);font:10.5px var(--mono);

.seg button.on{background:var(--accent);color:#fff}
.seg button:not(.on):hover{color:var(--text)}
.prow{display:flex;align-items:center;gap:8px;margin-top:8px}
.prow>span:first-child{flex:0 0 84px;color:var(--sub);font-size:10.5px}
.prow input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;
  background:#33333c;outline:none;cursor:pointer}
.prow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;
  background:var(--text);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.prow input[type=range]:hover::-webkit-slider-thumb{background:var(--accent)}
.prow .pv{flex:0 0 34px;text-align:right;color:var(--faint);font-size:10px}
.prow select{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:4px;
  color:var(--text);font:11px var(--mono);padding:4px 6px;min-width:0}
.prow input[type=number]{width:64px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;
  color:var(--text);font:11px var(--mono);padding:4px 6px}
.prow input[type=text]{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:4px;
  color:var(--text);font:11px var(--mono);padding:5px 8px;min-width:0}
.prow input[type=color]{width:26px;height:22px;padding:0;border:1px solid var(--line);border-radius:4px;

.prow input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:5px;color:var(--text);
  font:11px var(--mono);padding:6px 10px;cursor:pointer;letter-spacing:.04em}
.btn:hover{border-color:var(--accent)}
.btn.wide{width:100%;margin-top:8px}
.btn.rec{border-color:#7a2530}
.btn.rec.on{background:#3a1218;border-color:#ff3a4a;color:#ff8a92}
.btnrow{display:flex;gap:7px;margin-top:8px}
.btnrow .btn{flex:1}
.hint{color:var(--faint);font-size:9.5px;margin-top:6px;letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;color:var(--sub);

.chips .chip:hover{border-color:var(--accent);color:var(--text)}
.chips .chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
#lutCv{width:100%;height:46px;display:block;margin-top:8px;border-radius:5px;cursor:pointer;
  background:var(--panel2);touch-action:none}
.typeline{border:1px solid var(--line);border-radius:6px;padding:8px 10px 10px;margin-top:8px;background:rgba(255,255,255,.015)}
.typeline .prow{margin-top:6px}
.typeline .prow>span:first-child{flex:0 0 58px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(8px);z-index:99;

  padding:8px 16px;font:11px var(--mono);opacity:0;transition:opacity .15s,transform .15s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:760px){
  #app{flex-direction:column}
  #stage{padding:16px;min-height:44vh}
  #panel{flex:1;width:100%;border-left:none;border-top:1px solid var(--line)}
}
</style>

  let u=(t-a.p)/Math.max(1e-6,b.p-a.p);
  const h=(b.h||0)/100;
  u=h>=.995?(u<.5?0:1):sstep(.5*h,1-.5*h,u);
  const ca=hex2rgbF(a.c),cb=hex2rgbF(b.c);
  return[ca[0]+(cb[0]-ca[0])*u,ca[1]+(cb[1]-ca[1])*u,ca[2]+(cb[2]-ca[2])*u];
}
function buildLut(){
  state.color._sorted=sortedStops();
  for(let i=0;i<256;i++){
    const c=sampleStops(i/255);
    lutData[i*4]=Math.round(clamp(c[0],0,1)*255);
    lutData[i*4+1]=Math.round(clamp(c[1],0,1)*255);
    lutData[i*4+2]=Math.round(clamp(c[2],0,1)*255);
    lutData[i*4+3]=255;

  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,256,1,0,gl.RGBA,gl.UNSIGNED_BYTE,lutData);

/* ============ time / motion ============ */
let tEvo=0,lastFrame=0;
const pulse={mul:1,target:1,next:0};
function tickPulse(dt){
  const amp=state.motion.pulse/100;
  pulse.next-=dt;
  if(pulse.next<=0){
    pulse.next=.22+Math.random()*1.3;
    pulse.target=Math.random()<.5?.1+Math.random()*.5:1+amp*(2+Math.random()*7);
  }
  pulse.mul+=(pulse.target-pulse.mul)*Math.min(1,dt*(pulse.target>pulse.mul?16:3));
  return pulse.mul;
}
function phase01(){
  const m=state.motion;
  if(!m.loop)return(tEvo*.12)%1;
  return(tEvo%m.loopSec)/m.loopSec;
}
function advance(dt){
  const m=state.motion;
  let mul=1;
  if(m.tempo==='reactive'&&!m.loop)mul=tickPulse(dt);
  if(m.loop){
    tEvo+=dt;
  }else{
    tEvo+=dt*(m.speed/100)*mul*1.4;
  }
}
function timeVec(){
  const m=state.motion;
  if(m.loop){
    const th=phase01()*Math.PI*2;
    const R=.15+m.evo/100*2.1;
    return[R*Math.sin(th),0,R*Math.cos(th)];
  }

/* ============ render ============ */
let renderScale=1;
function fitScale(W,H){
  if(_recording)return 1;
  const st=$('#stage');
  const availW=Math.max(100,st.clientWidth-68),availH=Math.max(100,st.clientHeight-68);
  const cssScale=Math.min(availW/W,availH/H);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  /* 表示中の物理ピクセル数に合わせて描画(書き出しサイズ超過も許可)。上限2200px */
  return Math.min(cssScale*dpr,2200/Math.max(W,H),2);
}
function setUniforms(W,H){
  const c=state.color,th=state.thermo;
  gl.uniform2f(U['uRes'],W,H);
  gl.uniform2f(U['uSeedOff'],(state.seed%1000)*.137,(Math.floor(state.seed/1000)%1000)*.113);
  const tv=timeVec();
  gl.uniform3f(U['uTimeVec'],tv[0],tv[1],tv[2]);
  gl.uniform1f(U['uAb'],c.ab*.004);
  gl.uniform1f(U['uAbEdge'],c.abEdge*.004);
  gl.uniform1f(U['uGrainAmt'],c.grain/100);
  gl.uniform2f(U['uSdfSize'],_sdfSize[0],_sdfSize[1]);
  const fc=hex2rgbF(th.fill);
  gl.uniform3f(U['uFill'],fc[0],fc[1],fc[2]);
  gl.uniform1f(U['uReach'],th.reach*.012);
  gl.uniform1f(U['uBase'],(th.base||0)/100*.5);
  gl.uniform1f(U['uFlare'],th.flare/100);
  gl.uniform1f(U['uFlareScale'],2.+th.flareScale*.25);
  gl.uniform1f(U['uShapeWarp'],th.shapeWarp*.0008);
  gl.uniform1i(U['uBgImg'],th.bg==='image'?1:0);

function renderFrame(W,H){
  if(glcv.width!==W||glcv.height!==H){glcv.width=W;glcv.height=H}
  if(view.width!==W||view.height!==H){view.width=W;view.height=H}
  gl.viewport(0,0,W,H);
  setUniforms(W,H);
  gl.drawArrays(gl.TRIANGLES,0,3);
  if(state.thermo.bg==='image'){
    vctx.fillStyle='#000';vctx.fillRect(0,0,W,H);
    if(_bgImg&&_bgImg.naturalWidth){
      const iw=_bgImg.naturalWidth,ih=_bgImg.naturalHeight;

      vctx.drawImage(_bgImg,(W-iw*s)/2,(H-ih*s)/2,iw*s,ih*s);
    }
  }
  vctx.drawImage(glcv,0,0);
  drawType(vctx,W,H);

/* ============ type layer ============ */
const FONT_MAP={
  sans:"'Helvetica Neue',Helvetica,Arial,sans-serif",
  jp:"'Hiragino Sans','Noto Sans JP',sans-serif",
  mono:"ui-monospace,'SF Mono',Menlo,monospace"
};
function drawType(ctx,W,H){
  const T=state.type;
  if(!T.on)return;
  const lines=T.lines.filter(l=>l.on&&l.text);
  if(!lines.length)return;
  const gap=T.gap/100*H;
  ctx.save();
  /* pass1: 幅にフィットするサイズを決める */
  const fit=lines.map(l=>{
    let fs=l.size/100*H,lsPx=(l.ls/100)*fs;
    ctx.font=`${l.weight} ${fs}px ${FONT_MAP[l.font]||FONT_MAP.sans}`;
    try{ctx.letterSpacing=lsPx+'px'}catch(e){}
    const w=ctx.measureText(l.text).width;
    const maxW=.88*W;
    if(w>maxW){const k=maxW/w;fs*=k;lsPx*=k}
    return{fs,lsPx};
  });
  const total=fit.reduce((a,f)=>a+f.fs*1.06,0)+gap*(lines.length-1);
  const left=T.align==='bl';
  let y=left?H-.075*H-total:(H-total)/2+T.yoff/100*H;
  const x=left?.075*W:W/2;
  ctx.textAlign=left?'left':'center';
  ctx.textBaseline='top';
  lines.forEach((l,i)=>{
    const{fs,lsPx}=fit[i];
    ctx.globalCompositeOperation=l.blend;
    ctx.fillStyle=l.color;
    ctx.font=`${l.weight} ${fs}px ${FONT_MAP[l.font]||FONT_MAP.sans}`;
    try{ctx.letterSpacing=lsPx+'px'}catch(e){}
    ctx.fillText(l.text,left?x:x+lsPx/2,y);
    y+=fs*1.06+gap;
  });
  try{ctx.letterSpacing='0px'}catch(e){}
  ctx.restore();
}
/* ============ data layer ============ */
function drawData(ctx,W,H){
  const D=state.data;
  if(!D.on)return;
  const s=H/1080*(D.scale/100);
  const rng=mulberry32((state.seed^0x51ab)>>>0);
  const ph=phase01();
  const t=tEvo;
  ctx.save();
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=D.alpha/100;
  ctx.strokeStyle=D.color;ctx.fillStyle=D.color;
  const m=Math.round(40*s);
  const fsz=10.5*s;
  ctx.font=`500 ${fsz}px ui-monospace,'SF Mono',Menlo,monospace`;
  ctx.textBaseline='top';
  if(D.frame){
    ctx.lineWidth=Math.max(1,1*s);
    ctx.strokeRect(m,m,W-2*m,H-2*m);
    const bl=14*s;ctx.lineWidth=Math.max(1,2*s);
    [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(([cx,cy,dx,dy])=>{
      ctx.beginPath();
      ctx.moveTo(cx+dx*bl,cy);ctx.lineTo(cx,cy);ctx.lineTo(cx,cy+dy*bl);
      ctx.stroke();
    });
    ctx.lineWidth=Math.max(1,1*s);
    const n=24;
    for(let i=1;i<n;i++){
      const q=i%(n/4)===0,tl=(q?9:4)*s;
      const tx=m+(W-2*m)*i/n,ty=m+(H-2*m)*i/n;
      ctx.beginPath();ctx.moveTo(tx,m);ctx.lineTo(tx,m+tl);ctx.stroke();
      ctx.beginPath();ctx.moveTo(tx,H-m);ctx.lineTo(tx,H-m-tl);ctx.stroke();
      ctx.beginPath();ctx.moveTo(m,ty);ctx.lineTo(m+tl,ty);ctx.stroke();
      ctx.beginPath();ctx.moveTo(W-m,ty);ctx.lineTo(W-m-tl,ty);ctx.stroke();
    }
  }
  const pad=m+12*s;
  if(D.read){
    ctx.textAlign='left';
    const l1=[D.t1,D.t2,'FLD '+state.seed,'EVO '+ph.toFixed(4)];
    l1.forEach((tx,i)=>tx&&ctx.fillText(tx,pad,pad+i*fsz*1.5));
    ctx.textAlign='right';
    const l2=['36.3229°N 139.0100°E','G-MESSE GUNMA JP','ABERRATION//ACTIVE'];
    l2.forEach((tx,i)=>ctx.fillText(tx,W-pad,pad+i*fsz*1.5));
  }
  if(D.marks){
    ctx.textAlign='left';
    ctx.lineWidth=Math.max(1,1*s);
    for(let i=0;i<3;i++){
      const mx=(0.16+rng()*.68)*W,my=(0.16+rng()*.68)*H,cs=8*s;
      ctx.beginPath();
      ctx.moveTo(mx-cs,my);ctx.lineTo(mx+cs,my);

      ctx.fillText('X '+(mx/W+jit*.001).toFixed(3)+' Y '+(my/H).toFixed(3),mx+cs+5*s,my-fsz*.5);
    }
  }
  if(D.prog){
    const bw=.26*W,bh=5*s,bx=pad,by=H-pad-bh-fsz*1.6;
    ctx.lineWidth=Math.max(1,1*s);
    ctx.strokeRect(bx,by,bw,bh);
    ctx.fillRect(bx,by,bw*ph,bh);
    ctx.textAlign='left';
    ctx.fillText((state.motion.loop?'LOOP '+state.motion.loopSec+'S':'OPEN RUN')+' — '+Math.round(ph*100)+'%',bx,by+bh+5*s);
  }
  ctx.restore();
}
/* ============ main loop ============ */
let _recording=false,_recStart=0,_recDur=0,_fpsAcc=0,_fpsN=0,_fpsShow=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.1,(now-lastFrame)/1000||0);
  lastFrame=now;
  advance(dt);
  const[FW,FH]=fullSize();
  const sc=fitScale(FW,FH);
  const W=Math.round(FW*sc),H=Math.round(FH*sc);
  const t0=performance.now();
  renderFrame(W,H);
  const ms=performance.now()-t0;
  _fpsAcc+=ms;_fpsN++;
  if(_fpsN>=30){_fpsShow=_fpsAcc/_fpsN;_fpsAcc=0;_fpsN=0}
  meta.textContent=FW+'×'+FH+(sc<1?'  ·  preview '+W+'×'+H:'')+'  ·  '+_fpsShow.toFixed(1)+'ms';
  if(_recording){
    const el=(performance.now()-_recStart)/1000;
    $('#rectime').textContent=el.toFixed(1)+'s / '+_recDur.toFixed(1)+'s';
    if(el>=_recDur)stopRec();
  }
}
/* ============ recording ============ */
let _rec=null,_chunks=[];
function startRec(){
  if(_recording)return;
  const fps=+(state.motion.recFps||30);
  _recDur=state.motion.loop?state.motion.loopSec:state.motion.recSec;
  _recording=true;
  if(state.motion.loop)tEvo=0;
  const[FW,FH]=fullSize();
  renderFrame(FW,FH);
  const stream=view.captureStream(fps);
  const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';
  _chunks=[];
  _rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:16e6});
  _rec.ondataavailable=e=>{if(e.data.size)_chunks.push(e.data)};
  _rec.onstop=()=>{
    download(new Blob(_chunks,{type:'video/webm'}),'u19-aberration_'+state.seed+'.webm');
    toast('WebM を書き出しました');
  };
  _rec.start();
  _recStart=performance.now();

}
function stopRec(){
  if(!_recording)return;
  _recording=false;
  if(_rec&&_rec.state!=='inactive')_rec.stop();

}

const UI={};
/* ============ LUT editor ============ */
const lutCv=$('#lutCv'),lctx=lutCv.getContext('2d');
let selStop=0,_dragStop=-1;
const LBAR_H=56;
function drawLutBar(){
  const W=lutCv.width,H=lutCv.height;
  lctx.clearRect(0,0,W,H);
  const img=lctx.createImageData(W,LBAR_H);
  for(let x=0;x<W;x++){
    const i=Math.round(x/(W-1)*255)*4;
    for(let y=0;y<LBAR_H;y++){
      const o=(y*W+x)*4;
      img.data[o]=lutData[i];img.data[o+1]=lutData[i+1];img.data[o+2]=lutData[i+2];img.data[o+3]=255;
    }
  }
  lctx.putImageData(img,0,0);
  state.color.stops.forEach((s,i)=>{
    const x=s.p*W;
    lctx.beginPath();
    lctx.moveTo(x,LBAR_H+4);lctx.lineTo(x-9,H-6);lctx.lineTo(x+9,H-6);lctx.closePath();
    lctx.fillStyle=s.c;lctx.fill();
    lctx.lineWidth=i===selStop?3:1.5;
    lctx.strokeStyle=i===selStop?'#ffffff':'#55555f';
    lctx.stroke();
  });
}
function lutPointer(e){
  const b=lutCv.getBoundingClientRect();
  return{x:clamp((e.clientX-b.left)/b.width,0,1),y:(e.clientY-b.top)/b.height};
}
function nearStop(px){
  let best=-1,bd=.035;
  state.color.stops.forEach((s,i)=>{const d=Math.abs(s.p-px);if(d<bd){bd=d;best=i}});
  return best;
}
lutCv.addEventListener('pointerdown',e=>{
  const{x,y}=lutPointer(e);
  const hit=nearStop(x);
  if(y>LBAR_H/lutCv.height||hit>=0){
    if(hit>=0){selStop=hit;_dragStop=hit;lutCv.setPointerCapture(e.pointerId)}
  }else{
    state.color._sorted=sortedStops();
    const c=sampleStops(x);
    state.color.stops.push({p:x,c:rgb2hex(c[0],c[1],c[2]),h:0});
    selStop=state.color.stops.length-1;
    _dragStop=selStop;lutCv.setPointerCapture(e.pointerId);
  }
  refreshStopCtl();buildLut();
});
lutCv.addEventListener('pointermove',e=>{
  if(_dragStop<0)return;
  const{x}=lutPointer(e);

});
lutCv.addEventListener('pointerup',()=>{_dragStop=-1});
lutCv.addEventListener('dblclick',e=>{
  const{x}=lutPointer(e);

  UI.speed=mkRange('速度',1,100,1,m.speed,v=>m.speed=v);
  UI.pulse=mkRange('パルス量',0,100,1,m.pulse,v=>m.pulse=v);
  c.append(UI.loop.row,UI.loopSec.row,UI.evo.row,UI.speed.row,UI.pulse.row);
  syncMotion();
}
function syncMotion(){
  const m=state.motion;
  UI.tempo.set(m.tempo);
  UI.loop.set(m.loop);UI.loopSec.set(m.loopSec);UI.evo.set(m.evo);
  UI.speed.set(m.speed);UI.pulse.set(m.pulse);
  UI.loopSec.row.style.display=m.loop?'flex':'none';
  UI.speed.row.style.display=m.loop?'none':'flex';
  UI.pulse.row.style.display=(!m.loop&&m.tempo==='reactive')?'flex':'none';
}
function buildThermo(){
  const th=state.thermo;
  const c=$('#thermoOpts');
  UI.thSrc=mkSeg([['logo','U19ロゴ'],['text','テキスト']],th.src,v=>{th.src=v;scheduleSDF();syncThermo()});
  const fr=ce('div','btnrow');
  const upBtn=ce('button','btn','画像を読み込む');
  const rsBtn=ce('button','btn','標準ロゴに戻す');
  const fi=document.createElement('input');fi.type='file';fi.accept='image/svg+xml,image/png,image/jpeg,image/webp';fi.style.display='none';
  upBtn.addEventListener('click',()=>fi.click());
  fi.addEventListener('change',()=>{
    const f=fi.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{localStorage.setItem('u19ab_logo',rd.result)}catch(e){}
      setLogoFromURL(rd.result);
      th.src='logo';syncThermo();
      toast('ロゴ画像を読み込みました');
    };
    rd.readAsDataURL(f);
  });
  rsBtn.addEventListener('click',()=>{
    localStorage.removeItem('u19ab_logo');
    setLogoFromURL(logoDefaultURL());
    toast('標準U19ロゴに戻しました');
  });
  fr.append(upBtn,rsBtn);
  UI.thBg=mkSeg([['lut','生成背景'],['image','KV画像背景']],th.bg||'lut',v=>{th.bg=v});
  const br=ce('div','btnrow');
  const bgBtn=ce('button','btn','背景画像を読み込む');
  const bgRs=ce('button','btn','KV画像に戻す');
  const bgFi=document.createElement('input');bgFi.type='file';bgFi.accept='image/*';bgFi.style.display='none';
  bgBtn.addEventListener('click',()=>bgFi.click());
  bgFi.addEventListener('change',()=>{
    const f=bgFi.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{localStorage.setItem('u19ab_bg',rd.result)}catch(e){}
      setBgFromURL(rd.result);
      th.bg='image';syncThermo();
      toast('背景画像を読み込みました');
    };
    rd.readAsDataURL(f);
  });
  bgRs.addEventListener('click',()=>{
    localStorage.removeItem('u19ab_bg');
    setBgFromURL('assets/u19-kv.jpg');
    th.bg='image';syncThermo();
    toast('KV画像背景に戻しました');
  });
  br.append(bgBtn,bgRs);
  UI.thText=mkText('テキスト1',th.text,v=>{th.text=v;scheduleSDF()});
  UI.thText2=mkText('テキスト2',th.text2,v=>{th.text2=v;scheduleSDF()});
  UI.thSize=mkRange('サイズ',4,60,.5,th.size,v=>{th.size=v;scheduleSDF()});
  UI.thLs=mkRange('字間',0,60,1,th.ls,v=>{th.ls=v;scheduleSDF()});
  const r3=ce('div','prow');
  const wSel=document.createElement('select');
  [['400','Regular'],['600','Semi'],['700','Bold'],['900','Black']].forEach(o=>{const op=document.createElement('option');op.value=o[0];op.textContent=o[1];wSel.appendChild(op)});
  wSel.value=th.weight;wSel.addEventListener('change',()=>{th.weight=wSel.value;scheduleSDF()});
  const fSel=document.createElement('select');
  [['sans','Sans'],['jp','JP'],['mono','Mono']].forEach(o=>{const op=document.createElement('option');op.value=o[0];op.textContent=o[1];fSel.appendChild(op)});
  fSel.value=th.font;fSel.addEventListener('change',()=>{th.font=fSel.value;scheduleSDF()});
  r3.append(wSel,fSel);
  UI.thSels={wSel,fSel};
  UI.thFill=mkColRow('塗り色',th.fill,v=>th.fill=v);
  UI.thReach=mkRange('グロー距離',1,40,.5,th.reach,v=>th.reach=v);
  UI.thBase=mkRange('ベースグロー',0,100,1,th.base||0,v=>th.base=v);
  UI.thFlare=mkRange('フレア量',0,100,1,th.flare,v=>th.flare=v);
  UI.thFScale=mkRange('フレア粒度',0,100,1,th.flareScale,v=>th.flareScale=v);
  UI.thWarp=mkRange('メルト',0,100,1,th.shapeWarp,v=>th.shapeWarp=v);
  UI.thTextRows=[UI.thText.row,UI.thText2.row,UI.thLs.row,r3];
  c.append(UI.thSrc.row,fr,UI.thBg.row,br,UI.thText.row,UI.thText2.row,UI.thSize.row,UI.thLs.row,r3,UI.thFill.row,UI.thReach.row,UI.thBase.row,UI.thFlare.row,UI.thFScale.row,UI.thWarp.row,fi,bgFi);
}
function syncThermo(){
  const th=state.thermo;
  UI.thSrc.set(th.src);
  UI.thText.set(th.text);UI.thText2.set(th.text2);
  UI.thSize.set(th.size);UI.thLs.set(th.ls);
  UI.thSels.wSel.value=th.weight;UI.thSels.fSel.value=th.font;UI.thFill.set(th.fill);
  UI.thBg.set(th.bg||'lut');
  UI.thReach.set(th.reach);UI.thBase.set(th.base||0);UI.thFlare.set(th.flare);UI.thFScale.set(th.flareScale);UI.thWarp.set(th.shapeWarp);
  UI.thTextRows.forEach(r=>r.style.display=th.src==='text'?'flex':'none');
}
function buildColor(){
  const chips=$('#lutPresets');
  LUT_PRESETS.forEach(p=>{
    const ch=ce('button','chip',`<i style="background:${p.dot}"></i>${p.name}`);
    ch.addEventListener('click',()=>{applyLutPreset(p.name)});
    chips.appendChild(ch);
  });
  buildStopCtl();
  const c=$('#colorOpts'),cl=state.color;
  UI.ab=mkRange('収差',0,60,1,cl.ab,v=>cl.ab=v);
  UI.abEdge=mkRange('エッジ収差',0,100,1,cl.abEdge,v=>cl.abEdge=v);
  UI.grain=mkRange('グレイン',0,100,1,cl.grain,v=>cl.grain=v);
  c.append(UI.ab.row,UI.abEdge.row,UI.grain.row);
}
function applyLutPreset(name){
  const p=LUT_PRESETS.find(x=>x.name===name);
  if(!p)return;
  state.color.stops=p.stops.map(s=>({...s}));
  selStop=0;buildLut();refreshStopCtl();
}
function syncColor(){
  const cl=state.color;
  UI.ab.set(cl.ab);UI.abEdge.set(cl.abEdge);
  UI.grain.set(cl.grain);
  buildLut();refreshStopCtl();
}
const BLENDS=[['source-over','通常'],['difference','差の絶対値'],['exclusion','除外'],['overlay','オーバーレイ'],['screen','スクリーン'],['multiply','乗算']];
function buildType(){
  const c=$('#typeOpts'),T=state.type;
  UI.typeOn=mkChk('タイポ表示',T.on,v=>T.on=v);
  UI.typeAlign=mkSeg([['center','中央'],['bl','左下']],T.align,v=>T.align=v);
  UI.typeGap=mkRange('行間',0,10,.1,T.gap,v=>T.gap=v);
  UI.typeY=mkRange('縦位置',-40,40,.5,T.yoff,v=>T.yoff=v);
  c.append(UI.typeOn.row,UI.typeAlign.row,UI.typeGap.row,UI.typeY.row);
  UI.lines=[];
  T.lines.forEach((l,i)=>{
    const box=ce('div','typeline');
    const r1=ce('div','prow');
    const chk=document.createElement('input');chk.type='checkbox';chk.checked=l.on;
    chk.addEventListener('change',()=>l.on=chk.checked);
    const txt=document.createElement('input');txt.type='text';txt.value=l.text;
    txt.addEventListener('input',()=>l.text=txt.value);
    r1.append(chk,txt);
    const sz=mkRange('サイズ',0.5,60,.1,l.size,v=>l.size=v);
    const ls=mkRange('字間',0,80,1,l.ls,v=>l.ls=v);
    const r3=ce('div','prow');
    const wSel=document.createElement('select');
    [['400','Regular'],['600','Semi'],['700','Bold'],['900','Black']].forEach(o=>{const op=document.createElement('option');op.value=o[0];op.textContent=o[1];wSel.appendChild(op)});
    wSel.value=l.weight;wSel.addEventListener('change',()=>l.weight=wSel.value);
    const fSel=document.createElement('select');
    [['sans','Sans'],['jp','JP'],['mono','Mono']].forEach(o=>{const op=document.createElement('option');op.value=o[0];op.textContent=o[1];fSel.appendChild(op)});
    fSel.value=l.font;fSel.addEventListener('change',()=>l.font=fSel.value);
    const bSel=document.createElement('select');
    BLENDS.forEach(o=>{const op=document.createElement('option');op.value=o[0];op.textContent=o[1];bSel.appendChild(op)});
    bSel.value=l.blend;bSel.addEventListener('change',()=>l.blend=bSel.value);
    const col=document.createElement('input');col.type='color';col.value=l.color;
    col.addEventListener('input',()=>l.color=col.value);
    r3.append(wSel,fSel,bSel,col);
    box.append(r1,sz.row,ls.row,r3);
    c.appendChild(box);
    UI.lines.push({chk,txt,sz,ls,wSel,fSel,bSel,col});
  });
}
function syncType(){
  const T=state.type;
  UI.typeOn.set(T.on);UI.typeAlign.set(T.align);UI.typeGap.set(T.gap);UI.typeY.set(T.yoff);
  T.lines.forEach((l,i)=>{
    const u=UI.lines[i];if(!u)return;
    u.chk.checked=l.on;u.txt.value=l.text;u.sz.set(l.size);u.ls.set(l.ls);
    u.wSel.value=l.weight;u.fSel.value=l.font;u.bSel.value=l.blend;u.col.value=l.color;
  });
}
function buildData(){
  const c=$('#dataOpts'),D=state.data;
  UI.dataOn=mkChk('データ表示',D.on,v=>D.on=v);
  UI.dFrame=mkChk('フレーム＋目盛',D.frame,v=>D.frame=v);
  UI.dMarks=mkChk('マーカー',D.marks,v=>D.marks=v);
  UI.dRead=mkChk('リードアウト',D.read,v=>D.read=v);
  UI.dProg=mkChk('プログレス',D.prog,v=>D.prog=v);
  UI.dT1=mkText('ラベル1',D.t1,v=>D.t1=v);
  UI.dT2=mkText('ラベル2',D.t2,v=>D.t2=v);
  UI.dCol=mkColRow('カラー',D.color,v=>D.color=v);
  UI.dAlpha=mkRange('不透明度',0,100,1,D.alpha,v=>D.alpha=v);
  UI.dScale=mkRange('スケール',40,200,1,D.scale,v=>D.scale=v);
  c.append(UI.dataOn.row,UI.dFrame.row,UI.dMarks.row,UI.dRead.row,UI.dProg.row,UI.dT1.row,UI.dT2.row,UI.dCol.row,UI.dAlpha.row,UI.dScale.row);
}
function syncData(){
  const D=state.data;
  UI.dataOn.set(D.on);UI.dFrame.set(D.frame);UI.dMarks.set(D.marks);UI.dRead.set(D.read);UI.dProg.set(D.prog);
  UI.dT1.set(D.t1);UI.dT2.set(D.t2);UI.dCol.set(D.color);UI.dAlpha.set(D.alpha);UI.dScale.set(D.scale);
}
function buildRec(){
  const c=$('#recOpts'),m=state.motion;
  UI.recFps=mkSeg([['30','30fps'],['60','60fps']],String(m.recFps||30),v=>m.recFps=+v);
  UI.recSec=mkRange('録画秒',2,20,.5,m.recSec,v=>m.recSec=v);
  c.append(UI.recFps.row,UI.recSec.row);
}
function buildPresets(){
  const chips=$('#presets');
  PRESETS.forEach(p=>{
    const ch=ce('button','chip',`<i style="background:${p.dot}"></i>${p.name}`);
    ch.addEventListener('click',()=>applyPreset(p));
    chips.appendChild(ch);
  });
}
function applyPreset(p){
  Object.assign(state.motion,p.motion||{});
  if(p.thermo)Object.assign(state.thermo,p.thermo);
  if(p.data)Object.assign(state.data,p.data);
  const savedStops=state.color.stops;
  Object.assign(state.color,p.color||{});
  state.color.stops=savedStops;
  if(p.lut)applyLutPreset(p.lut);
  state.type.on=!p.typeOff;
  state.data.on=!p.dataOff;
  state.type.lines.forEach(l=>{l.blend=p.typeBlend||'source-over';if(p.typeColor)l.color=p.typeColor});
  tEvo=0;
  rebuildSDF();
  syncAll();
  toast('プリセット: '+p.name);
}
function syncAll(){
  UI.sizeSeg.set(state.canvas.mode);
  UI.custRow.row.style.display=state.canvas.mode==='custom'?'flex':'none';
  UI.custRow.set();
  syncMotion();syncColor();syncType();syncData();syncThermo();
  $('#seed').value=state.seed;
}
/* ============ randomize ============ */
$('#dice').addEventListener('click',()=>{
  state.seed=Math.floor(Math.random()*99999999);
  tEvo=0;
  syncAll();
  toast('シード '+state.seed);
});
$('#seed').addEventListener('input',e=>{state.seed=+e.target.value||0});
/* ============ init ============ */
loadHash();
buildPresets();buildSize();buildMotion();buildThermo();buildColor();buildType();buildData();buildRec();
buildLut();refreshStopCtl();rebuildSDF();syncAll();
setLogoFromURL(localStorage.getItem('u19ab_logo')||logoDefaultURL());
setBgFromURL(localStorage.getItem('u19ab_bg')||'assets/u19-kv.jpg');
if(location.hash.startsWith('#p=')){
  const nm=decodeURIComponent(location.hash.slice(3));
  const p=PRESETS.find(x=>x.name===nm);
  if(p)applyPreset(p);
}
requestAnimationFrame(t=>{lastFrame=t;loop(t)});
</script>
</body>
</html>
