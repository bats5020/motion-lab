<style>
:root{--bg:#0a0a0b;--panel:#141417;--panel2:#1c1c21;--line:#2a2a31;--text:#e6e6ef;--sub:#9a9aa6;--faint:#6a6a74;--accent:#4f5cff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:12px/1.5 "SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;display:flex;overflow:hidden}
#stage{flex:1;min-width:0;height:100%;display:flex;align-items:center;justify-content:center;padding:22px;position:relative}
#view{max-width:100%;max-height:100%;background:#000;border:1px solid var(--line);box-shadow:0 10px 44px rgba(0,0,0,.55)}
#view.manual{cursor:crosshair}
#drop{position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:10px;display:none;align-items:center;justify-content:center;color:var(--accent);background:rgba(79,92,255,.07);pointer-events:none;font-size:13px;letter-spacing:.25em}
#stage.drag #drop{display:flex}
#panel{width:300px;flex:none;height:100%;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;overflow-x:hidden}
#panel::-webkit-scrollbar{width:8px}
#panel::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
header{padding:16px 14px 13px;border-bottom:1px solid var(--line)}
h1{font-size:15px;letter-spacing:.26em;font-weight:700}
h1 i{color:var(--accent);font-style:normal}
header p{color:var(--sub);font-size:10px;margin-top:6px;letter-spacing:.04em}
details{border-bottom:1px solid var(--line)}
summary{cursor:pointer;padding:11px 14px;font-size:11px;letter-spacing:.2em;color:var(--sub);user-select:none;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";color:var(--faint);font-size:10px}
details:not([open]) summary::after{content:"▸"}
details[open] summary{color:var(--text)}
summary:hover{color:var(--text)}
.sec{padding:3px 14px 15px;display:flex;flex-direction:column;gap:11px}
.row{display:flex;gap:8px}
button{background:var(--panel2);border:1px solid var(--line);color:var(--text);font:inherit;font-size:11px;padding:7px 10px;border-radius:5px;cursor:pointer;flex:1;transition:border-color .12s;letter-spacing:.04em}
button:hover{border-color:var(--accent)}
button:active{transform:translateY(1px)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.dice{flex:none;width:38px;font-size:14px;padding:5px 0}
.ctl{display:flex;flex-direction:column;gap:4px}
.lab{display:flex;justify-content:space-between;color:var(--sub);font-size:10px;letter-spacing:.08em}
.lab b{color:var(--text);font-weight:400}
input[type=range]{width:100%;accent-color:var(--accent);height:16px;cursor:pointer}
.chk{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:11px;cursor:pointer;user-select:none}
.chk:hover{color:var(--text)}
.chk input{accent-color:var(--accent);width:13px;height:13px;cursor:pointer}
input[type=number]{background:var(--panel2);border:1px solid var(--line);color:var(--text);font:inherit;font-size:11px;padding:6px 8px;border-radius:5px;width:100%;min-width:0}
input[type=number]:focus{outline:none;border-color:var(--accent)}
.note{color:var(--faint);font-size:10px;line-height:1.7;white-space:pre-line}
#status{color:var(--faint);font-size:10px;padding:11px 14px;min-height:34px;line-height:1.6}
</style>

<body>
<a href="../index.html" id="mlab-home" title="MOTION LAB ホームへ" style="position:fixed;bottom:12px;left:12px;z-index:2147483647;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(10,10,12,.72);border:1px solid rgba(255,255,255,.16);color:#e6e6ef;font:600 11px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.08em;text-decoration:none;opacity:.55;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .15s" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.55">&#9670; MOTION LAB</a>
<div id="stage">
  <canvas id="view" width="16" height="16"></canvas>
  <div id="drop">DROP IMAGE</div>
</div>
<div id="panel">
  <header>
    <h1><i>&#9670;</i> GRID STRETCH</h1>
    <p>画像をグリッド分割し、行・列をピクセルストレッチで引き伸ばすグリッチツール</p>
  </header>

  <details open><summary>画像</summary><div class="sec">
    <div class="row"><button id="upBtn" class="pri">アップロード</button></div>
    <input type="file" id="file" accept="image/*" hidden>
    <div class="row"><button id="rotBtn">回転90°</button><button id="resetBtn">リセット</button></div>
    <div class="row"><button id="sampleBtn">サンプル画像に戻す</button></div>

    <div class="note">ドラッグ＆ドロップ / ペースト（Ctrl+V）対応</div>
  </div></details>

  <details open><summary>グリッド</summary><div class="sec">
    <div class="ctl"><div class="lab"><span>密度（行）</span><b id="rowsNV"></b></div><input type="range" id="rowsN" min="4" max="64" value="16"></div>
    <div class="ctl"><div class="lab"><span>密度（列）</span><b id="colsNV"></b></div><input type="range" id="colsN" min="4" max="64" value="16"></div>
    <label class="chk"><input type="checkbox" id="link" checked>行/列リンク</label>
    <label class="chk"><input type="checkbox" id="grid" checked>グリッド線表示</label>
    <label class="chk"><input type="checkbox" id="notes" checked>注釈表示</label>
  </div></details>

  <details open><summary>ストレッチ</summary><div class="sec">
    <div class="ctl"><div class="lab"><span>強度</span><b id="strengthV"></b></div><input type="range" id="strength" min="0" max="100" value="62"></div>
    <div class="ctl"><div class="lab"><span>方向バランス</span><b id="balanceV"></b></div><input type="range" id="balance" min="0" max="100" value="30"><div class="note">0=横のみ（行を伸ばす） / 100=縦のみ（列を伸ばす）</div></div>
    <div class="ctl"><div class="lab"><span>ランダム度</span><b id="randomV"></b></div><input type="range" id="random" min="0" max="100" value="40"></div>
    <div class="ctl"><div class="lab"><span>フェザー</span><b id="featherV"></b></div><input type="range" id="feather" min="0" max="40" value="10"></div>
    <div class="ctl"><div class="lab"><span>シード</span></div>
      <div class="row"><input type="number" id="seed" min="1" max="999999" step="1" value="1234"><button class="dice" id="diceBtn" title="ランダムシード">&#127922;</button></div>
    </div>
    <div class="row"><button id="autoBtn">自動検出（コントラスト解析）</button></div>
    <label class="chk"><input type="checkbox" id="manual">手動モード</label>
    <div class="note" id="manualHint" hidden>クリック＝行を切替 / Shift+クリック＝列を切替</div>
  </div></details>

  <details open><summary>書き出し</summary><div class="sec">
    <div class="row"><button id="pngBtn" class="pri">PNG保存</button></div>
    <div class="ctl"><div class="lab"><span>JPG品質</span><b id="jpgqV"></b></div><input type="range" id="jpgq" min="50" max="100" value="92"></div>
    <div class="row"><button id="jpgBtn">JPG保存</button><button id="copyBtn">コピー</button></div>
    <div class="note">書き出しはフル解像度（ソースピクセル）で処理されます</div>
  </div></details>

  <div id="status"></div>
</div>

<script>
'use strict';
(function(){
var $=function(id){return document.getElementById(id)};
var view=$('view'),stage=$('stage');

var state={rows:16,cols:16,link:true,grid:true,notes:true,strength:62,balance:30,random:40,feather:10,seed:1234,manual:false,jpgq:92,selMode:'random',selRows:new Set(),selCols:new Set()};
var originalFull=null,srcFull=null,srcPrev=null,lum=0,isSample=true;

/* ---------- utils ---------- */
function mk(w,h){var c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c}
function copyCanvas(s){var c=mk(s.width,s.height);c.getContext('2d').drawImage(s,0,0);return c}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function pad2(n){return (n<10?'0':'')+n}
function status(msg){$('status').textContent=msg}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function bandRng(i,isRow){
  var s=(Math.imul(state.seed>>>0,2654435761)^(isRow?0x9E3779B9:0x85EBCA6B)^Math.imul(i+1,0x27D4EB2F))>>>0;
  return mulberry32(s||1);
}

/* ---------- sample image ---------- */
function makeSample(){
  var W=1000,H=1250,c=mk(W,H),x=c.getContext('2d'),i;
  var g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0d0d15');g.addColorStop(.55,'#141021');g.addColorStop(1,'#0a0c12');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  var blobs=[[380,430,470,'255,98,38',.95],[660,900,420,'46,118,255',.9],[260,1010,330,'255,44,128',.75],[730,250,300,'70,235,205',.7],[500,640,620,'120,80,255',.28]];
  x.globalCompositeOperation='screen';
  for(i=0;i<blobs.length;i++){
    var b=blobs[i],rg=x.createRadialGradient(b[0],b[1],0,b[0],b[1],b[2]);
    rg.addColorStop(0,'rgba('+b[3]+','+b[4]+')');
    rg.addColorStop(.55,'rgba('+b[3]+','+(b[4]*.35)+')');
    rg.addColorStop(1,'rgba('+b[3]+',0)');
    x.fillStyle=rg;x.beginPath();x.arc(b[0],b[1],b[2],0,7);x.fill();
  }
  x.globalCompositeOperation='source-over';
  x.strokeStyle='rgba(230,230,239,.55)';x.lineWidth=2;
  x.beginPath();x.arc(500,610,330,0,7);x.stroke();
  x.strokeStyle='rgba(230,230,239,.18)';x.lineWidth=1;
  x.beginPath();x.moveTo(0,610.5);x.lineTo(W,610.5);x.moveTo(500.5,0);x.lineTo(500.5,H);x.stroke();
  var rr=mulberry32(99);
  for(i=0;i<7000;i++){
    x.fillStyle='rgba(255,255,255,'+(rr()*.07).toFixed(3)+')';
    x.fillRect(rr()*W,rr()*H,1.4,1.4);
  }
  var vg=x.createRadialGradient(500,625,300,500,625,900);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');
  x.fillStyle=vg;x.fillRect(0,0,W,H);
  return c;
}

/* ---------- source handling ---------- */
function setSource(img,ow,oh,sample){
  var cap=4000,sc=Math.min(1,cap/Math.max(ow,oh));
  var c=mk(Math.round(ow*sc),Math.round(oh*sc));
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  srcFull=c;originalFull=copyCanvas(c);isSample=!!sample;
  var info=(sample?'サンプル画像 ':'')+c.width+'×'+c.height+'px';
  if(sc<1)info+='\n※ 元画像 '+ow+'×'+oh+' を長辺'+cap+'pxに縮小して処理';
  $('imgInfo').textContent=info;
  state.selMode='random';state.selRows.clear();state.selCols.clear();
  buildPreview();render();
}
function buildPreview(){
  var cap=1600,sc=Math.min(1,cap/Math.max(srcFull.width,srcFull.height));
  srcPrev=mk(Math.round(srcFull.width*sc),Math.round(srcFull.height*sc));
  srcPrev.getContext('2d').drawImage(srcFull,0,0,srcPrev.width,srcPrev.height);
  var t=mk(32,32),tx=t.getContext('2d');
  tx.drawImage(srcPrev,0,0,32,32);
  var d=tx.getImageData(0,0,32,32).data,s=0,i;
  for(i=0;i<d.length;i+=4)s+=d[i]*.299+d[i+1]*.587+d[i+2]*.114;
  lum=s/1024;
}
function loadBlob(blob){
  if(!blob||blob.type.indexOf('image')!==0){status('画像ファイルを指定してください');return}
  var url=URL.createObjectURL(blob),img=new Image();
  img.onload=function(){URL.revokeObjectURL(url);setSource(img,img.naturalWidth,img.naturalHeight,false);status('画像を読み込みました')};
  img.onerror=function(){URL.revokeObjectURL(url);status('画像の読み込みに失敗しました')};
  img.src=url;
}

/* ---------- band selection ---------- */
function probs(){
  var cov=state.random/100,bal=state.balance/100;
  return{row:cov*Math.min(1,2*(1-bal)),col:cov*Math.min(1,2*bal)};
}
function currentSel(R,C){
  var rows,cols,i;
  if(state.selMode==='fixed'){
    rows=new Set();cols=new Set();
    state.selRows.forEach(function(r){if(r<R)rows.add(r)});
    state.selCols.forEach(function(c){if(c<C)cols.add(c)});
    return{rows:rows,cols:cols};
  }
  var rng=mulberry32((state.seed>>>0)||1),p=probs();
  rows=new Set();cols=new Set();
  for(i=0;i<R;i++)if(rng()<p.row)rows.add(i);
  for(i=0;i<C;i++)if(rng()<p.col)cols.add(i);
  if(!rows.size&&!cols.size&&state.random>0){
    if(state.balance>=50)cols.add(Math.floor(rng()*C));else rows.add(Math.floor(rng()*R));
  }
  return{rows:rows,cols:cols};
}

/* ---------- stretch engine ---------- */
function stretch(data,w,h,sel,R,C,featherPx){
  var strength=state.strength;
  var f=Math.max(0,Math.round(featherPx));
  sel.rows.forEach(function(r){
    var y0=Math.floor(r*h/R),y1=Math.floor((r+1)*h/R);
    if(y1<=y0)return;
    var rb=bandRng(r,true);
    var xs=Math.min(w-1,Math.floor(rb()*w));
    var dir=rb()<.5?-1:1;
    var ext=Math.max(3,Math.round(strength/100*(w-1)));
    var tail=Math.min(ext,Math.max(2,f*2));
    var yA=Math.max(0,y0-f),yB=Math.min(h,y1+f),y,i,x,p,t,rem;
    for(y=yA;y<yB;y++){
      var va=1;
      if(y<y0)va=1-(y0-y)/(f+1);
      else if(y>=y1)va=1-(y-y1+1)/(f+1);
      var row=y*w*4,s=row+xs*4;
      var sr=data[s],sg=data[s+1],sb=data[s+2];
      for(i=1;i<=ext;i++){
        x=xs+dir*i;
        if(x<0||x>=w)break;
        t=va;rem=ext-i;
        if(rem<tail)t*=(rem+1)/(tail+1);
        p=row+x*4;
        if(t>=1){data[p]=sr;data[p+1]=sg;data[p+2]=sb}
        else{data[p]+=(sr-data[p])*t;data[p+1]+=(sg-data[p+1])*t;data[p+2]+=(sb-data[p+2])*t}
      }
    }
  });
  sel.cols.forEach(function(c){
    var x0=Math.floor(c*w/C),x1=Math.floor((c+1)*w/C);
    if(x1<=x0)return;
    var rb=bandRng(c,false);
    var ys=Math.min(h-1,Math.floor(rb()*h));
    var dir=rb()<.5?-1:1;
    var ext=Math.max(3,Math.round(strength/100*(h-1)));
    var tail=Math.min(ext,Math.max(2,f*2));
    var xA=Math.max(0,x0-f),xB=Math.min(w,x1+f),x,i,y,p,t,rem;
    for(x=xA;x<xB;x++){
      var va=1;
      if(x<x0)va=1-(x0-x)/(f+1);
      else if(x>=x1)va=1-(x-x1+1)/(f+1);
      var s=(ys*w+x)*4;
      var sr=data[s],sg=data[s+1],sb=data[s+2];
      for(i=1;i<=ext;i++){
        y=ys+dir*i;
        if(y<0||y>=h)break;
        t=va;rem=ext-i;
        if(rem<tail)t*=(rem+1)/(tail+1);
        p=(y*w+x)*4;
        if(t>=1){data[p]=sr;data[p+1]=sg;data[p+2]=sb}
        else{data[p]+=(sr-data[p])*t;data[p+1]+=(sg-data[p+1])*t;data[p+2]+=(sb-data[p+2])*t}
      }
    }
  });
}

/* ---------- overlays ---------- */
function drawGrid(x,w,h,R,C,ov){
  x.save();x.globalAlpha=.2;x.strokeStyle='rgb('+ov+')';
  x.lineWidth=Math.max(1,Math.max(w,h)/1800);x.beginPath();
  var i,v;
  for(i=1;i<R;i++){v=i*h/R;x.moveTo(0,v);x.lineTo(w,v)}
  for(i=1;i<C;i++){v=i*w/C;x.moveTo(v,0);x.lineTo(v,h)}
  x.stroke();x.restore();
}
var WORDS=['STRETCH','SLICE','SHIFT'];
function drawNotes(x,w,h,sel,R,C,ov){
  var fs=Math.max(9,Math.round(Math.min(w,h)*.014));
  x.save();
  x.font='600 '+fs+'px "SF Mono",ui-monospace,Menlo,Consolas,monospace';
  x.fillStyle='rgb('+ov+')';x.globalAlpha=.85;
  var tick=Math.max(1,Math.max(w,h)/1600);
  sel.rows.forEach(function(r){
    var rb=bandRng(r,true),frac=rb();rb();
    var y0=Math.floor(r*h/R),y1=Math.floor((r+1)*h/R),xs=frac*w;
    var tx=clamp(xs+fs*.6,4,w-fs*9);
    x.fillRect(xs,y0,tick,Math.min(fs*1.2,y1-y0));
    x.fillText('R'+pad2(r)+' '+Math.round(frac*100)+'%',tx,Math.min(h-4,y0+fs+3));
    if(rb()<.45&&(y1-y0)>fs*2.6)
      x.fillText(WORDS[Math.floor(rb()*WORDS.length)]+' '+(y1-y0)+'PX',tx,y1-fs*.5);
  });
  sel.cols.forEach(function(c){
    var rb=bandRng(c,false),frac=rb();rb();
    var x0=Math.floor(c*w/C),x1=Math.floor((c+1)*w/C),ysP=frac*h;
    var ty=clamp(ysP+fs*.6,4,h-fs*9);
    x.fillRect(x0,ysP,Math.min(fs*1.2,x1-x0),tick);
    x.save();x.translate(Math.min(w-4,x0+fs+3),ty);x.rotate(Math.PI/2);
    x.fillText('C'+pad2(c)+' '+Math.round(frac*100)+'%',0,0);
    if(rb()<.45&&(x1-x0)>fs*2.6)
      x.fillText(WORDS[Math.floor(rb()*WORDS.length)]+' '+(x1-x0)+'PX',0,fs*1.8-(x1-x0));
    x.restore();
  });
  x.restore();
}
function drawManual(x,w,h,sel,R,C){
  x.save();
  x.fillStyle='rgba(79,92,255,.13)';x.strokeStyle='rgba(79,92,255,.75)';
  x.lineWidth=Math.max(1,Math.max(w,h)/1600);x.setLineDash([6,4]);
  sel.rows.forEach(function(r){
    var y0=Math.floor(r*h/R),y1=Math.floor((r+1)*h/R);
    x.fillRect(0,y0,w,y1-y0);x.strokeRect(.5,y0+.5,w-1,y1-y0-1);
  });
  sel.cols.forEach(function(c){
    var x0=Math.floor(c*w/C),x1=Math.floor((c+1)*w/C);
    x.fillRect(x0,0,x1-x0,h);x.strokeRect(x0+.5,.5,x1-x0-1,h-1);
  });
  x.restore();
}

/* ---------- render pipeline ---------- */
function process(src,withManual){
  var w=src.width,h=src.height,R=state.rows,C=state.cols;
  var out=mk(w,h),x=out.getContext('2d');
  x.drawImage(src,0,0);
  var sel=currentSel(R,C);
  if(sel.rows.size||sel.cols.size){
    var id=x.getImageData(0,0,w,h);
    stretch(id.data,w,h,sel,R,C,state.feather*Math.max(w,h)/1600);
    x.putImageData(id,0,0);
  }
  var ov=lum>150?'10,10,11':'240,240,246';
  if(state.grid)drawGrid(x,w,h,R,C,ov);
  if(state.notes)drawNotes(x,w,h,sel,R,C,ov);
  if(withManual&&state.manual)drawManual(x,w,h,sel,R,C);
  return out;
}
function render(){
  var out=process(srcPrev,true);
  view.width=out.width;view.height=out.height;
  view.getContext('2d').drawImage(out,0,0);
}
var rt=0;
function requestRender(){clearTimeout(rt);rt=setTimeout(render,30)}

/* ---------- auto detect (contrast analysis) ---------- */
function autoDetect(){
  var R=state.rows,C=state.cols;
  var cap=384,sc=Math.min(1,cap/Math.max(srcPrev.width,srcPrev.height));
  var w=Math.max(8,Math.round(srcPrev.width*sc)),h=Math.max(8,Math.round(srcPrev.height*sc));
  var t=mk(w,h),tx=t.getContext('2d');
  tx.drawImage(srcPrev,0,0,w,h);
  var d=tx.getImageData(0,0,w,h).data;
  var gray=new Float32Array(w*h),i,x,y;
  for(i=0;i<w*h;i++)gray[i]=d[i*4]*.299+d[i*4+1]*.587+d[i*4+2]*.114;
  var rowDet=new Float32Array(R),rowN=new Float32Array(R);
  var colDet=new Float32Array(C),colN=new Float32Array(C);
  for(y=1;y<h-1;y++){
    var rb2=Math.min(R-1,Math.floor(y*R/h));
    for(x=1;x<w-1;x++){
      i=y*w+x;
      var g=Math.abs(gray[i+1]-gray[i-1])+Math.abs(gray[i+w]-gray[i-w]);
      var cb=Math.min(C-1,Math.floor(x*C/w));
      rowDet[rb2]+=g;rowN[rb2]++;colDet[cb]+=g;colN[cb]++;
    }
  }
  var rowsIdx=[],colsIdx=[];
  for(i=0;i<R;i++)rowsIdx.push([i,rowDet[i]/(rowN[i]||1)]);
  for(i=0;i<C;i++)colsIdx.push([i,colDet[i]/(colN[i]||1)]);
  rowsIdx.sort(function(a,b){return a[1]-b[1]});
  colsIdx.sort(function(a,b){return a[1]-b[1]});
  var p=probs();
  var nR=Math.round(R*p.row),nC=Math.round(C*p.col);
  if(nR+nC<1){if(state.balance>=50)nC=1;else nR=1}
  state.selRows=new Set();state.selCols=new Set();
  for(i=0;i<nR;i++)state.selRows.add(rowsIdx[i][0]);
  for(i=0;i<nC;i++)state.selCols.add(colsIdx[i][0]);
  state.selMode='fixed';
  status('自動検出: 低コントラスト帯を選択（行 '+nR+' 本 / 列 '+nC+' 本）。高ディテール領域は保持されます');
  render();
}

/* ---------- export ---------- */
function downloadBlob(b,name){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
}
function save(type){
  var c=process(srcFull,false);
  var ext=type==='image/png'?'.png':'.jpg';
  c.toBlob(function(b){
    if(!b){status('書き出しに失敗しました');return}
    downloadBlob(b,'grid-stretch_'+state.seed+ext);
    status('保存しました（'+c.width+'×'+c.height+'px）');
  },type,type==='image/jpeg'?state.jpgq/100:undefined);
}
function copyClip(){
  if(!navigator.clipboard||!window.ClipboardItem){status('このブラウザはクリップボード書き込みに未対応です');return}
  var c=process(srcFull,false);
  c.toBlob(function(b){
    if(!b){status('コピーに失敗しました');return}
    navigator.clipboard.write([new ClipboardItem({'image/png':b})])
      .then(function(){status('クリップボードにコピーしました（'+c.width+'×'+c.height+'px）')})
      .catch(function(e){status('コピー失敗: '+e.message)});
  },'image/png');
}

/* ---------- UI bindings ---------- */
function bindRange(id,key,opts){
  opts=opts||{};
  var el=$(id),val=$(id+'V');
  function upd(){val.textContent=el.value+(opts.suffix||'')}
  el.addEventListener('input',function(){
    state[key]=+el.value;upd();
    if(opts.resetSel)state.selMode='random';
    if(opts.onInput)opts.onInput();
    requestRender();
  });
  upd();
}
bindRange('strength','strength',{suffix:'%'});
bindRange('balance','balance',{resetSel:true});
bindRange('random','random',{resetSel:true,suffix:'%'});
bindRange('feather','feather',{suffix:'px'});
bindRange('jpgq','jpgq',{suffix:'%'});
bindRange('rowsN','rows',{resetSel:true,onInput:function(){
  if(state.link){$('colsN').value=$('rowsN').value;state.cols=state.rows;$('colsNV').textContent=$('colsN').value}
}});
bindRange('colsN','cols',{resetSel:true,onInput:function(){
  if(state.link){$('rowsN').value=$('colsN').value;state.rows=state.cols;$('rowsNV').textContent=$('rowsN').value}
}});

function bindChk(id,key,fn){
  $(id).addEventListener('change',function(){state[key]=$(id).checked;if(fn)fn();requestRender()});
}
bindChk('link','link');
bindChk('grid','grid');
bindChk('notes','notes');
bindChk('manual','manual',function(){
  $('manualHint').hidden=!state.manual;
  view.classList.toggle('manual',state.manual);
  if(state.manual)status('手動モード: プレビューをクリックで行を切替、Shift+クリックで列を切替');
});

$('seed').addEventListener('input',function(){
  var v=parseInt($('seed').value,10);
  if(isFinite(v)){state.seed=v;requestRender()}
});
$('diceBtn').addEventListener('click',function(){
  state.seed=1+Math.floor(Math.random()*99999);
  $('seed').value=state.seed;
  state.selMode='random';
  render();
});
$('autoBtn').addEventListener('click',autoDetect);
$('rotBtn').addEventListener('click',function(){
  var c=mk(srcFull.height,srcFull.width),x=c.getContext('2d');
  x.translate(c.width,0);x.rotate(Math.PI/2);x.drawImage(srcFull,0,0);
  srcFull=c;state.selMode='random';
  buildPreview();render();
});
$('resetBtn').addEventListener('click',function(){
  srcFull=copyCanvas(originalFull);
  state.selMode='random';state.selRows.clear();state.selCols.clear();
  buildPreview();render();status('画像を元に戻しました');
});
$('sampleBtn').addEventListener('click',function(){
  var s=makeSample();
  setSource(s,s.width,s.height,true);
  status('サンプル画像を生成しました');
});
$('upBtn').addEventListener('click',function(){$('file').click()});
$('file').addEventListener('change',function(){
  if($('file').files[0])loadBlob($('file').files[0]);
  $('file').value='';
});
$('pngBtn').addEventListener('click',function(){save('image/png')});
$('jpgBtn').addEventListener('click',function(){save('image/jpeg')});
$('copyBtn').addEventListener('click',copyClip);

/* manual band toggling */
view.addEventListener('click',function(e){
  if(!state.manual)return;
  var r=view.getBoundingClientRect();
  var nx=(e.clientX-r.left)/r.width,ny=(e.clientY-r.top)/r.height;
  if(nx<0||nx>=1||ny<0||ny>=1)return;
  if(state.selMode!=='fixed'){
    var s=currentSel(state.rows,state.cols);
    state.selRows=s.rows;state.selCols=s.cols;state.selMode='fixed';
  }
  if(e.shiftKey){
    var c=Math.min(state.cols-1,Math.floor(nx*state.cols));
    if(state.selCols.has(c))state.selCols.delete(c);else state.selCols.add(c);
  }else{
    var rw=Math.min(state.rows-1,Math.floor(ny*state.rows));
    if(state.selRows.has(rw))state.selRows.delete(rw);else state.selRows.add(rw);
  }
  render();
});

/* drag & drop / paste */
window.addEventListener('dragover',function(e){e.preventDefault()});
window.addEventListener('drop',function(e){e.preventDefault()});
stage.addEventListener('dragover',function(e){e.preventDefault();stage.classList.add('drag')});
stage.addEventListener('dragleave',function(){stage.classList.remove('drag')});
stage.addEventListener('drop',function(e){
  e.preventDefault();stage.classList.remove('drag');
  if(e.dataTransfer.files&&e.dataTransfer.files[0])loadBlob(e.dataTransfer.files[0]);
});
window.addEventListener('paste',function(e){
  var items=(e.clipboardData||{}).items||[];
  for(var i=0;i<items.length;i++){
    if(items[i].type.indexOf('image')===0){loadBlob(items[i].getAsFile());e.preventDefault();return}
  }
});

/* ---------- init ---------- */
var s0=makeSample();
setSource(s0,s0.width,s0.height,true);
status('画像をドロップ / ペースト / アップロードして開始。まずはサンプルで試せます');
})();
</script>
