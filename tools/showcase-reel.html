<style>
/* Showcase Reel — layout specific to this tool. Shared tokens come from tokens.css / workbench.css. */
body[data-ml-motion="showcase-reel"] #app{grid-template-columns:236px minmax(0,1fr) 316px}
#reelCenter{display:flex;flex-direction:column;min-width:0;min-height:0;background:#17191b}
#reelStage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:28px;background-image:radial-gradient(#303338 .65px,transparent .65px);background-size:14px 14px;overflow:hidden;touch-action:none;cursor:grab}
#reelStage.dragging{cursor:grabbing}
#reelStage.dragover::after{content:"ここにドロップして素材を追加";position:absolute;inset:14px;border:1px dashed var(--accent);border-radius:6px;background:rgba(82,140,224,.12);display:flex;align-items:center;justify-content:center;color:#dfe8f6;font-size:13px;pointer-events:none}
#view{display:block;background:#000}
#stageHint{position:absolute;right:14px;bottom:10px;font:9px/1.4 var(--ml-mono);color:#7d848e;pointer-events:none}
#transport{display:flex;align-items:center;gap:10px;padding:9px 13px;border-top:1px solid #353a42;background:#202326}
#transport button{background:#30343a;border:1px solid #444a52;border-radius:3px;color:#e3e8ef;font-size:11px;height:28px;min-width:30px;padding:0 9px;cursor:pointer}
#transport button:hover{border-color:#69727e}
#seek{flex:1;min-width:60px}
#time{font:10px var(--ml-mono);color:#b7bfca;white-space:nowrap;min-width:108px;text-align:right}
#stageMeta{display:flex;justify-content:space-between;padding:6px 13px;font:9px var(--ml-mono);color:#858d97;background:#1d2024;border-top:1px solid #30353b}
.rs-sec{padding:14px 12px;border-bottom:1px solid #35383e}
.rs-sec>h2{font:600 11px/1.5 var(--ml-ui);color:#d4d9df;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.rs-sec>h2 small{font:9px var(--ml-mono);color:#8a919b;font-weight:400}
#templateGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.tpl{display:flex;flex-direction:column;gap:5px;padding:4px 4px 6px;background:#26292d;border:1px solid #393d43;border-radius:5px;color:#c9d0d9;cursor:pointer;text-align:left;font-size:10px;min-width:0}
.tpl:hover{border-color:#5a616b}
.tpl[aria-pressed=true]{border-color:var(--accent);background:rgba(82,140,224,.14);color:#eef3fa}
.tpl canvas{width:100%;aspect-ratio:16/10;border-radius:3px;background:#111;display:block}
.tpl span{padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#styleChips{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.chip{display:flex;align-items:center;gap:6px;padding:6px 7px;border:1px solid #393d43;border-radius:4px;background:#26292d;color:#c9d0d9;font-size:10px;cursor:pointer;min-width:0}
.chip i{width:14px;height:14px;border-radius:3px;flex:0 0 14px;box-shadow:inset 0 0 0 1px #ffffff22}
.chip[aria-pressed=true]{border-color:var(--accent);background:rgba(82,140,224,.14);color:#eef3fa}
#drop{display:block;width:100%;padding:13px 8px;border:1px dashed #4a5059;border-radius:4px;background:#24272b;color:#d6dce4;text-align:center;cursor:pointer;font-size:11px}
#drop small{display:block;color:#8d949e;font-size:9px;margin-top:3px}
#drop:hover{border-color:var(--accent)}
#mediaList{display:grid;gap:5px;margin-top:9px}
.media{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:7px;padding:4px;border:1px solid #363a40;border-radius:4px;background:#222428}
.media img,.media canvas{width:40px;height:28px;object-fit:cover;border-radius:2px;background:#111;display:block}
.media .nm{font-size:10px;color:#cfd5dd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.media .nm small{display:block;font:8px var(--ml-mono);color:#858c96}
.media .ops{display:flex;gap:2px}
.media .ops button{background:none;border:1px solid transparent;color:#9aa2ad;font-size:10px;padding:2px 4px;border-radius:3px;cursor:pointer}
.media .ops button:hover{border-color:#4b515a;color:#e3e8ef}
.media .ops button:disabled{opacity:.3}
.hint{font-size:10px;color:#929aa4;line-height:1.65;margin:8px 0 0}
#panel details{border-bottom:1px solid #35383e;padding:0}
#panel summary{padding:13px 14px;font:600 11px/1.5 var(--ml-ui);color:#d4d9df;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
#panel summary::-webkit-details-marker{display:none}
#panel summary::after{content:"＋";color:#7e8691;font-weight:400}
#panel details[open] summary::after{content:"－"}
#panel .body{padding:0 14px 14px}
.row{display:grid;grid-template-columns:86px minmax(0,1fr) 50px;align-items:center;gap:8px;margin-top:9px}
.row.wide{grid-template-columns:86px minmax(0,1fr)}
.row>label{font-size:10px;color:#afb6c1}
.row input[type=range]{width:100%;min-width:0;height:2px}
.row input[type=number]{width:50px;background:#2d3035;border:1px solid #3c4047;border-radius:3px;color:#d4dbe5;font:10px var(--ml-mono);padding:3px 4px;text-align:right}
.row select,.row input[type=text]{width:100%;min-width:0;background:#2d3035;border:1px solid #3b4048;border-radius:3px;color:#d4dbe5;font-size:10px;padding:5px 6px;min-height:27px}
.row input[type=color]{width:100%;height:24px;border:1px solid #3b4048;border-radius:3px;background:#2d3035;padding:1px 2px}
.row input[type=checkbox]{justify-self:start}
.row[hidden]{display:none}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.btns button,.btn{background:#30343a;border:1px solid #484e56;border-radius:4px;color:#e7ebf1;font-size:11px;padding:7px 8px;cursor:pointer}
.btns button:hover,.btn:hover{border-color:#69727e}
.btns .primary{background:var(--accent);border-color:var(--accent);color:#fff;grid-column:1/-1}
#status{font-size:10px;color:#97a0ab;min-height:15px;margin-top:9px}
#exportDialog{background:#202123;border:1px solid #3a3e44;border-radius:10px;color:#e6eaf0;width:380px;padding:22px}
#exportDialog::backdrop{background:#0b0c0dcc}
#exportDialog h2{font-size:14px;margin:0 0 8px}
#exportDialog p{font-size:11px;color:#a9b1bc;margin:0 0 12px}
#exportDialog progress{width:100%;accent-color:var(--accent)}
#toast{position:fixed;left:50%;top:62px;transform:translateX(-50%);background:#2a2d32;border:1px solid #4a5059;border-radius:6px;padding:8px 14px;font-size:11px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
@media(max-width:1180px) and (min-width:821px){body[data-ml-motion="showcase-reel"] #app{grid-template-columns:200px minmax(0,1fr) 292px}#templateGrid{grid-template-columns:1fr 1fr}}
@media(max-width:820px){#reelCenter{order:1;height:52dvh;min-height:320px}#templateGrid{grid-template-columns:repeat(4,1fr)}#styleChips{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body class="ml-workbench ml-motion-workbench" data-ml-motion="showcase-reel">
<header id="mlMotionToolbar" class="ml-toolbar"><div class="ml-motion-home"><a href="../index.html" id="mlab-home" class="ml-home">↖ MOTION LAB</a></div><div class="ml-document"><strong>Showcase Reel</strong><span class="ml-context">デザインを、見せるための動きに</span></div><div class="ml-toolbar-actions"><span class="ml-motion-local">ブラウザ内で処理</span><button id="undo" class="ml-button" type="button" title="元に戻す (⌘Z)" disabled>↶</button><button id="redo" class="ml-button" type="button" title="やり直す (⇧⌘Z)" disabled>↷</button><button id="mlMotionExport" class="ml-button ml-primary" type="button">書き出し ↗</button></div></header>

<div id="app">
 <aside class="ml-motion-sources" id="mlMotionSources" aria-label="テンプレートと素材">
  <section class="rs-sec"><h2>01 テンプレート <small id="tplName"></small></h2><div id="templateGrid" role="group" aria-label="テンプレート"></div><p class="hint" id="tplDesc"></p></section>
  <section class="rs-sec"><h2>02 スタイル</h2><div id="styleChips" role="group" aria-label="スタイル"></div></section>
  <section class="rs-sec"><h2>03 素材 <small id="mediaCount"></small></h2>
   <button id="drop" type="button">＋ 画像・動画を追加<small>PNG / JPG / WebP / SVG / MP4 / WebM・ドロップ可</small></button>
   <input id="files" type="file" accept="image/*,video/*" multiple hidden>
   <div id="mediaList"></div>
   <p class="hint" id="mediaHint">いまはサンプル素材です。自分のデザインを追加すると置き換わります。素材は外部に送信しません。</p>
  </section>
 </aside>

 <main id="reelCenter">
  <div id="reelStage"><canvas id="view" aria-label="プレビュー"></canvas><span id="stageHint">ドラッグ: 角度 / ホイール: ズーム / ダブルクリック: カメラを戻す</span></div>
  <div id="transport"><button id="play" type="button" aria-label="再生 / 一時停止">❚❚</button><button id="restart" type="button" title="最初から">↺</button><input id="seek" type="range" min="0" max="1" step="0.0001" value="0" aria-label="再生位置"><span id="time">0.00 / 0.00 s</span></div>
  <div id="stageMeta"><span id="dims"></span><span id="loopInfo"></span></div>
 </main>

 <aside id="panel" aria-label="パラメータ">
  <details open data-sec="layout"><summary>レイアウト</summary><div class="body"></div></details>
  <details open data-sec="camera"><summary>カメラ</summary><div class="body"></div></details>
  <details data-sec="card"><summary>カード</summary><div class="body"></div></details>
  <details data-sec="shadow"><summary>影</summary><div class="body"></div></details>
  <details data-sec="bg"><summary>背景</summary><div class="body"></div></details>
  <details data-sec="text"><summary>テキスト</summary><div class="body"></div></details>
  <details data-sec="finish"><summary>仕上げ</summary><div class="body"></div></details>
  <details open data-sec="export" id="exportSec"><summary>書き出し</summary><div class="body"></div>
   <div class="body"><div class="btns"><button class="primary" id="exVideo" type="button">動画を書き出す（MP4）</button><button id="exPng" type="button">今のフレームをPNG</button><button id="exSeq" type="button">PNG連番 ZIP</button><button id="saveJson" type="button">設定を保存</button><button id="loadJson" type="button">設定を読み込む</button></div><input id="jsonFile" type="file" accept=".json,application/json" hidden><p id="status" role="status"></p><p class="hint">MP4はコマ送りで描画してからエンコードするので、重い設定でもコマ落ちしません。設定ファイルには素材を含みません。</p></div>
  </details>
 </aside>
</div>
<dialog id="exportDialog"><h2>書き出しています</h2><p id="exportMsg"></p><progress id="exportProg" max="1" value="0"></progress><div class="btns"><button id="exCancel" type="button">中止</button></div></dialog>
<div id="toast" role="status"></div>

<script>
'use strict';
/* ==================================================================
   Showcase Reel — turn still designs / clips into a looping 3D showcase.
   One WebGL2 renderer: background → cards (shadow + rounded card) → text → finish.
   World units: the short side of the canvas is always 1000 units, so a preview
   and a 4K export look identical.
================================================================== */
const $=s=>document.querySelector(s);
const D2R=Math.PI/180, TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const mod=(a,n)=>((a%n)+n)%n, fract=x=>x-Math.floor(x);
const hash=i=>fract(Math.sin(i*127.1+311.7)*43758.5453);
const EASES={
  expo:t=>{const a=Math.pow(2,-11),r=t<.5?Math.pow(2,20*t-10)/2:(2-Math.pow(2,-20*t+10))/2;return t<=0?0:t>=1?1:(r-a)/(1-2*a);},
  cubic:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  back:t=>{const c1=1.70158,c2=c1*1.525;return t<.5?(Math.pow(2*t,2)*((c2+1)*2*t-c2))/2:(Math.pow(2*t-2,2)*((c2+1)*(t*2-2)+c2)+2)/2;},
  sine:t=>-(Math.cos(Math.PI*t)-1)/2,
  linear:t=>t
};
const hex2rgb=h=>{const n=parseInt(h.slice(1),16);return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];};
const ratioOf=(r,fallback)=>{if(r==='auto')return fallback;const [a,b]=r.split(':').map(Number);return a/b;};

/* ---------------- parameters ---------------- */
const BASE={
  template:'wall',style:'midnight',
  size:330,gap:28,ratio:'16:10',speed:1,loop:12,hold:2.4,trans:.8,ease:'expo',count:12,rows:3,alt:true,angle:40,depth:7000,spread:420,
  tiltX:0,tiltY:0,tiltZ:0,zoom:1,fov:38,drift:0,fog:.35,
  radius:14,frame:'none',frameColor:'#16171a',border:0,borderColor:'#ffffff',borderA:.18,
  shadow:.45,shadowBlur:46,shadowY:18,shadowColor:'#000000',
  bgMode:'linear',bg1:'#0d0e12',bg2:'#1b1e2b',bgAngle:90,pattern:'none',patternOp:.12,
  title:'',subtitle:'',textPos:'bottom-left',textColor:'#ffffff',textSize:56,
  grain:.15,vignette:.35,
  aspect:'16:9',quality:1080,fps:30,loops:1,mblur:1
};
const TEMPLATES={
  wall:{name:'タイルウォール',desc:'傾けた面いっぱいにカードを敷き詰め、列ごとに逆方向へ流す。',
    uses:['size','gap','ratio','speed','loop','alt'],
    defaults:{size:330,gap:28,ratio:'16:10',speed:1,loop:12,alt:true,tiltX:-38,tiltY:0,tiltZ:-22,zoom:1,fov:38,drift:2,fog:.35}},
  marquee:{name:'マーキー',desc:'横に長い帯を数段、交互の向きに流し続ける。',
    uses:['size','gap','ratio','speed','loop','rows'],
    defaults:{size:380,gap:26,ratio:'16:10',speed:1,loop:12,rows:3,tiltX:-12,tiltY:14,tiltZ:-7,zoom:1,fov:38,drift:1.5,fog:.2}},
  cascade:{name:'カスケード',desc:'縦の列が異なる速さで落ちていく。ポスターや縦長UI向き。',
    uses:['size','gap','ratio','speed','loop'],
    defaults:{size:270,gap:24,ratio:'4:5',speed:1,loop:14,tiltX:-10,tiltY:-16,tiltZ:0,zoom:1,fov:38,drift:1.5,fog:.25}},
  carousel:{fit:true,name:'リング',desc:'カードを円環に並べ、ゆっくり回転させる。',
    uses:['size','gap','ratio','speed','loop','count'],
    defaults:{size:330,gap:40,ratio:'16:10',speed:1,loop:12,count:10,tiltX:-10,tiltY:0,tiltZ:0,zoom:1.3,fov:34,drift:2,fog:.55}},
  tunnel:{name:'フライスルー',desc:'奥から手前へカードが飛んでくる。カメラが中を進む感覚。',
    uses:['size','ratio','speed','loop','count','depth','spread'],
    defaults:{size:340,ratio:'16:10',speed:1,loop:12,count:34,depth:7000,spread:520,tiltX:0,tiltY:0,tiltZ:0,zoom:1,fov:50,drift:3,fog:.75}},
  deck:{fit:true,name:'デッキ',desc:'重ねたカードを1枚ずつ後ろへ送る。1枚ずつ見せたいときに。',
    uses:['size','ratio','hold','trans','ease'],
    defaults:{size:640,ratio:'auto',hold:2.4,trans:.8,ease:'expo',tiltX:-14,tiltY:22,tiltZ:0,zoom:1,fov:34,drift:1.5,fog:.2}},
  focus:{fit:true,name:'フォーカス',desc:'中央の1枚を大きく見せ、左右に次の作品を控えさせて送る。',
    uses:['size','gap','ratio','hold','trans','ease','angle'],
    defaults:{size:720,gap:40,ratio:'auto',hold:2.2,trans:.75,ease:'expo',angle:40,tiltX:-4,tiltY:0,tiltZ:0,zoom:1,fov:34,drift:1.2,fog:.45}},
  spread:{name:'展開',desc:'中央の束からグリッドへ広がり、また束に戻る。',
    uses:['size','gap','ratio','loop','count','ease'],
    defaults:{size:300,gap:30,ratio:'16:10',loop:8,count:12,ease:'expo',tiltX:-20,tiltY:12,tiltZ:-4,zoom:1,fov:36,drift:2,fog:.25}},
  fan:{fit:true,name:'ファン',desc:'手札のように扇状に広げ、1枚ずつ持ち上げる。',
    uses:['size','ratio','speed','loop','count','angle'],
    defaults:{size:300,ratio:'4:5',speed:1,loop:9,count:9,angle:9,tiltX:-8,tiltY:0,tiltZ:0,zoom:1,fov:34,drift:1.5,fog:.2}}
};
const STYLES={
  midnight:{name:'ミッドナイト',sw:['#0d0e12','#1b1e2b'],v:{bgMode:'linear',bg1:'#0d0e12',bg2:'#1b1e2b',bgAngle:90,pattern:'none',shadow:.5,shadowBlur:46,shadowY:18,shadowColor:'#000000',border:1.2,borderColor:'#ffffff',borderA:.12,radius:14,frameColor:'#16171a',grain:.15,vignette:.35,textColor:'#ffffff'}},
  paper:{name:'ペーパー',sw:['#efeee9','#dedcd4'],v:{bgMode:'radial',bg1:'#f4f3ef',bg2:'#d9d7cf',bgAngle:90,pattern:'dots',patternOp:.14,shadow:.22,shadowBlur:54,shadowY:26,shadowColor:'#2a2620',border:0,borderColor:'#000000',borderA:.1,radius:12,frameColor:'#ffffff',grain:.12,vignette:.1,textColor:'#1a1a1a'}},
  iris:{name:'アイリス',sw:['#3b2cff','#c86bff'],v:{bgMode:'linear',bg1:'#2a1fd6',bg2:'#d68cff',bgAngle:35,pattern:'none',shadow:.4,shadowBlur:60,shadowY:30,shadowColor:'#12063a',border:1.5,borderColor:'#ffffff',borderA:.28,radius:18,frameColor:'#ffffff',grain:.2,vignette:.2,textColor:'#ffffff'}},
  ember:{name:'エンバー',sw:['#ff5a1f','#2a0d06'],v:{bgMode:'radial',bg1:'#ff6a2b',bg2:'#1d0804',bgAngle:90,pattern:'none',shadow:.55,shadowBlur:50,shadowY:22,shadowColor:'#140300',border:0,borderColor:'#ffffff',borderA:.2,radius:10,frameColor:'#120806',grain:.22,vignette:.4,textColor:'#fff4ea'}},
  mint:{name:'ミント',sw:['#cdf5e2','#7fd8c0'],v:{bgMode:'linear',bg1:'#e2fbef',bg2:'#86d9c4',bgAngle:120,pattern:'grid',patternOp:.1,shadow:.25,shadowBlur:44,shadowY:20,shadowColor:'#0b3b30',border:0,borderColor:'#000000',borderA:.1,radius:16,frameColor:'#ffffff',grain:.1,vignette:.08,textColor:'#0d2a24'}},
  studio:{name:'スタジオ',sw:['#2b2d31','#55585e'],v:{bgMode:'radial',bg1:'#4a4d53',bg2:'#151619',bgAngle:90,pattern:'grid',patternOp:.06,shadow:.6,shadowBlur:40,shadowY:16,shadowColor:'#000000',border:1,borderColor:'#ffffff',borderA:.08,radius:8,frameColor:'#1c1d20',grain:.18,vignette:.45,textColor:'#f2f2f2'}}
};
const ALL_LAYOUT=['size','gap','ratio','speed','loop','hold','trans','ease','count','rows','alt','angle','depth','spread'];
const CONTROLS=[
  /* layout */
  {sec:'layout',k:'size',label:'カードの大きさ',type:'range',min:80,max:1400,step:1},
  {sec:'layout',k:'gap',label:'間隔',type:'range',min:0,max:200,step:1},
  {sec:'layout',k:'ratio',label:'カード比率',type:'select',opts:[['auto','素材に合わせる'],['16:10','16:10'],['16:9','16:9'],['4:3','4:3'],['1:1','1:1'],['4:5','4:5'],['9:16','9:16']]},
  {sec:'layout',k:'speed',label:'速さ',type:'range',min:1,max:5,step:1,unit:'×'},
  {sec:'layout',k:'loop',label:'1ループ',type:'range',min:3,max:40,step:.5,unit:'s'},
  {sec:'layout',k:'hold',label:'1枚の時間',type:'range',min:.6,max:8,step:.1,unit:'s'},
  {sec:'layout',k:'trans',label:'送りの時間',type:'range',min:.15,max:3,step:.05,unit:'s'},
  {sec:'layout',k:'ease',label:'イージング',type:'select',opts:[['expo','エクスポ（キレ）'],['cubic','キュービック'],['back','バック（反動）'],['sine','サイン（柔らか）'],['linear','リニア']]},
  {sec:'layout',k:'count',label:'枚数',type:'range',min:3,max:48,step:1},
  {sec:'layout',k:'rows',label:'段数',type:'range',min:1,max:7,step:1},
  {sec:'layout',k:'alt',label:'交互に逆走',type:'check'},
  {sec:'layout',k:'angle',label:'開き角',type:'range',min:0,max:80,step:1,unit:'°'},
  {sec:'layout',k:'depth',label:'奥行き',type:'range',min:1500,max:16000,step:50},
  {sec:'layout',k:'spread',label:'広がり',type:'range',min:0,max:1200,step:5},
  /* camera */
  {sec:'camera',k:'tiltX',label:'傾き X',type:'range',min:-80,max:80,step:.5,unit:'°'},
  {sec:'camera',k:'tiltY',label:'傾き Y',type:'range',min:-80,max:80,step:.5,unit:'°'},
  {sec:'camera',k:'tiltZ',label:'回転 Z',type:'range',min:-90,max:90,step:.5,unit:'°'},

/* ---------------- loop length & layouts ---------------- */
function loopLength(p,N){
  if(p.template==='deck')return Math.max(N,3)*p.hold;
  if(p.template==='focus')return Math.max(N,1)*p.hold;
  return p.loop;
}
/* Continuous belts. Each line moves a whole number of pattern periods per loop, so the
   last frame meets the first frame exactly (media assignment repeats every P cards). */
function belts(t,c,o){
  const p=c.p,N=c.N,r=ratioOf(p.ratio,c.aspect(0)),w=p.size,h=w/r,g=p.gap;
  const along=o.axis==='y'?h+g:w+g, across=o.axis==='y'?w+g:h+g;
  const P=Math.max(N,3), u=t/c.L, reach=c.reach, out=[];
  let lines=[];
  if(o.lines){for(let l=0;l<o.lines;l++)lines.push({l,pos:(l-(o.lines-1)/2)*across});}
  else{const n=Math.ceil(reach/across)+1;for(let l=-n;l<=n;l++)lines.push({l,pos:l*across});}
  const span=Math.ceil(reach/along)+2;
  for(const {l,pos} of lines){
    const s=o.dir(l)*o.mult(l)*p.speed*P*u, off=o.offset(l);
    const base=Math.floor(-s-off);
    for(let j=base-span;j<=base+span;j++){
      const a=(j+s+off)*along, m=mod(mod(j,P)+mod(l,9973)*2,N);
      out.push(o.axis==='y'?{m,x:pos,y:a,z:0,w,h}:{m,x:a,y:pos,z:0,w,h});
      if(out.length>2400)return out;
    }
  }
  return out;
}
const LAYOUTS={

  marquee:(t,c)=>belts(t,c,{axis:'x',lines:c.p.rows,dir:l=>l%2?1:-1,mult:()=>1,offset:l=>hash(l)*.9}),
  cascade:(t,c)=>belts(t,c,{axis:'y',dir:()=>-1,mult:l=>mod(l,2)?2:1,offset:l=>hash(l+4)}),
  carousel(t,c){
    const p=c.p,N=c.N,r=ratioOf(p.ratio,c.aspect(0)),w=p.size,h=w/r;
    const M=N*Math.max(1,Math.ceil(Math.max(p.count,3)/N)), R=Math.max(M*(w+p.gap)/TAU,w*.6);
    const rot=TAU*(N/M)*p.speed*(t/c.L), out=[];
    for(let i=0;i<M;i++){const a=TAU*i/M+rot;out.push({m:i%N,x:R*Math.sin(a),y:0,z:R*Math.cos(a)-R,ry:a,w,h,dim:(1-Math.cos(a))*.18});}

  },
  tunnel(t,c){
    const p=c.p,N=c.N,M=Math.max(4,p.count),out=[];

      const f=fract(i/M+p.speed*t/c.L), th=i*2.39996+.4, rad=p.spread*(.85+.5*hash(i));

  },
  deck(t,c){
    const p=c.p,N=c.N,Nn=Math.max(N,3),T=p.hold,ph=t/T,cur=mod(Math.floor(ph),Nn),local=fract(ph);
    const tr=clamp(p.trans/T,.05,.95), e=EASES[p.ease](clamp((local-(1-tr))/tr,0,1)), out=[];

  focus(t,c){

  },
  spread(t,c){
    const p=c.p,N=c.N,M=Math.max(2,p.count),r=ratioOf(p.ratio,c.aspect(0)),u=t/c.L,E=EASES[p.ease];
    let w=p.size,h=w/r;

  },
  fan(t,c){
    const p=c.p,N=c.N,M=Math.max(2,p.count),r=ratioOf(p.ratio,c.aspect(0)),w=p.size,h=w/r,out=[];
    const R=h*2.4, step=p.angle*D2R, sway=Math.sin(TAU*t/c.L)*.025;

    }
    return out;
  }
};

/* ---------------- matrices (column-major) ---------------- */
const M4={
  mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];}return o;},
  persp(f,asp,n,fa){const t=1/Math.tan(f/2),o=new Float32Array(16);o[0]=t/asp;o[5]=t;o[10]=(fa+n)/(n-fa);o[11]=-1;o[14]=2*fa*n/(n-fa);return o;},
  trs(x,y,z,rx,ry,rz,s){
    const cx=Math.cos(rx),sx=Math.sin(rx),cy=Math.cos(ry),sy=Math.sin(ry),cz=Math.cos(rz),sz=Math.sin(rz);
    // R = Ry * Rx * Rz
    const m00=cy*cz+sy*sx*sz, m01=-cy*sz+sy*sx*cz, m02=sy*cx;
    const m10=cx*sz, m11=cx*cz, m12=-sx;
    const m20=-sy*cz+cy*sx*sz, m21=sy*sz+cy*sx*cz, m22=cy*cx;
    return new Float32Array([m00*s,m10*s,m20*s,0, m01*s,m11*s,m21*s,0, m02*s,m12*s,m22*s,0, x,y,z,1]);
  },
  global(tx,ty,tz,zoom){ // Rx * Ry * Rz * S
    const A=M4.trs(0,0,0,tx,0,0,1),B=M4.trs(0,0,0,0,ty,0,1),C=M4.trs(0,0,0,0,0,tz,zoom);return M4.mul(A,M4.mul(B,C));
  }
};
function xf(m,x,y,z){return [m[0]*x+m[4]*y+m[8]*z+m[12],m[1]*x+m[5]*y+m[9]*z+m[13],m[2]*x+m[6]*y+m[10]*z+m[14],m[3]*x+m[7]*y+m[11]*z+m[15]];}

/* ---------------- WebGL renderer ---------------- */
const VS=`#version 300 es
in vec2 aPos;uniform mat4 uMVP;uniform vec2 uSize;uniform float uExpand;out vec2 vLocal;
void main(){vec2 p=aPos*(uSize+vec2(uExpand*2.));vLocal=p;gl_Position=uMVP*vec4(p,0.,1.);}`;
const VS_FULL=`#version 300 es
in vec2 aPos;out vec2 vUv;void main(){vUv=aPos+.5;gl_Position=vec4(aPos*2.,0.,1.);}`;
const FS_CARD=`#version 300 es

uniform vec2 uSize;uniform float uRadius,uAlpha,uDim,uAspect,uBorder,uBorderA,uMode,uBlur,uShadow;
uniform vec3 uFog,uBorderC,uFrameC,uShadowC;uniform int uFrame;uniform sampler2D uTex;

  if(st.y>1.-hbs){content=false;vec2 bp=vec2(vLocal.x+hs.x,vLocal.y-(hs.y-hb*.5));float r=hb*.15;
   for(int i=0;i<3;i++){float dd=length(bp-vec2(hb*.62+float(i)*hb*.5,0.))-r;col=mix(col,uFrameC+vec3(.17),1.-smoothstep(-aa,aa,dd));}

 }

const FS_BG=`#version 300 es

class Renderer{
  constructor(canvas){
    this.canvas=canvas;
    const gl=canvas.getContext('webgl2',{alpha:false,antialias:true,premultipliedAlpha:true,preserveDrawingBuffer:false});
    if(!gl)throw Error('WebGL2 unavailable');

    this.aniso=gl.getExtension('EXT_texture_filter_anisotropic');
    this.pCard=this.program(VS,FS_CARD);this.pBg=this.program(VS_FULL,FS_BG);this.pPost=this.program(VS_FULL,FS_POST);
    this.vao=gl.createVertexArray();gl.bindVertexArray(this.vao);
    const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-.5,-.5,.5,-.5,-.5,.5,.5,.5]),gl.STATIC_DRAW);
    for(const p of [this.pCard,this.pBg,this.pPost]){const loc=gl.getAttribLocation(p.prog,'aPos');if(loc>=0){gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);}}
    this.textTex=gl.createTexture();this.textKey='';
    this.white=this.solidTex([255,255,255,255]);
  }
  program(vs,fs){
    const gl=this.gl,mk=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;};
    const prog=gl.createProgram();gl.attachShader(prog,mk(gl.VERTEX_SHADER,vs));gl.attachShader(prog,mk(gl.FRAGMENT_SHADER,fs));gl.bindAttribLocation(prog,0,'aPos');gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));
    const cache={};return {prog,u:n=>n in cache?cache[n]:(cache[n]=gl.getUniformLocation(prog,n))};
  }
  solidTex(rgba){const gl=this.gl,t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array(rgba));return t;}
  texFor(src){
    const gl=this.gl;let e=this.textures.get(src.id);
    if(!e){e={tex:gl.createTexture(),ready:false,frame:-1};this.textures.set(src.id,e);}
    const isVideo=src.kind==='video';
    if(e.ready&&!isVideo)return e.tex;
    if(isVideo&&(e.frame===this.frame||src.el.readyState<2))return e.ready?e.tex:this.white;
    gl.bindTexture(gl.TEXTURE_2D,e.tex);

  textTexture(p,W,H){

    if(key!==this.textKey){
      const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d'),U=Math.min(W,H)/1000;

      const reach=Math.hypot(Wd,Hd)*.62/p.zoom*(1+2.2*Math.max(Math.abs(Math.sin(p.tiltX*D2R)),Math.abs(Math.sin(p.tiltY*D2R))));
      const ctx={p,N,Wd,Hd,L,dist,reach:Math.min(reach,Math.hypot(Wd,Hd)*3.2/p.zoom),aspect:i=>sources[mod(i,N)].aspect};
      const inst=(LAYOUTS[p.template]||LAYOUTS.wall)(tt,ctx);
      const ph=TAU*tt/L,dx=p.drift*Math.sin(ph),dy=p.drift*Math.cos(ph);
      /* object-style templates are composed for 16:9; shrink them for square / portrait frames */

      gl.uniform1f(P.u('uRadius'),p.radius);gl.uniform1f(P.u('uBorder'),p.border);gl.uniform1f(P.u('uBorderA'),p.borderA);
      gl.uniform3fv(P.u('uBorderC'),hex2rgb(p.borderColor));gl.uniform3fv(P.u('uFrameC'),hex2rgb(p.frameColor));gl.uniform3fv(P.u('uShadowC'),hex2rgb(p.shadowColor));

/* ---------------- sample designs (procedural, original) ---------------- */

    const c=document.createElement('canvas');c.width=1600;c.height=1000;const g=c.getContext('2d');
    const F='-apple-system,"Segoe UI","Noto Sans JP",sans-serif',rr=(x,y,w,h,r)=>{g.beginPath();g.roundRect(x,y,w,h,r);g.fill();};
    g.fillStyle=bg;g.fillRect(0,0,1600,1000);
    g.fillStyle=fg;g.globalAlpha=.9;g.font=`600 30px ${F}`;g.fillText(words[i],70,82);
    g.globalAlpha=.45;for(let k=0;k<4;k++)rr(1000+k*130,62,90,14,7);g.globalAlpha=1;
    if(i===0){g.font=`800 190px ${F}`;g.fillText('Make it',70,420);g.fillText('move.',70,600);g.fillStyle=ac;g.beginPath();g.arc(1220,560,250,0,TAU);g.fill();g.fillStyle=fg;rr(70,700,260,70,35);}
    if(i===1){g.globalAlpha=.08;rr(70,140,300,800,18);g.globalAlpha=1;for(let k=0;k<3;k++){g.globalAlpha=.08;rr(410+k*380,140,350,220,18);g.globalAlpha=1;g.font=`700 64px ${F}`;g.fillText(['82%','1.4k','36'][k],450+k*380,290);}
      g.fillStyle=ac;for(let k=0;k<14;k++){const h=120+((k*53)%9)*38;rr(430+k*80,920-h,46,h,8);}}
    if(i===2){g.font=`900 420px ${F}`;g.fillText('LOUD',40,560);g.font=`900 260px ${F}`;g.fillText('/26',820,900);g.fillRect(70,620,700,14);}
    if(i===3){for(let k=0;k<6;k++){const x=70+(k%3)*500,y=150+Math.floor(k/3)*410;g.fillStyle=k%2?ac:fg;g.globalAlpha=k%2?1:.1;rr(x,y,460,370,30);g.globalAlpha=1;g.fillStyle=k%2?bg:fg;g.font=`600 34px ${F}`;g.fillText(['Inbox','Focus','Notes','Plan','Pulse','Sync'][k],x+36,y+70);}}
    if(i===4){const gr=g.createLinearGradient(0,0,1600,1000);gr.addColorStop(0,'#d9f7ea');gr.addColorStop(1,'#7bd6b5');g.fillStyle=gr;rr(70,140,860,780,28);g.fillStyle=fg;g.font=`700 92px ${F}`;g.fillText('Fieldnote',990,330);g.globalAlpha=.4;for(let k=0;k<6;k++)rr(990,390+k*48,480-(k%3)*90,16,8);g.globalAlpha=1;g.fillStyle=ac;rr(990,760,240,74,37);}
    if(i===5){for(let k=0;k<5;k++){g.fillStyle=k===2?ac:fg;g.globalAlpha=k===2?1:.12;g.beginPath();g.arc(300+k*250,520,200-k*12,0,TAU);g.fill();}g.globalAlpha=1;g.fillStyle=fg;g.font=`300 120px ${F}`;g.fillText('Prism',70,920);}

/* ---------------- state ---------------- */
const STORE='ml-showcase-reel:v1';
let P={...BASE,...TEMPLATES.wall.defaults};
try{const saved=JSON.parse(localStorage.getItem(STORE)||'null');if(saved&&typeof saved==='object')P=sanitize({...P,...saved});}catch(_){}
let sources=makeSamples(), time=0, playing=true, last=performance.now(), busy=false, cancelled=false, dirtyThumbs=true;
let undoStack=[], redoStack=[], committed=JSON.stringify(P);
const view=$('#view');
let R=null;
try{R=new Renderer(view);}catch(e){console.warn(e);}
if(!R){window.MLWorkbench?.requireGraphics({canvas:document.createElement('canvas'),context:'webgl2',stage:'#reelStage',controls:'#app'});document.body.classList.add('ml-render-unavailable');}

function sanitize(p){
  const out={...BASE};
  for(const k of Object.keys(BASE)){
    if(!(k in p))continue;const v=p[k],d=BASE[k];
    if(typeof d==='number'){const n=Number(v);if(Number.isFinite(n)){const c=CONTROLS.find(x=>x.k===k);out[k]=c&&c.type==='range'?clamp(n,c.min,c.max):n;}}
    else if(typeof d==='boolean')out[k]=!!v;
    else if(typeof v==='string'){const c=CONTROLS.find(x=>x.k===k);
      if(c&&c.type==='select'&&!c.opts.some(o=>o[0]===v))continue;
      if(c&&c.type==='color'&&!/^#[0-9a-f]{6}$/i.test(v))continue;
      out[k]=v.slice(0,200);}
  }
  if(!TEMPLATES[out.template])out.template='wall';if(!STYLES[out.style])out.style='midnight';
  for(const k of ['quality','fps','mblur','loops']){const c=CONTROLS.find(x=>x.k===k);if(!c.opts.some(o=>Number(o[0])===out[k]))out[k]=BASE[k];}
  return out;
}

/* ---------------- UI build ---------------- */
const inputs={};
for(const c of CONTROLS){
  const host=document.querySelector(`#panel details[data-sec="${c.sec}"] .body`);
  const row=document.createElement('div');row.className='row'+(c.type==='range'?'':' wide');row.dataset.k=c.k;
  const id='in_'+c.k,lab=document.createElement('label');lab.htmlFor=id;lab.textContent=c.label;row.append(lab);
  let el;
  if(c.type==='range'){
    el=document.createElement('input');el.type='range';el.min=c.min;el.max=c.max;el.step=c.step;
    const num=document.createElement('input');num.type='number';num.min=c.min;num.max=c.max;num.step=c.step;num.setAttribute('aria-label',c.label+'（数値）');
    num.addEventListener('input',()=>{const v=Number(num.value);if(Number.isFinite(v)){set(c.k,clamp(v,c.min,c.max));el.value=P[c.k];}});
    num.addEventListener('change',commit);
    el.addEventListener('input',()=>{set(c.k,Number(el.value));num.value=fmt(P[c.k]);});
    row.append(el,num);row._num=num;
  }else if(c.type==='select'){
    el=document.createElement('select');for(const [v,l] of c.opts){const o=document.createElement('option');o.value=v;o.textContent=l;el.append(o);}
    el.addEventListener('input',()=>set(c.k,c.num?Number(el.value):el.value));row.append(el);
  }else if(c.type==='check'){
    el=document.createElement('input');el.type='checkbox';el.addEventListener('input',()=>set(c.k,el.checked));row.append(el);
  }else{
    el=document.createElement('input');el.type=c.type==='color'?'color':'text';if(c.ph)el.placeholder=c.ph;if(c.type==='text')el.maxLength=120;
    el.addEventListener('input',()=>set(c.k,el.value));row.append(el);
  }
  el.id=id;el.addEventListener('change',commit);inputs[c.k]={el,row,c};host.append(row);
}
function fmt(v){return Math.round(v*100)/100;}
function syncInputs(){
  const uses=TEMPLATES[P.template].uses;
  for(const k in inputs){const {el,row,c}=inputs[k];
    if(c.type==='check')el.checked=!!P[k];else el.value=String(P[k]);
    if(row._num)row._num.value=fmt(P[k]);
    if(c.sec==='layout')row.hidden=!uses.includes(k);}
  inputs.bgAngle.row.hidden=P.bgMode!=='linear';inputs.bg2.row.hidden=P.bgMode==='solid';inputs.patternOp.row.hidden=P.pattern==='none';
  inputs.borderColor.row.hidden=inputs.borderA.row.hidden=!(P.border>0);
  document.querySelectorAll('.tpl').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.k===P.template)));
  document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.k===P.style)));
  $('#tplName').textContent=TEMPLATES[P.template].name;$('#tplDesc').textContent=TEMPLATES[P.template].desc;
  updateMeta();
}
function set(k,v){P[k]=v;if(['bgMode','pattern','border'].includes(k))syncInputs();if(['style','bg1','bg2','bgMode','radius','frame','frameColor','border','shadow','ratio'].includes(k))dirtyThumbs=true;updateMeta();save();}
function save(){try{localStorage.setItem(STORE,JSON.stringify(P));}catch(_){}}
function commit(){const s=JSON.stringify(P);if(s===committed)return;undoStack.push(committed);if(undoStack.length>100)undoStack.shift();redoStack=[];committed=s;updateHistory();}
function updateHistory(){$('#undo').disabled=!undoStack.length;$('#redo').disabled=!redoStack.length;}
function restoreState(s){P=sanitize(JSON.parse(s));committed=s;syncInputs();save();dirtyThumbs=true;updateHistory();}
$('#undo').onclick=()=>{if(!undoStack.length)return;redoStack.push(committed);restoreState(undoStack.pop());};
$('#redo').onclick=()=>{if(!redoStack.length)return;undoStack.push(committed);restoreState(redoStack.pop());};

/* templates + styles */
const tplGrid=$('#templateGrid'),thumbCanvases={};
for(const [k,t] of Object.entries(TEMPLATES)){
  const b=document.createElement('button');b.type='button';b.className='tpl';b.dataset.k=k;b.title=t.desc;
  const cv=document.createElement('canvas');cv.width=208;cv.height=130;thumbCanvases[k]=cv;
  const s=document.createElement('span');s.textContent=t.name;b.append(cv,s);
  b.onclick=()=>{P={...P,...TEMPLATES[k].defaults,template:k};time=0;syncInputs();save();commit();};
  tplGrid.append(b);
}
for(const [k,s] of Object.entries(STYLES)){
  const b=document.createElement('button');b.type='button';b.className='chip';b.dataset.k=k;
  const i=document.createElement('i');i.style.background=`linear-gradient(135deg,${s.sw[0]},${s.sw[1]})`;b.append(i,document.createTextNode(s.name));
  b.onclick=()=>{P={...P,...s.v,style:k};syncInputs();save();commit();dirtyThumbs=true;};
  $('#styleChips').append(b);
}

/* thumbnails: small second renderer, re-rendered when media or look changes */
let thumbR=null,thumbTimer=0;
function renderThumbs(){
  if(!R)return;
  try{if(!thumbR)thumbR=new Renderer(document.createElement('canvas'));}catch(_){return;}
  for(const [k,t] of Object.entries(TEMPLATES)){
    const p={...P,...t.defaults,template:k,title:'',subtitle:'',grain:0};
    thumbR.render(p,loopLength(p,sources.length)*.3,416,260,sources,{noText:true});
    const g=thumbCanvases[k].getContext('2d');g.drawImage(thumbR.canvas,0,0,208,130);
  }
  dirtyThumbs=false;
}

/* ---------------- media ---------------- */
const mediaList=$('#mediaList');
function renderMediaList(){
  mediaList.replaceChildren();
  sources.forEach((s,i)=>{
    const row=document.createElement('div');row.className='media';
    const th=s.kind==='video'?document.createElement('canvas'):document.createElement('img');
    if(s.kind==='video'){th.width=80;th.height=56;try{th.getContext('2d').drawImage(s.el,0,0,80,56);}catch(_){}}
    else if(s.thumb instanceof HTMLCanvasElement){th.src=s.thumb.toDataURL('image/jpeg',.6);}else th.src=s.url;
    th.alt='';
    const nm=document.createElement('div');nm.className='nm';nm.textContent=s.name;const meta=document.createElement('small');meta.textContent=(s.kind==='video'?'VIDEO · ':'IMAGE · ')+s.aspect.toFixed(2);nm.append(meta);
    const ops=document.createElement('div');ops.className='ops';
    const mk=(txt,label,fn,dis)=>{const b=document.createElement('button');b.type='button';b.textContent=txt;b.setAttribute('aria-label',label);b.title=label;b.disabled=!!dis;b.onclick=fn;ops.append(b);};
    mk('↑','前へ',()=>{[sources[i-1],sources[i]]=[sources[i],sources[i-1]];afterMedia();},i===0);
    mk('↓','後へ',()=>{[sources[i+1],sources[i]]=[sources[i],sources[i+1]];afterMedia();},i===sources.length-1);
    mk('✕','削除',()=>{const [r]=sources.splice(i,1);if(r.url)URL.revokeObjectURL(r.url);if(!sources.length)sources=makeSamples();afterMedia();});
    row.append(th,nm,ops);mediaList.append(row);
  });
  const own=sources.some(s=>!s.sample);
  $('#mediaCount').textContent=sources.length+' 点';

function previewDims(){

/* Render one output frame (optionally motion-blurred) and return a canvas holding it. */

}
function makeMp4(samples,desc,w,h,fps){

const tick=()=>new Promise(r=>setTimeout(r,0));
async function exportVideo(){

  const {W,H}=outDims(),fps=P.fps,L=loopLength(P,sources.length),frames=Math.round(L*fps)*P.loops;
  const wasPlaying=playing;setPlaying(false);
  openProgress(`${W}×${H} · ${fps}fps · ${(frames/fps).toFixed(1)}秒`);
  let ER=null;
  try{
    const ec=document.createElement('canvas');ER=new Renderer(ec);
    const acc=document.createElement('canvas');acc.width=W;acc.height=H;
    const cfg=await pickMp4Config(W,H,fps);
    if(cfg){
      const samples=[];let desc=null,err=null;
      const encoder=new VideoEncoder({output:(chunk,meta)=>{if(!desc&&meta&&meta.decoderConfig&&meta.decoderConfig.description)desc=new Uint8Array(meta.decoderConfig.description);const b=new Uint8Array(chunk.byteLength);chunk.copyTo(b);samples.push({data:b,key:chunk.type==='key',ts:chunk.timestamp});},error:e=>{err=e;}});
      encoder.configure(cfg);
      for(let f=0;f<frames;f++){
        if(cancelled||err)break;
        const t=f/fps;await seekVideos(t);
        const src=exportFrame(ER,acc,t,W,H,fps,(f%97)*1.37);
        const vf=new VideoFrame(src,{timestamp:Math.round(f*1e6/fps),duration:Math.round(1e6/fps)});
        encoder.encode(vf,{keyFrame:f%(fps*2)===0});vf.close();
        while(encoder.encodeQueueSize>6)await new Promise(r=>setTimeout(r,4));
        if(f%3===0){$('#exportProg').value=f/frames;$('#exportMsg').textContent=`${f+1} / ${frames} フレーム · ${W}×${H}`;await tick();}
      }
      if(!cancelled&&!err){await encoder.flush();}
      try{encoder.close();}catch(_){}
      if(err)throw err;
      if(cancelled){toast('書き出しを中止しました');return;}
      if(!desc||!samples.length)throw Error('エンコード結果が空でした');
      await saveFile(makeMp4(samples,desc,W,H,fps),baseName()+'.mp4');
    }else{
      /* fallback: real-time MediaRecorder (WebM) */

      if(!mime)throw Error('このブラウザでは動画を書き出せません（Chrome / Edge / Safari 最新版を使ってください）');
      const out=P.mblur>1?acc:ec;ER.render(P,0,W,H,sources);
      const stream=out.captureStream(0),track=stream.getVideoTracks()[0],chunks=[];
      const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:Math.min(40e6,W*H*fps*.12)});
      rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
      const stopped=new Promise(r=>rec.onstop=r);rec.start();
      const t0=performance.now();
      for(let f=0;f<frames;f++){
        if(cancelled)break;const t=f/fps;await seekVideos(t);exportFrame(ER,acc,t,W,H,fps,(f%97)*1.37);track.requestFrame&&track.requestFrame();
        const wait=t0+(f+1)*1000/fps-performance.now();await new Promise(r=>setTimeout(r,Math.max(0,wait)));
        $('#exportProg').value=f/frames;$('#exportMsg').textContent=`${f+1} / ${frames} フレーム（リアルタイム録画）`;
      }

      const blob=new Blob(chunks,{type:mime.split(';')[0]});if(!blob.size)throw Error('録画データが空でした');

    }

  }catch(e){console.error(e);status('書き出しに失敗しました: '+(e.message||e));toast('書き出しに失敗しました');}
  finally{if(ER)ER.dispose();closeProgress();setPlaying(wasPlaying);}
}

/* PNG sequence in an uncompressed ZIP */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

    {id:'png',label:'PNG · 今のフレーム',button:'#exPng',handoff:true,note:'プレビューの再生位置を、書き出しサイズで1枚保存します。'},
    {id:'png-sequence',label:'PNG連番 · ZIP',button:'#exSeq',handoff:true,note:'1ループ分をPNG連番で保存します（最大1800枚）。'}
  ],fields:{
    size:(f,ui)=>[ui.field('比率',inputs.aspect.el),ui.field('画質',inputs.quality.el),ui.readout('サイズ',()=>{const d=outDims();return d.W+' × '+d.H+' px';})],
    alpha:(f,ui)=>ui.readout('透過','非対応','背景を含めて書き出します。'),
    fps:(f,ui)=>f.id==='png'?ui.readout('FPS','不要','静止画にはフレームレートを使いません。'):ui.field('FPS',inputs.fps.el),
    extra:(f,ui)=>f.id==='png'?[ui.field('モーションブラー',inputs.mblur.el)]:[f.id==='mp4'?ui.field('ループ回数',inputs.loops.el):null,ui.field('モーションブラー',inputs.mblur.el,'書き出し時だけ、シャッター180°相当のブラーをかけます。'),ui.readout('長さ',lenText)].filter(Boolean)
  },status:['#status']});
});

/* boot */
syncInputs();renderMediaList();updateHistory();
if(R)requestAnimationFrame(frame);
window.MLShowcaseReel={get state(){return P;},set:(k,v)=>{P[k]=v;syncInputs();},sources:()=>sources,loopLength:()=>loopLength(P,sources.length),setTime:t=>{time=t;},pause:()=>setPlaying(false)};
</script>
</body>
