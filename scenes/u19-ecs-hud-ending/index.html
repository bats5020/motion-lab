<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const vp = $('#vp'), stage = $('#stage');

  /* ---------- fit 1920×1080 stage into the viewport ---------- */
  function fit() {
    const s = Math.min(vp.clientWidth / 1920, vp.clientHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  fit();
  addEventListener('resize', fit);

  /* ---------- background iframe: hide its own play button ---------- */
  const thermal = $('#thermal');
  const TH0 = 3.6766, TH_LOOP = 8; // Thermal Flow export: start phase / loop length (s)
  const tf = () => { try { return thermal.contentWindow.thermalFlow || null; } catch (e) { return null; } };
  const thermalCanvas = () => { try { return thermal.contentDocument.getElementById('artwork'); } catch (e) { return null; } };
  thermal.addEventListener('load', () => {
    try {
      const d = thermal.contentDocument;
      const st = d.createElement('style');
      st.textContent = '#play,#status{display:none!important}';
      d.head.appendChild(st);
    } catch (e) {}
  });

  /* ---------- open-state geometry (Figma HUD_last_01 / 02) ---------- */
  // rows: top 488 → 19, bottom 569 → 1037 ; window 80,80 1760×920 r20 closes onto y=540
  const DY_TOP = -469, DY_BOT = 468;
  const win = $('#win'), seam = $('#seam'), flashEl = $('#flash');
  const TOP = ['#tc', '#n20', '#n26', '#scale', '#dot', '#ana', '#cTL', '#cTR'].map($);
  const BOT = ['#sys', '#xy', '#g14', '#u19', '#logo', '#ecs', '#g15', '#cta', '#cBL', '#cBR'].map($);
  const pL = $('#pL'), pR = $('#pR');
  const SC = { p: 1 };
  function applyP() {
    const p = SC.p;
    gsap.set(TOP, { y: DY_TOP * p });
    gsap.set(BOT, { y: DY_BOT * p });
    gsap.set(pR, { y: 1 * p });
    const ins = Math.min(459.5, 460 * (1 - p));
    win.style.clipPath = `inset(${ins}px 0px ${ins}px 0px round 20px)`;
  }

  if (!window.gsap) { SC.p = 1; return; }

  /* ---------- text decoder (same as the opening) ---------- */
  const UP = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', DG = '0123456789', SYM = '/\\<>_-=+#', KN = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン';
  const rnd = (c) => {
    if (/[0-9]/.test(c)) return DG[(Math.random() * 10) | 0];
    if (/[A-Z]/.test(c)) return Math.random() < 0.22 ? SYM[(Math.random() * SYM.length) | 0] : UP[(Math.random() * 26) | 0];
    if (/[゠-ヿ一-鿿]/.test(c)) return KN[(Math.random() * KN.length) | 0];
    return c;
  };
  class Txt {
    constructor(el) { this.el = el; this.str = el.textContent; this.f = [...this.str]; this.spans = null; this.k = 0; }
    build() {
      this.el.textContent = '';
      this.spans = this.f.map((c) => { const s = document.createElement('span'); s.textContent = c; this.el.appendChild(s); return s; });
    }
    plain() { this.el.textContent = this.str; this.spans = null; }
    render(p, mode = 'type', tail = 3) {
      if (p >= 1) { if (this.spans) this.plain(); return; }
      if (!this.spans) this.build();
      const n = this.f.length, flip = (this.k++ % 2) === 0;
      const head = mode === 'type' ? p * (n + tail) : p * n;
      this.spans.forEach((s, i) => {
        const c = this.f[i];
        if (mode === 'type') {
          if (i < head - tail) { s.textContent = c; s.style.visibility = 'visible'; }
          else if (i < head) { if (flip || s.style.visibility !== 'visible') s.textContent = rnd(c); s.style.visibility = 'visible'; }
          else s.style.visibility = 'hidden';
        } else {
          s.style.visibility = 'visible';
          if (i < head) s.textContent = c; else if (flip) s.textContent = rnd(c);
        }
      });
    }
  }
  const T = {};
  ['tc', 'sys', 'xy', 'n20', 'n26', 'u19', 'ecs', 'ana', 'ctaTxt', 'jp'].forEach((id) => (T[id] = new Txt(document.getElementById(id))));

  /* ---------- elements ---------- */
  const cTL = $('#cTL'), cTR = $('#cTR'), cBL = $('#cBL'), cBR = $('#cBR');
  const ticks = [...document.querySelectorAll('#scale .tick')];
  const chev = $('#chev'), dot = $('#dot'), emblem = $('#logo'), cta = $('#cta');
  const g14 = $('#g14'), g15 = $('#g15');
  const slashPaths = [...g14.querySelectorAll('path'), ...[...g15.querySelectorAll('path')].reverse()];
  const lens = slashPaths.map((p) => p.getTotalLength());
  const tickCx = (p) => { const b = p.getBBox(); return b.x + b.width / 2; };
  const ticksOut = ticks.slice().sort((a, b) => Math.abs(tickCx(a) - 87) - Math.abs(tickCx(b) - 87));
  const sidesD = [$('#sLd'), $('#sRd')], sidesU = [$('#sLu'), $('#sRu')];
  const pathsByY = (el, desc) => [...el.querySelectorAll('path')].sort((a, b) => (a.getBBox().y - b.getBBox().y) * (desc ? -1 : 1));

  // collapsed geometry = the opening's START (both clusters on the screen centre)
  const START = {
    pL: { x: 921.5, y: -0.5, rotation: 45, scale: 1.8 },
    pR: { x: -921.5, y: 0.5, rotation: 45, scale: 1.8 },
    cTL: { x: 908, y: 19 }, cBL: { x: 908, y: -20 },
    cTR: { x: -908.5, y: 19 }, cBR: { x: -908.5, y: -20 },
  };

  // HUD_last_01 copy
  const reg1 = $('#reg1'), reg2 = $('#reg2'), dateEl = $('#date'), timeEl = $('#time'), jp = $('#jp');
  // HUD_last_02 logo
  const lgStT = $('#lgStT'), lgStB = $('#lgStB'), lgU = $('#lgU'), lg1 = $('#lg1'), lg9 = $('#lg9');
  const lgEs = $('#lgEs'), lgCh = $('#lgCh'), lgChL = $('#lgChL'), lgChR = $('#lgChR'), lgBanner = $('#lgBanner'), lgGlobe = $('#lgGlobe');
  const barsT = [...lgStT.querySelectorAll('path')], barsB = [...lgStB.querySelectorAll('path')];
  const lgWrap = $('#lgWrap');
  const LOGO = [lgStT, lgStB, lgU, lg1, lg9, lgEs, lgCh, lgChL, lgChR];
  const COPY = [reg1, reg2, dateEl, timeEl];

  let tl = null, tcTimer = null;

  /* ---------- helpers ---------- */
  function textTween(t, at, dur, mode = 'type', out = false) {
    const o = { p: out ? 1 : 0 };
    tl.to(o, {
      p: out ? 0 : 1, duration: dur, ease: 'none',
      onStart: () => t.render(out ? 0.999 : 0, mode),
      onUpdate: () => t.render(o.p, mode),
    }, at);
  }
  function flicker(target, at, seq = [1, 0, 1, 0.3, 0, 1], step = 0.04) {
    seq.forEach((v, i) => tl.set(target, { opacity: v }, at + i * step));
  }
  function glitchIn(el, at, frames = 6, amp = 10) {
    for (let i = 0; i < frames; i++) {
      const a = Math.random() * 70, b = Math.random() * (90 - a);
      tl.set(el, { x: (Math.random() * 2 - 1) * amp, opacity: Math.random() < 0.3 ? 0.25 : 1, clipPath: `inset(${a}% 0% ${b}% 0%)` }, at + i * 0.035);
    }
    tl.set(el, { x: 0, opacity: 1, clearProps: 'clipPath' }, at + frames * 0.035);
  }
  function glitchOut(el, at, frames = 6, amp = 14) {
    for (let i = 0; i < frames; i++) {
      const a = Math.random() * 70, b = Math.random() * (90 - a);
      tl.set(el, { x: (Math.random() * 2 - 1) * amp * (i / frames + 0.3), opacity: Math.random() < 0.35 ? 0.2 : 1, clipPath: `inset(${a}% 0% ${b}% 0%)` }, at + i * 0.035);
    }
    tl.set(el, { opacity: 0, x: 0, clearProps: 'clipPath' }, at + frames * 0.035);
  }

  const EX = { on: false, stop: false, t: 0, tcRun: false, tc0: 0, g0: null };

  /* ---------- timecode ---------- */
  const pad = (n) => String(n).padStart(2, '0');
  const TC0 = ((0 * 60 + 4) * 60 + 12) * 30 + 8; // 00:04:12:08 @30fps
  function setTC(f) {
    const ff = f % 30, s = Math.floor(f / 30) % 60, m = Math.floor(f / 1800) % 60, h = Math.floor(f / 108000);
    T.tc.str = `TC ${pad(h)}:${pad(m)}:${pad(s)}:${pad(ff)}`; T.tc.f = [...T.tc.str];
    if (!T.tc.spans) T.tc.el.textContent = T.tc.str;
  }
  function startTC() {
    clearInterval(tcTimer);
    if (EX.on) { EX.tcRun = true; EX.tc0 = EX.t; return; } // export: timecode follows the frame count
    let f = TC0;
    tcTimer = setInterval(() => setTC(++f), 1000 / 30);
  }
  function stopTC() { clearInterval(tcTimer); EX.tcRun = false; }

  /* ---------- ambient: side arrows pulse toward the centre cross ---------- */
  const arrows = [pathsByY($('#sLd')), pathsByY($('#sRd')), pathsByY($('#sLu'), true), pathsByY($('#sRu'), true)];
  let ambT0 = 0, ambOn = false;
  const ambNow = () => (EX.on ? EX.t * 1000 : performance.now());
  gsap.ticker.add(ambUpdate);
  function ambUpdate() {
    if (!ambOn) return;
    const local = ((ambNow() - ambT0) / 1000) % 3.2;
    arrows.forEach((list) => list.forEach((p, k) => {
      const l = local - 0.4 - k * 0.11;
      const b = l > 0 && l < 0.45 ? Math.sin((Math.PI * l) / 0.45) : 0;
      p.style.opacity = (1 - 0.7 * b).toFixed(3);
    }));
  }
  function startAmbient() { ambT0 = ambNow(); ambOn = true; }
  function stopAmbient() { ambOn = false; arrows.flat().forEach((p) => (p.style.opacity = 1)); }

  /* ---------- reset to HUD_last_01 (open HUD, copy hidden until it types in) ---------- */
  function reset() {
    if (tl) tl.kill();
    stopTC(); stopAmbient();
    gsap.killTweensOf([stage, lgWrap, jp, ...LOGO, ...COPY]);
    Object.values(T).forEach((t) => { t.str = t.el.dataset.s || t.str; t.el.dataset.s = t.str; t.f = [...t.str]; t.plain(); t.k = 0; });
    T.tc.str = 'TC 00:04:12:08'; T.tc.f = [...T.tc.str]; T.tc.plain();

    gsap.set(stage, { opacity: 1 });
    SC.p = 1; applyP();
    gsap.set(win, { visibility: 'visible', opacity: 1 });
    gsap.set(seam, { opacity: 0, scaleX: 1 });
    gsap.set(flashEl, { opacity: 0 });

    // HUD frame: fully built
    gsap.set([pL, cTL, cBL, cTR, cBR], { x: 0, rotation: 0, scale: 1, opacity: 1, transformOrigin: '50% 50%', clearProps: 'clipPath' });
    gsap.set(pL, { y: 0 }); gsap.set(pR, { x: 0, rotation: 0, scale: 1, opacity: 1, transformOrigin: '50% 50%' });
    gsap.set([...sidesD, ...sidesU], { opacity: 1, y: 0 });
    gsap.set(ticks, { scaleY: 1, opacity: 1, transformOrigin: '50% 50%' });
    gsap.set(chev, { opacity: 1, x: 0 });
    gsap.set(slashPaths, { opacity: 1, strokeDasharray: (i) => lens[i], strokeDashoffset: 0 });
    gsap.set([g14, g15], { opacity: 1, x: 0 });
    gsap.set([emblem, dot], { opacity: 1, x: 0, scale: 1, transformOrigin: '50% 50%', clearProps: 'clipPath' });
    gsap.set(cta, { opacity: 1, x: 0, clearProps: 'clipPath,backgroundColor,color' });
    gsap.set(['#tc', '#sys', '#xy', '#n20', '#n26', '#ana', '#u19', '#ecs', '#scale'], { x: 0, opacity: 1, clearProps: 'clipPath' });

    // HUD_last_01 copy hidden (dollies in)
    T.jp.plain();
    gsap.set([...COPY, jp], { opacity: 0, x: 0, y: 0, scale: 1, scaleX: 1, scaleY: 1, transformOrigin: '50% 50%', clearProps: 'clipPath,filter' });

    // HUD_last_02 logo hidden
    gsap.set(LOGO, { opacity: 0, x: 0, y: 0, scale: 1, scaleX: 1, scaleY: 1, transformOrigin: '50% 50%', clearProps: 'clipPath' });
    gsap.set([...barsT, ...barsB], { x: 0, opacity: 1 });
    gsap.set(lgBanner, { scaleX: 1, transformOrigin: '50% 50%' });
    gsap.set(lgGlobe, { opacity: 1 });
    gsap.set(lgWrap, { opacity: 1, scale: 1, transformOrigin: '960px 540px' });
  }

  /* ================================================================
     ENDING
     A  HUD_last_01 : copy builds from a line (the HUD's own grammar)
     B  copy collapses into one horizontal line → the line splits into
        the logo stripes → U19 / esports / CHAMPIONSHIP lock on (HUD_last_02)
     C  close: the opening, reversed — window shuts onto y=540, rows ride
        back to the centre, readouts un-type, brackets fold onto the crosses
     ================================================================ */
  function boot() {
    reset();
    const bg = tf();
    if (bg) { try { bg.seek(TH0); if (!EX.on) bg.play(); } catch (e) {} }
    tl = gsap.timeline();
    tl.call(startTC, null, 0).call(startAmbient, null, 0);

    /* ---------------- A — HUD_last_01 ---------------- */
    // Dolly (Text Switch 案E): the camera pushes forward — copy arrives from deep in the frame.
    // Every unit scales about the frame centre (960,540) with a depth lag: label/headline lead, date follows.
    const A = 0.2;
    const pivot = (el) => { const cs = getComputedStyle(el); return `${960 - parseFloat(cs.left)}px ${540 - parseFloat(cs.top)}px`; };
    [[jp, 0, 8], [reg1, 0, 16], [reg2, 0.03, 16], [dateEl, 0.1, 16], [timeEl, 0.1, 16]].forEach(([el, lag, blur]) => {
      const at = A + lag;
      tl.set(el, { transformOrigin: pivot(el) }, at);
      tl.fromTo(el, { scale: 0.62, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.0, ease: 'expo.out', immediateRender: false }, at);
      tl.fromTo(el, { filter: `blur(${blur}px)` }, { filter: 'blur(0px)', duration: 0.7, ease: 'expo.out', immediateRender: false }, at);
      tl.set(el, { clearProps: 'filter', transformOrigin: '50% 50%' }, at + 1.02);
    });

    /* ---------------- B — copy out, logo in ---------------- */
    const B = 2.5;
    textTween(T.jp, B, 0.28, 'type', true);
    glitchOut(timeEl, B + 0.02, 5, 18);
    glitchOut(dateEl, B + 0.08, 6, 22);
    // both headline lines crush flat and slide onto the centre line y=540
    const toMid = (el) => 540 - (parseFloat(el.style.top) + parseFloat(el.getAttribute('height')) / 2);
    [reg1, reg2].forEach((el, i) => {
      const at = B + 0.12 + i * 0.05;
      tl.set(el, { x: 6 }, at).set(el, { x: -4 }, at + 0.035).set(el, { x: 0 }, at + 0.07);
      tl.to(el, { scaleY: 0.02, y: toMid(el), duration: 0.42, ease: 'expo.in' }, at + 0.04);
    });
    // the merged line pinches in to the logo's width, then hands over to the stripes
    tl.to([reg1, reg2], { scaleX: 214 / 1347, duration: 0.36, ease: 'expo.inOut' }, B + 0.55);
    flicker([reg1, reg2], B + 0.86, [1, 0.2, 1, 0], 0.035);

    const L = B + 0.92;
    // stripes split away from the line, top up / bottom down
    tl.set([lgStT, lgStB], { opacity: 1 }, L);
    tl.fromTo(lgStT, { y: 540 - 381.5, scaleY: 0 }, { y: 0, scaleY: 1, duration: 0.7, ease: 'expo.out', immediateRender: false }, L);
    tl.fromTo(lgStB, { y: 540 - 711, scaleY: 0 }, { y: 0, scaleY: 1, duration: 0.7, ease: 'expo.out', immediateRender: false }, L);
    tl.fromTo(barsT, { x: -46 }, { x: 0, duration: 0.6, ease: 'expo.out', stagger: 0.03, immediateRender: false }, L);
    tl.fromTo(barsB, { x: 46 }, { x: 0, duration: 0.6, ease: 'expo.out', stagger: { each: 0.03, from: 'end' }, immediateRender: false }, L);
    // U · 1 · 9 glitch on
    [lgU, lg1, lg9].forEach((el, i) => {
      glitchIn(el, L + 0.14 + i * 0.06, 7, 14);
      tl.fromTo(el, { scale: 1.22 }, { scale: 1, duration: 0.4, ease: 'expo.out', immediateRender: false }, L + 0.14 + i * 0.06);
    });
    // esports wipes in
    tl.set(lgEs, { opacity: 1, clipPath: 'inset(0% 100% 0% 0%)' }, L + 0.36);
    tl.to(lgEs, { clipPath: 'inset(0% 0% 0% 0%)', duration: 0.3, ease: 'steps(9)' }, L + 0.36);
    // CHAMPIONSHIP banner stretches out from the centre, globe flickers on
    tl.set(lgCh, { opacity: 1 }, L + 0.42);
    tl.set(lgGlobe, { opacity: 0 }, L + 0.42);
    tl.fromTo(lgBanner, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: 'expo.out', immediateRender: false }, L + 0.42);
    flicker(lgGlobe, L + 0.6, [1, 0, 0.6, 0, 1], 0.04);
    tl.set([lgChL, lgChR], { opacity: 1 }, L + 0.48);
    tl.fromTo(lgChL, { x: 104 }, { x: 0, duration: 0.55, ease: 'expo.out', immediateRender: false }, L + 0.48);
    tl.fromTo(lgChR, { x: -104 }, { x: 0, duration: 0.55, ease: 'expo.out', immediateRender: false }, L + 0.48);
    // lock-on: logo + the small HUD emblem confirm together
    const K = L + 1.08;
    tl.set(flashEl, { opacity: 0.16 }, K).to(flashEl, { opacity: 0, duration: 0.35, ease: 'power2.out' }, K + 0.04);
    flicker(lgWrap, K, [0.55, 1, 0.8, 1], 0.04);

      rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 24e6 });
      rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      stopped = new Promise((r) => (rec.onstop = r)); rec.start(200);
    }
    const tStart = performance.now();
    let ok = true;
    try {
      for (let i = 0; i < N; i++) {
        if (EX.stop) { ok = false; break; }
        stepTo(i / FPS);
        if (encoder) {
          if (encErr) throw encErr;
          const frame = new VideoFrame(cv, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
          encoder.encode(frame, { keyFrame: i % (FPS * 2) === 0 }); frame.close();
          while (encoder.encodeQueueSize > 6) await new Promise((r) => setTimeout(r, 2));
        } else {
          while (performance.now() < tStart + i * 1000 / FPS) await new Promise((r) => requestAnimationFrame(r));
          track.requestFrame && track.requestFrame();
        }
        exBtn.textContent = `■ 中止 ${i + 1}/${N}`;
        if (i % 2 === 0) await new Promise((r) => setTimeout(r, 0));
      }
    } catch (err) { ok = false; toast('書き出しに失敗しました：' + ((err && err.message) || err)); }
    try {
      if (encoder) { await encoder.flush(); encoder.close(); }
      else { if (rec.state !== 'inactive') rec.stop(); await stopped; track.stop(); }
    } catch (e) { encErr = encErr || e; }
    Object.assign(EX, { on: false, tcRun: false, g0: null });
    exBtn.classList.remove('rec'); exBtn.textContent = '● MP4を書き出す';
    g.resume(); play();
    if (EX.stop) { EX.stop = false; toast('書き出しを中止しました'); return; }
    if (!ok) return;
    const name = `u19-ecs-hud-ending-${stamp()}_${FPS}fps`;
    if (encoder) {
      if (encErr || !desc || !samples.length) { toast('MP4の書き出しに失敗しました' + (encErr ? '：' + encErr.message : '')); return; }
      await saveFile(makeMp4(samples, desc, W, H, FPS), name + '.mp4');
    } else {
      const blob = new Blob(chunks, { type: mime.split(';')[0] });
      if (!blob.size) { toast('録画データが空でした'); return; }
      await saveFile(blob, name + (mime.startsWith('video/mp4') ? '.mp4' : '.webm'));
    }
  }
  exBtn.addEventListener('click', (e) => { e.stopPropagation(); exportMp4(); });

  window.__ending = { get tl() { return tl; }, EX, drawAt(t) { if (!tl) return null; tl.pause(); EX.on = true; stepTo(t); EX.on = false; return cv.toDataURL('image/png'); } }; // debug / test hook

  /* ---------- start / replay ---------- */
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function showStatic() {
    reset();
    gsap.set([...COPY, jp], { opacity: 1 });
  }
  function play() { if (reduce) showStatic(); else boot(); }
  const fontsReady = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]) : Promise.resolve();
  const bgReady = new Promise((r) => { thermal.addEventListener('load', () => setTimeout(r, 250), { once: true }); setTimeout(r, 3000); });
  Promise.all([fontsReady, bgReady]).then(play);
  vp.addEventListener('click', () => { if (!EX.on) play(); });
  addEventListener('keydown', (e) => { if (!EX.on && (e.key === 'r' || e.key === 'R')) play(); });
})();
</script>
</body>
</html>
