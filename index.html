<script>
/* ------------------------------------------------------------------
   ツール定義 — 追加時は TOOLS と TOOL_META の両方を更新。thumb はカード内サムネSVG。
------------------------------------------------------------------ */
const CATEGORIES = [
  {key:"image", name:"画像加工", english:"IMAGE PROCESSING", icon:"◩", desc:"画像・動画に質感やエフェクトを加える"},
  {key:"texture", name:"背景・テクスチャ", english:"BACKGROUNDS & TEXTURES", icon:"▧", desc:"色・粒子・パターンから、動く背景をつくる"},
  {key:"type", name:"タイプ・ロゴ", english:"TYPE & LOGO", icon:"T", desc:"文字やロゴを、印象的なグラフィックに"},
  {key:"motion", name:"モーション・合成", english:"MOTION & COMPOSITING", icon:"▷", desc:"素材を組み合わせ、リズムと切り替わりをつくる"},
  {key:"3d", name:"3D・シェイプ", english:"3D & SHAPES", icon:"◇", desc:"立体の形・質感・動きを編集する"},
];

const TOOLS = [
  {
    cat:"motion", name:"Egg Glass",
    desc:"卵形3Dの柄・ロゴ・光沢を編集。スクロールキーフレームと画像・動画・単体HTMLの書き出し。",
    href:"tools/egg-glass/",
    thumb:`<svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="egg-glass-fill" x1="0" y1="1" x2=".8" y2="0"><stop stop-color="#1e9bd8"/><stop offset=".36" stop-color="#fbf7df"/><stop offset=".65" stop-color="#e88e4a"/><stop offset="1" stop-color="#f43d05"/></linearGradient>
        <radialGradient id="egg-glass-shine" cx=".29" cy=".22" r=".8"><stop stop-color="#fff" stop-opacity=".8"/><stop offset=".32" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#071e39" stop-opacity=".42"/></radialGradient>
      </defs>
      <rect width="400" height="240" fill="#141417"/>
      <path d="M18 28V18h28M354 18h28v10M18 212v10h28M354 222h28v-10" fill="none" stroke="#3d3d46"/>
      <path d="M200 25C165 25 138 83 138 132C138 184 164 211 200 211C236 211 262 184 262 132C262 83 235 25 200 25Z" fill="url(#egg-glass-fill)"/>
      <path d="M200 25C165 25 138 83 138 132C138 184 164 211 200 211C236 211 262 184 262 132C262 83 235 25 200 25Z" fill="url(#egg-glass-shine)"/>
      <path d="M182 49C167 65 156 93 154 115" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="4" stroke-linecap="round"/>
      <path d="M30 190h69m202 0h69" stroke="#3d3d46"/>
      <circle cx="58" cy="190" r="4" fill="#4f5cff"/><circle cx="343" cy="190" r="4" fill="#4f5cff"/>
    </svg>`
  },
  {
    cat:"raster", name:"Halftone Lab",
    desc:"画像・プロシージャルソースをハーフトーン／ディザ／ASCII化。アニメーション＋WebM録画・SVG／コード書き出し対応",
    href:"tools/halftone-lab.html",
    thumb:`<svg viewBox="0 0 120 66" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><g id="d"></g></svg>`,
    draw(svg){
      const g=svg.querySelector("#d");
      for(let y=4;y<66;y+=7)for(let x=4;x<120;x+=7){
        const dx=x-60, dy=y-33, dist=Math.hypot(dx,dy);
        const ink=(Math.sin(dist*0.24)+1)/2 * Math.max(0,1-dist/62);
        const r=3.3*0.7071*Math.sqrt(ink);
        if(r<0.25)continue;
        const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
        c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("r",r.toFixed(2));
        c.setAttribute("fill","#e8e8f0");g.appendChild(c);
      }
    }
  },
  {
    cat:"raster", name:"Dither → SVG",
    desc:"画像を網点・ディザ・ドット化してSVG／PNGで書き出す",
    href:"tools/dither-svg.html",
    thumb:`<svg viewBox="0 0 120 66" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><g id="d"></g></svg>`,
    draw(svg){
      const g=svg.querySelector("#d");
      for(let y=0;y<66;y+=8)for(let x=0;x<120;x+=8){
        const r=(x/120)*3.2; if(r<0.4)continue;
        const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
        c.setAttribute("cx",x+4);c.setAttribute("cy",y+4);
        c.setAttribute("r",Math.min(r,3.4).toFixed(2));
        c.setAttribute("fill","#5c68ff");c.setAttribute("opacity","0.9");g.appendChild(c);
      }
    }
  },
  {
    cat:"raster", name:"Pixel Gradient",
    desc:"メッシュグラデを土台にピクセル化・ポスタライズ・グレインで生成",
    href:"tools/pixel-gradient.html",
    thumb:`<svg viewBox="0 0 120 66" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><g id="d"></g></svg>`,
    draw(svg){
      const g=svg.querySelector("#d"),cols=15,rows=8,cw=120/cols,ch=66/rows;
      const A=[79,92,255],B=[255,90,140];
      for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
        const t=(i/cols+j/rows)/2, r=Math.round(A[0]+(B[0]-A[0])*t),
          gg=Math.round(A[1]+(B[1]-A[1])*t), b=Math.round(A[2]+(B[2]-A[2])*t);
        const rc=document.createElementNS("http://www.w3.org/2000/svg","rect");
        rc.setAttribute("x",i*cw);rc.setAttribute("y",j*ch);
        rc.setAttribute("width",cw+0.5);rc.setAttribute("height",ch+0.5);
        rc.setAttribute("fill",`rgb(${r},${gg},${b})`);g.appendChild(rc);
      }
    }
  },
  {
    cat:"raster", name:"Thermal Flow",
    desc:"円形・四角形の炎と流体グラデを編集。透過PNG、配色・形状・キーフレーム、連番ZIP／MOV保存。",
    href:"tools/thermal-flow.html",
    thumb:`<svg viewBox="0 0 120 66" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><filter id="tf-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5.5"/></filter></defs><rect width="120" height="66" fill="#0c0302"/><g id="d" filter="url(#tf-blur)"></g></svg>`,
    draw(svg){
      const g=svg.querySelector("#d"),NS="http://www.w3.org/2000/svg";
      [["#3a0002",40],["#a01000",30],["#e84a00",21],["#ffb44e",13],["#fff3d0",6.5]].forEach(([col,r],i)=>{
        const cx=54-i*4, cy=42+i*2.5;
        const e=document.createElementNS(NS,"ellipse");
        e.setAttribute("cx",cx);e.setAttribute("cy",cy);
        e.setAttribute("rx",r*1.6);e.setAttribute("ry",r);
        e.setAttribute("transform",`rotate(${-22+i*7} ${cx} ${cy})`);
        e.setAttribute("fill",col);g.appendChild(e);
      });
    }
  },
  {
    cat:"raster", name:"Smearworks",
    desc:"白黒ポートレートに頬を中心とした放射ブラーと残像、顔の左側を残して周りに赤い色面。写真1枚からPNG書き出し。",
    href:"tools/smearworks.html",
    thumb:`<svg viewBox="0 0 120 66" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sw-split" x1="0" x2="1"><stop offset=".38" stop-color="#d9d9de"/><stop offset=".62" stop-color="#e5141d"/></linearGradient><filter id="sw-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6 .2"/></filter></defs><rect width="120" height="66" fill="#141417"/><rect x="34" y="4" width="52" height="58" fill="url(#sw-split)"/><g id="d" filter="url(#sw-blur)"></g></svg>`,
    draw(svg){
      const g=svg.querySelector("#d"),NS="http://www.w3.org/2000/svg";
      for(let i=0;i<9;i++){
        const y=12+i*5.4, len=10+((i*37)%17), r=document.createElementNS(NS,"rect");
        r.setAttribute("x",60-len);r.setAttribute("y",y);r.setAttribute("width",len);r.setAttribute("height",2.2);
        r.setAttribute("fill",i%3?"#1c1c21":"#6a6a74");r.setAttribute("opacity",".85");g.appendChild(r);
      }
    }
  },
  {
    cat:"raster", name:"Grid Stretch",
    desc:"画像をグリッド分割してピクセルストレッチ。注釈オーバーレイ付きのグリッチ表現",
    href:"tools/grid-stretch.html",
    thumb:`<svg viewBox="0 0 120 66" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><g id="d"></g></svg>`,
    draw(svg){
      const g=svg.querySelector("#d");
      const mk=(tag,at)=>{const e=document.createElementNS("http://www.w3.org/2000/svg",tag);for(const k in at)e.setAttribute(k,at[k]);g.appendChild(e);return e;};
      mk("rect",{x:34,y:10,width:52,height:30,rx:2,fill:"#3a5c46"});
      mk("rect",{x:44,y:14,width:32,height:20,rx:2,fill:"#5ea877"});
      for(const y of [42,47,52,57]){
        const w=y===47?96:(y===52?70:44), x=60-w/2;
        mk("rect",{x,y,width:w,height:3.4,fill:y===47?"#5ea877":"#3a5c46",opacity:0.95});
      }
      for(let x=12;x<=108;x+=16) mk("line",{x1:x,y1:6,x2:x,y2:60,stroke:"#3d3d46","stroke-width":0.5});
      mk("text",{x:14,y:14,fill:"#9a9aa6","font-size":5,"font-family":"monospace"}).textContent="R07 34%";
    }
  },
  {
    cat:"motion", name:"ASCII Wave",
    desc:"流体ノイズをASCII文字で描くアニメーション背景。カーソルで反発・引き寄せ・渦",
    href:"tools/ascii-wave.html",
    thumb:`<svg viewBox="0 0 120 66" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><g id="d" font-family="monospace" font-size="6"></g></svg>`,
    draw(svg){
      const g=svg.querySelector("#d"), chars=" .:-=+*#%@";
      for(let y=6;y<66;y+=6.5)for(let x=3;x<118;x+=6){
        const v=(Math.sin(x*0.09+y*0.13)+Math.sin(x*0.045-y*0.07)+2)/4;
        const ch=chars[Math.min(9,Math.floor(v*10))];
        if(ch===" ")continue;
        const t=document.createElementNS("http://www.w3.org/2000/svg","text");
        t.setAttribute("x",x);t.setAttribute("y",y);
        t.setAttribute("fill",v>0.72?"#5c68ff":"#c9c9d4");t.setAttribute("opacity",(0.35+v*0.65).toFixed(2));
        t.textContent=ch;g.appendChild(t);
      }
    }
  },
  {
    cat:"motion", name:"Warp Type",
    desc:"テキストをテクスチャ化しUVをパーリンノイズで揺らすスペースタイプ系ジェネレーター。プリセット・PNG／WebM書き出し",
    href:"tools/warp-type.html",
    thumb:`<svg viewBox="0 0 120 66" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><g id="d" font-family="Georgia,serif" font-size="15" font-weight="700"></g></svg>`,
    draw(svg){
      const g=svg.querySelector("#d"), word="WARP";
      for(let r=0;r<4;r++){
        for(let i=0;i<word.length;i++){
          const x=28+i*18, y=16+r*13;
          const dy=Math.sin(x*0.15+r*1.9)*3.2, sk=Math.sin(r*1.3+i)*9;
          const t=document.createElementNS("http://www.w3.org/2000/svg","text");
          t.setAttribute("x",x);t.setAttribute("y",y+dy);
          t.setAttribute("fill",r===1?"#5c68ff":"#e8e8f0");
          t.setAttribute("opacity",(0.45+0.55*Math.abs(Math.sin(r+i))).toFixed(2));
          t.setAttribute("transform",`skewX(${sk.toFixed(1)})`);
          t.setAttribute("text-anchor","middle");
          t.textContent=word[i];g.appendChild(t);
        }
      }
    }
  },
  {
    cat:"motion", name:"U19 Aberration",
    desc:"FENNEL U19 esports選手権専用。ロゴ／テキストの輪郭にサーモグローを纏わせるSDFアニメーション。KV画像背景合成・シームレスループWebM書き出し",
    href:"tools/u19-aberration.html",
    thumb:`<svg viewBox="0 0 120 66" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><filter id="u19-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4.5"/></filter></defs><rect width="120" height="66" fill="#050004"/><g id="d" filter="url(#u19-blur)"></g><g id="t"></g></svg>`,
    draw(svg){
      const g=svg.querySelector("#d"),t=svg.querySelector("#t"),NS="http://www.w3.org/2000/svg";
      [["#20000a",34],["#7a0410",26],["#e01414",18],["#ff4a1e",11],["#ffb37a",5.5]].forEach(([col,r],i)=>{
        const cx=58+Math.sin(i*2.1)*10, cy=34+Math.cos(i*1.7)*8;
        const e=document.createElementNS(NS,"ellipse");
        e.setAttribute("cx",cx);e.setAttribute("cy",cy);
        e.setAttribute("rx",r*1.7);e.setAttribute("ry",r);
        e.setAttribute("transform",`rotate(${-30+i*16} ${cx} ${cy})`);
        e.setAttribute("fill",col);g.appendChild(e);
      });
      const tx=document.createElementNS(NS,"text");
      tx.setAttribute("x",60);tx.setAttribute("y",42);
      tx.setAttribute("fill","#ffffff");tx.setAttribute("font-size","24");
      tx.setAttribute("font-weight","900");tx.setAttribute("font-family","Helvetica,Arial,sans-serif");
      tx.setAttribute("text-anchor","middle");tx.textContent="U19";t.appendChild(tx);
      const fr=document.createElementNS(NS,"rect");
      fr.setAttribute("x",6);fr.setAttribute("y",5);fr.setAttribute("width",108);fr.setAttribute("height",56);
      fr.setAttribute("fill","none");fr.setAttribute("stroke","#ffffff");fr.setAttribute("stroke-width","0.6");
      fr.setAttribute("opacity","0.5");t.appendChild(fr);
    }
  },
  {
    cat:"motion", name:"U19 Tile Scroll",
    desc:"U19ロゴタイルの帯が右下からシーンAを覆い、左上へ抜けながらBへつなぐトランジション。サーモ色の液体ワイプ（MSI 2024の入り方）／ブロック／列ごと／直線、巡航と急加速の緩急、色の反転、タイルだけの透過レイヤー、連番PNG（ZIP）／ロスレスMOV／MP4書き出し",
    href:"tools/u19-tile-scroll.html",
    thumb:`<svg viewBox="0 0 120 66" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="66" fill="#ff2b12"/><g id="d"></g></svg>`,
    draw(svg){
      const g=svg.querySelector("#d"),NS="http://www.w3.org/2000/svg";
      const grp=document.createElementNS(NS,"g");grp.setAttribute("transform","rotate(-15 60 33)");g.appendChild(grp);
      for(let r=-3;r<5;r++)for(let c=-2;c<5;c++){
        const t=document.createElementNS(NS,"text");
        t.setAttribute("x",c*34+(r%2?17:0)-10);t.setAttribute("y",r*13+8);
        t.setAttribute("fill","#000");t.setAttribute("font-size",(r+c)%2?"12":"7");t.setAttribute("font-weight","900");
        t.setAttribute("font-family","Helvetica,Arial,sans-serif");t.textContent=(r+c)%2?"U19":"ECS 2026";grp.appendChild(t);
      }
    }
  },
  {
    cat:"motion", name:"U19 HUD Sequence",
    desc:"U19 ECSのHUDが立ち上がり、中央の線から角丸の映像ウィンドウが開くオープニング。中の映像を差し替え（選択／ドロップ）、オープニングなしのHUDのみも選べる。1920×1080・30fpsのMP4をコマ送りで書き出し",
    href:"tools/u19-hud-sequence.html",
    thumb:`<svg viewBox="0 0 120 66" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="hud-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fd0ee"/><stop offset=".45" stop-color="#ff5a2a"/><stop offset="1" stop-color="#f2e3c0"/></linearGradient></defs><rect width="120" height="66" fill="#000"/><rect x="9" y="11" width="102" height="44" rx="2.4" fill="url(#hud-g)"/><g stroke="#fff" stroke-width=".6" fill="none"><path d="M5 3.5h-2.6v2.6M115 3.5h2.6v2.6M5 62.5h-2.6v-2.6M115 62.5h2.6v-2.6"/><path d="M3.8 33h2.4M5 31.8v2.4M113.8 33h2.4M115 31.8v2.4"/></g><g fill="#fff"><rect x="9" y="4.6" width="12" height="1.4"/><rect x="50" y="4.6" width="20" height="1.4" opacity=".8"/><rect x="99" y="4.6" width="12" height="1.4"/><rect x="9" y="60" width="10" height="1.4"/><rect x="56" y="59.4" width="8" height="2.4" opacity=".9"/><rect x="101" y="59.6" width="10" height="2.2" fill="none" stroke="#fff" stroke-width=".4"/></g></svg>`,
  },
  {
    cat:"motion", name:"Flame Transition",
    desc:"サーモカラーの炎が画面を覆った瞬間に次のシーンへ切り替わるトランジション。渦・一方向・両側から、映像同士／ロゴ出し、炎だけの透過レイヤー、ロスレスMOV・MP4書き出し",
    href:"tools/flame-transition.html",
    thumb:`<svg viewBox="0 0 120 66" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="ft-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9e6bff"/><stop offset=".3" stop-color="#c9f7b5"/><stop offset=".5" stop-color="#ffed4d"/><stop offset=".72" stop-color="#ff8c1a"/><stop offset="1" stop-color="#ff3312"/></linearGradient></defs><rect width="120" height="66" fill="#1a2430"/><g id="d"></g></svg>`,
    draw(svg){
      const g=svg.querySelector("#d"),NS="http://www.w3.org/2000/svg";
      const cx=60,cy=33,arm=(o,col,wid)=>{
        const out=[],inn=[];
        for(let r=7;r<=95;r+=2){const t=o+1.5*Math.log(r)-0.02*r,w=wid*(0.25+r/95);
          out.push([cx+r*Math.cos(t),cy+r*Math.sin(t)]);inn.push([cx+r*Math.cos(t+w),cy+r*Math.sin(t+w)]);}
        const pts=out.concat(inn.reverse()).map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ");
        const pl=document.createElementNS(NS,"polygon");pl.setAttribute("points",pts);pl.setAttribute("fill",col);
        pl.setAttribute("stroke","#7b3cf0");pl.setAttribute("stroke-width","1.2");pl.setAttribute("stroke-linejoin","round");g.appendChild(pl);
      };
      for(let k=0;k<3;k++)arm(k*2.094,"url(#ft-g)",1.25);
      for(let k=0;k<3;k++)arm(k*2.094+0.55,"#ff3312",0.28);
    }
  },
  {
    cat:"raster", name:"Effect Stack",
    desc:"14種のエフェクトを重ねがけして偶発的なポスターを生成。画像・動画ソース対応、ランダマイズ＋スタック刻印＋WebM録画",
    href:"tools/effect-stack.html",
    thumb:`<svg viewBox="0 0 120 66" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><g id="d"></g></svg>`,

      const g=svg.querySelector("#d");

  {

    desc:"グロー球体を型板ガラス越しに歪ませる fluted glass シェーダー。画像・動画ソース／WebM録画／設定URL共有",
    href:"tools/glass-lab.html",
    thumb:`<svg viewBox="0 0 120 66" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><g id="d"></g></svg>`,
    draw(svg){
      const g=svg.querySelector("#d");
      const mk=(tag,at)=>{const e=document.createElementNS("http://www.w3.org/2000/svg",tag);for(const k in at)e.setAttribute(k,at[k]);g.appendChild(e);return e;};
      mk("rect",{x:0,y:0,width:120,height:66,fill:"#060606"});

      g.appendChild(defs);
      for(let i=0;i<11;i++){

    cat:"motion", name:"Image Switcher",

      <line x1="8" y1="14" x2="30" y2="14" stroke="#4a4a4a" stroke-width="1.5"/>

  },
  {

    desc:"ジオメトリックなワイヤーフレーム系モーショングラフィック",
    href:"tools/wireframe.html",
    thumb:`<svg viewBox="0 0 120 66" xmlns="http://www.w3.org/2000/svg"><g id="d" stroke="#5c68ff" stroke-width="0.8" fill="none" opacity="0.85"></g></svg>`,
    draw(svg){
      const g=svg.querySelector("#d");
      for(let i=0;i<7;i++){
        const s=1-i*0.12, w=100*s, h=54*s, x=60-w/2, y=33-h/2;
        const r=document.createElementNS("http://www.w3.org/2000/svg","rect");
        r.setAttribute("x",x);r.setAttribute("y",y);r.setAttribute("width",w);r.setAttribute("height",h);
        r.setAttribute("opacity",(1-i*0.1).toFixed(2));g.appendChild(r);
      }
      [[10,6],[110,6],[110,60],[10,60]].forEach(([x,y])=>{
        const l=document.createElementNS("http://www.w3.org/2000/svg","line");
        l.setAttribute("x1",x);l.setAttribute("y1",y);l.setAttribute("x2",60);l.setAttribute("y2",33);

/* Purpose-oriented entrances share the original tools and their saved settings. */
const TOOL_META = {
  "Egg Glass": {cat:"3d", input:"図形 / 画像", output:["PNG","VIDEO","HTML"], summary:"卵形3Dの柄・ロゴ・照明を編集。スクロールに合わせた動きも。"},
  "Halftone Lab": {cat:"image", input:"画像", output:["PNG","SVG","VIDEO","HTML"], summary:"画像を網点・ディザ・ASCIIに。質感を重ねて、印刷のような表現に。"},
  "Dither → SVG": {cat:"image", input:"画像", output:["PNG","SVG"], summary:"写真やイラストを網点・ディザ・ドットへ。ベクターで書き出し。"},
  "Pixel Gradient": {cat:"texture", input:"生成", output:["PNG"], summary:"メッシュグラデーションにピクセル・ポスタライズ・グレインを加える。"},
  "Thermal Flow": {cat:"texture", input:"生成", output:["PNG","VIDEO","HTML"], summary:"炎のフレームと流体グラデーション。形・配色・動きをつくる。"},
  "Smearworks": {cat:"image", input:"画像", output:["PNG"], summary:"ポートレートに放射ブラーと残像。顔を残して、色面を引き伸ばす。"},
  "Grid Stretch": {cat:"image", input:"画像", output:["PNG"], summary:"画像をグリッドで切り分け、ピクセルを引き伸ばすグリッチ。"},
  "ASCII Wave": {cat:"texture", input:"生成", output:["PNG","VIDEO","HTML"], summary:"流体ノイズを文字で描く。カーソルに反応するASCIIの背景。"},
  "Warp Type": {cat:"type", input:"テキスト", output:["PNG","VIDEO"], summary:"文字を波打たせ、ノイズで歪ませる。動くタイポグラフィ。"},
  "U19 Aberration": {cat:"type", input:"テキスト / ロゴ", output:["PNG","VIDEO"], collection:"u19", summary:"文字やロゴの輪郭をサーモカラーで発光。背景と合成する。"},
  "U19 Tile Scroll": {cat:"motion", input:"ロゴ / 映像", output:["PNG","VIDEO"], collection:"u19", summary:"流れるロゴタイルでシーンをつなぐ。ワイプと速度をキーフレームで。"},
  "U19 HUD Sequence": {cat:"motion", input:"動画", output:["VIDEO"], collection:"u19", summary:"HUDが立ち上がり、映像ウィンドウが開く。動画を差し替えるだけ。"},
  "Flame Transition": {cat:"motion", input:"画像 / 動画", output:["PNG","VIDEO"], summary:"サーモカラーの炎でシーンを切り替え。透過レイヤーにも。"},
  "Effect Stack": {cat:"image", input:"画像 / 動画", output:["PNG","VIDEO"], summary:"14種のエフェクトを重ねる。順序を変え、偶発的な表現を探る。"},
  "Heatmap Blur": {cat:"type", input:"テキスト", output:["PNG","VIDEO"], summary:"文字をぼかし、伸ばし、熱に変える。配色と動きを編集する。"},
  "Glass Lab": {cat:"texture", input:"生成 / 画像 / 動画", output:["PNG","VIDEO"], summary:"光の球体を型板ガラス越しに歪ませる。画像・動画の加工にも。"},
  "Image Switcher": {cat:"motion", input:"画像 / ロゴ", output:["PNG","VIDEO","HTML"], summary:"複数の画像でロゴOPやスライドを制作。テンポと始まり・終わりを調整。"},
  "Word Switcher": {cat:"type", input:"登録済みSVG", output:["PNG","SVG","VIDEO","HTML"], summary:"登録済みの単語SVGをリズミカルに切り替える。順序・間隔・動きを編集。"},
  "Wireframe": {cat:"3d", input:"図形", output:["PNG","SVG","VIDEO","HTML"], summary:"ジオメトリックなワイヤーフレーム。線と立体で動きをつくる。"},
};
const ENTRIES = TOOLS.flatMap(tool=>{
  const entry={...tool,...TOOL_META[tool.name],toolName:tool.name};
  if(tool.name==="Halftone Lab") return [
    {...entry,name:"Halftone Image",href:tool.href+"?workspace=image",workspace:"画像を加工"},
    {...entry,name:"Halftone Pattern",cat:"texture",input:"生成",href:tool.href+"?workspace=generate",workspace:"模様を生成",summary:"リップル・シェイプ・波形から、動く網点やASCIIパターンを生成。"}
  ];
  if(tool.name==="Heatmap Blur") return [
    {...entry,name:"Heatmap Type",href:tool.href+"?workspace=type",workspace:"文字を編集"},
    {...entry,name:"Heatmap Media",cat:"image",input:"画像 / 動画",href:tool.href+"?workspace=media",workspace:"画像・動画を加工",summary:"画像・動画の明るさをヒートマップ配色へ。ブラーとグレインも調整。"}
  ];
  return [entry];
});
const $=id=>document.getElementById(id);
const state={category:"all",collection:"",query:"",output:""};
const catalog=$("catalog");
const nav=$("categoryNav");
function makeNav(key,name,icon,count){
  const button=document.createElement("button");
  button.type="button";button.className="nav-item";button.dataset.category=key;
  button.innerHTML=`<span class="nav-symbol" aria-hidden="true">${icon}</span><span>${name}</span><span class="nav-count">${count}</span>`;
  button.addEventListener("click",()=>{state.category=key;state.collection="";update(true);});
  nav.appendChild(button);
}
makeNav("all","すべてのツール","⊞",ENTRIES.length);
CATEGORIES.forEach(cat=>makeNav(cat.key,cat.name,cat.icon,ENTRIES.filter(t=>t.cat===cat.key).length));
$("totalCount").textContent=`${TOOLS.length} tools · ${ENTRIES.length} workspaces`;
function readLocation(){
  const params=new URLSearchParams(location.search);
  const category=params.get("category");
  state.category=CATEGORIES.some(c=>c.key===category)?category:"all";
  state.collection=params.get("collection")==="u19"?"u19":"";
  state.query=params.get("q")||"";
  state.output=["PNG","SVG","VIDEO","HTML"].includes(params.get("output"))?params.get("output"):"";
  $("search").value=state.query;$("outputFilter").value=state.output;
}
function saveLocation(push){
  const url=new URL(location.href);
  for(const key of ["category","collection","q","output"])url.searchParams.delete(key);
  if(state.category!=="all")url.searchParams.set("category",state.category);
  if(state.collection)url.searchParams.set("collection",state.collection);
  if(state.query)url.searchParams.set("q",state.query);
  if(state.output)url.searchParams.set("output",state.output);
  if(url.href!==location.href)history[push?"pushState":"replaceState"](null,"",url);
}
function makeCard(t,index){
  const a=document.createElement("a");a.className="card";a.href=t.href;
  a.setAttribute("aria-label",`${t.name} — ${t.workspace||t.input}`);
  a.innerHTML=`<div class="thumb" aria-hidden="true">${t.thumb}<span class="thumb-index">${String(index+1).padStart(2,"0")}</span><span class="thumb-open">↗</span></div><div class="card-body"><div class="card-title"><h3>${t.name}</h3>${t.collection?'<span class="collection-tag">U19</span>':""}</div><div class="workspace-label">${t.workspace?t.toolName+" / ":""}${t.workspace||t.input}</div><p>${t.summary}</p><div class="card-meta"><span class="input-tag">${t.input}</span><span class="output-tags">${t.output.map(o=>`<span>${o==="VIDEO"?"動画":o}</span>`).join("")}</span></div></div>`;
  if(t.draw)t.draw(a.querySelector("svg"));
  // Repeated tool entrances use the same artwork; keep SVG paint IDs unique.
  const ids=new Map();a.querySelectorAll("svg [id]").forEach(el=>{const id=el.id;ids.set(id,`${id}-${index}`);el.id=ids.get(id);});
  a.querySelectorAll("svg *").forEach(el=>[...el.attributes].forEach(at=>{let v=at.value;ids.forEach((fresh,old)=>{v=v.replaceAll(`url(#${old})`,`url(#${fresh})`);});if(v!==at.value)el.setAttribute(at.name,v);}));
  return a;
}
function render(){
  const cat=CATEGORIES.find(c=>c.key===state.category);
  $("pageTitle").textContent=state.collection?"U19 コレクション":cat?cat.name:"すべてのツール";
  $("pageDescription").textContent=state.collection?"U19のビジュアルをつくる、3つのワークスペース。":cat?cat.desc:"つくりたい表現から、ワークスペースを選ぶ。";
  nav.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(!state.collection&&b.dataset.category===state.category)));
  $("u19Filter").setAttribute("aria-pressed",String(!!state.collection));
  const words=state.query.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
  const results=ENTRIES.filter(t=>{
    const haystack=[t.name,t.toolName,t.summary,t.input,t.workspace,CATEGORIES.find(c=>c.key===t.cat).name,...t.output].join(" ").toLocaleLowerCase();
    return (state.category==="all"||state.category===t.cat)&&(!state.collection||t.collection===state.collection)&&(!state.output||t.output.includes(state.output))&&words.every(w=>haystack.includes(w));
  });
  catalog.replaceChildren();
  CATEGORIES.forEach(category=>{
    const entries=results.filter(t=>t.cat===category.key);if(!entries.length)return;
    const section=document.createElement("section");section.className="category-section";section.setAttribute("aria-label",category.name);
    section.innerHTML=`<div class="section-heading"><h2>${category.name}</h2><span>${category.english}</span><b>${String(entries.length).padStart(2,"0")}</b></div><div class="tool-grid"></div>`;
    const grid=section.querySelector(".tool-grid");entries.forEach(t=>grid.appendChild(makeCard(t,ENTRIES.indexOf(t))));catalog.appendChild(section);
  });
  $("resultCount").textContent=`${results.length} ワークスペース`;
  $("emptyState").hidden=results.length>0;
}
function update(push=false){saveLocation(push);render();}
$("search").addEventListener("input",e=>{state.query=e.target.value;update();});
$("outputFilter").addEventListener("change",e=>{state.output=e.target.value;update(true);});
$("u19Filter").addEventListener("click",()=>{state.collection=state.collection?"":"u19";state.category="all";update(true);});
$("clearFilters").addEventListener("click",()=>{Object.assign(state,{category:"all",collection:"",query:"",output:""});$("search").value="";$("outputFilter").value="";update(true);$("search").focus();});
window.addEventListener("popstate",()=>{readLocation();render();});
document.addEventListener("keydown",e=>{if(e.key==="/"&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$("search").focus();}});
readLocation();render();
</script>
</body>
</html>
