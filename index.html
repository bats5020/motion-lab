<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOTION LAB — animation &amp; graphics tools</title>
<link rel="stylesheet" href="shared/tokens.css">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);
    font-family:var(--font-mono);
    -webkit-font-smoothing:antialiased;
    line-height:1.5;min-height:100vh;
  }
  a{color:inherit;text-decoration:none;}

  .wrap{max-width:1080px;margin:0 auto;padding:56px 24px 80px;}

  /* header */
  header{margin-bottom:44px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{
    width:26px;height:26px;border-radius:6px;background:var(--accent);
    display:inline-flex;align-items:center;justify-content:center;
    color:#fff;font-size:13px;
  }
  .title{font-size:26px;font-weight:600;letter-spacing:.06em;margin:0;}
  .title span{color:var(--accent);}
  .subtitle{color:var(--subtext);font-size:13px;margin-top:10px;}
  .count{color:var(--faint);font-size:12px;margin-top:2px;}

  /* category */
  .cat{margin-top:40px;}
  .cat-head{
    display:flex;align-items:baseline;gap:10px;
    padding-bottom:12px;margin-bottom:18px;border-bottom:1px solid var(--line);
  }
  .cat-name{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;}
  .cat-desc{color:var(--faint);font-size:11px;}

  /* grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}

  .card{
    display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    overflow:hidden;transition:background .14s,border-color .14s,transform .14s;
  }
  .card:hover{background:var(--panel2);border-color:var(--line-hover);transform:translateY(-2px);}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .thumb{
    height:132px;background:#0e0e10;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .thumb svg{width:100%;height:100%;display:block;}

  .body{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column;}
  .name{font-size:14px;font-weight:600;}
  .desc{color:var(--subtext);font-size:11.5px;margin-top:6px;flex:1;}
  .foot{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:14px;
  }
  .tag{color:var(--faint);font-size:10.5px;letter-spacing:.05em;}
  .open{
    color:var(--accent);font-size:11px;font-weight:600;
    display:inline-flex;align-items:center;gap:5px;
  }
  .open .arrow{transition:transform .14s;}
  .card:hover .open .arrow{transform:translateX(3px);}

  footer{margin-top:56px;color:var(--faint);font-size:11px;line-height:1.7;}
  footer code{background:#0f0f0f;padding:1px 6px;border-radius:4px;color:var(--subtext);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="mark">◆</span>
      <h1 class="title">MOTION <span>LAB</span></h1>
    </div>
    <p class="subtitle">アニメーション&amp;グラフィックツールの統合プラットフォーム — すべてブラウザ内処理・依存ゼロ</p>
    <p class="count" id="count"></p>
  </header>

  <div id="catalog"></div>

  <footer>
    すべてビルド不要の単体HTML。カードをクリックすると新しいタブで開きます。<br>
    ツールを増やしたら <code>tools/</code> にHTMLを置き、<code>index.html</code> 内の <code>TOOLS</code> に1件足すだけで一覧に反映されます。
  </footer>
</div>

<script>
/* ------------------------------------------------------------------
   ツール定義 — 増えたらここに1件足すだけ。thumb はカード内サムネSVG。
------------------------------------------------------------------ */
const CATEGORIES = [
  { key:"raster",    name:"Raster",    desc:"ビットマップ・ピクセル・質感" },
  { key:"motion",    name:"Motion",    desc:"動き・アニメーション" },
];

const TOOLS = [
  {
    cat:"raster", name:"Halftone Lab",
    desc:"画像・プロシージャルソースをハーフトーン／ディザ／ASCII化。アニメーション＋WebM録画・SVG／コード書き出し対応",
    href:"tools/halftone-lab.html",
    thumb:`<svg viewBox="0 0 120 66" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><g id="d"></g></svg>`,
    draw(svg){
      const g=svg.querySelector("#d");
      for(let y=4;y<66;y+=7)for(let x=4;x<120;x+=7){
        const dx=x-60, dy=y-33, dist=Math.hypot(dx,dy);
        const ink=(Math.sin(dist*0.24)+1)/2 * Math.max(0,1-dist/62);
        const r=3.3*0.7071*Math.sqrt(ink);
        if(r<0.25)continue;
        const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
        c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("r",r.toFixed(2));
        c.setAttribute("fill","#e8e8f0");g.appendChild(c);
      }
    }
  },
  {
    cat:"raster", name:"Dither → SVG",
    desc:"画像を網点・ディザ・ドット化してSVG／PNGで書き出す",
    href:"tools/dither-svg.html",
    thumb:`<svg viewBox="0 0 120 66" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><g id="d"></g></svg>`,
    draw(svg){
      const g=svg.querySelector("#d");
      for(let y=0;y<66;y+=8)for(let x=0;x<120;x+=8){
        const r=(x/120)*3.2; if(r<0.4)continue;
        const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
        c.setAttribute("cx",x+4);c.setAttribute("cy",y+4);
        c.setAttribute("r",Math.min(r,3.4).toFixed(2));
        c.setAttribute("fill","#5c68ff");c.setAttribute("opacity","0.9");g.appendChild(c);
      }
    }
  },
  {
    cat:"raster", name:"Pixel Gradient",
    desc:"メッシュグラデを土台にピクセル化・ポスタライズ・グレインで生成",
    href:"tools/pixel-gradient.html",
    thumb:`<svg viewBox="0 0 120 66" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><g id="d"></g></svg>`,
    draw(svg){
      const g=svg.querySelector("#d"),cols=15,rows=8,cw=120/cols,ch=66/rows;
      const A=[79,92,255],B=[255,90,140];
      for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
        const t=(i/cols+j/rows)/2, r=Math.round(A[0]+(B[0]-A[0])*t),
          gg=Math.round(A[1]+(B[1]-A[1])*t), b=Math.round(A[2]+(B[2]-A[2])*t);
        const rc=document.createElementNS("http://www.w3.org/2000/svg","rect");
        rc.setAttribute("x",i*cw);rc.setAttribute("y",j*ch);
        rc.setAttribute("width",cw+0.5);rc.setAttribute("height",ch+0.5);
        rc.setAttribute("fill",`rgb(${r},${gg},${b})`);g.appendChild(rc);
      }
    }
  },
  {
    cat:"raster", name:"Grid Stretch",
    desc:"画像をグリッド分割してピクセルストレッチ。注釈オーバーレイ付きのグリッチ表現",
    href:"tools/grid-stretch.html",
    thumb:`<svg viewBox="0 0 120 66" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><g id="d"></g></svg>`,
    draw(svg){
      const g=svg.querySelector("#d");
      const mk=(tag,at)=>{const e=document.createElementNS("http://www.w3.org/2000/svg",tag);for(const k in at)e.setAttribute(k,at[k]);g.appendChild(e);return e;};
      mk("rect",{x:34,y:10,width:52,height:30,rx:2,fill:"#3a5c46"});
      mk("rect",{x:44,y:14,width:32,height:20,rx:2,fill:"#5ea877"});
      for(const y of [42,47,52,57]){
        const w=y===47?96:(y===52?70:44), x=60-w/2;
        mk("rect",{x,y,width:w,height:3.4,fill:y===47?"#5ea877":"#3a5c46",opacity:0.95});
      }
      for(let x=12;x<=108;x+=16) mk("line",{x1:x,y1:6,x2:x,y2:60,stroke:"#3d3d46","stroke-width":0.5});
      mk("text",{x:14,y:14,fill:"#9a9aa6","font-size":5,"font-family":"monospace"}).textContent="R07 34%";
    }
  },
  {
    cat:"motion", name:"ASCII Wave",
    desc:"流体ノイズをASCII文字で描くアニメーション背景。カーソルで反発・引き寄せ・渦",
    href:"tools/ascii-wave.html",
    thumb:`<svg viewBox="0 0 120 66" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><g id="d" font-family="monospace" font-size="6"></g></svg>`,
    draw(svg){
      const g=svg.querySelector("#d"), chars=" .:-=+*#%@";
      for(let y=6;y<66;y+=6.5)for(let x=3;x<118;x+=6){
        const v=(Math.sin(x*0.09+y*0.13)+Math.sin(x*0.045-y*0.07)+2)/4;
        const ch=chars[Math.min(9,Math.floor(v*10))];
        if(ch===" ")continue;
        const t=document.createElementNS("http://www.w3.org/2000/svg","text");
        t.setAttribute("x",x);t.setAttribute("y",y);
        t.setAttribute("fill",v>0.72?"#5c68ff":"#c9c9d4");t.setAttribute("opacity",(0.35+v*0.65).toFixed(2));
        t.textContent=ch;g.appendChild(t);
      }
    }
  },
  {
    cat:"raster", name:"Effect Stack",
    desc:"14種のエフェクトを重ねがけして偶発的なポスターを生成。画像・動画ソース対応、ランダマイズ＋スタック刻印＋WebM録画",
    href:"tools/effect-stack.html",
    thumb:`<svg viewBox="0 0 120 66" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><g id="d"></g></svg>`,
    draw(svg){
      const g=svg.querySelector("#d");
      const mk=(tag,at)=>{const e=document.createElementNS("http://www.w3.org/2000/svg",tag);for(const k in at)e.setAttribute(k,at[k]);g.appendChild(e);return e;};
      mk("rect",{x:0,y:0,width:120,height:66,fill:"#1c1430"});
      for(let x=0;x<120;x+=3){
        const h=20+18*Math.sin(x*0.12)+10*Math.sin(x*0.31+2);
        mk("rect",{x,y:33-h/2,width:1.4,height:h,fill:x%12<6?"#b06cff":"#e8a0c8",opacity:0.55+0.4*Math.sin(x*0.2)**2});
      }
      const words=["+WARP","+SCANDRIFT","-REPEAT","+HALFTONE","+GRAIN"];
      words.forEach((w,i)=>{
        const t=mk("text",{x:5,y:10+i*7.2,fill:"#e6e6ef","font-size":5,"font-family":"monospace",opacity:w[0]==="+"?0.95:0.4});
        t.textContent=w;
      });
    }
  },
  {
    cat:"motion", name:"Glass Lab",
    desc:"グロー球体を型板ガラス越しに歪ませる fluted glass シェーダー。画像・動画ソース／WebM録画／設定URL共有",
    href:"tools/glass-lab.html",
    thumb:`<svg viewBox="0 0 120 66" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><g id="d"></g></svg>`,
    draw(svg){
      const g=svg.querySelector("#d");
      const mk=(tag,at)=>{const e=document.createElementNS("http://www.w3.org/2000/svg",tag);for(const k in at)e.setAttribute(k,at[k]);g.appendChild(e);return e;};
      mk("rect",{x:0,y:0,width:120,height:66,fill:"#060606"});
      const defs=document.createElementNS("http://www.w3.org/2000/svg","defs");
      defs.innerHTML='<radialGradient id="glb" cx="0.5" cy="0.45" r="0.55"><stop offset="0%" stop-color="#ffb37a"/><stop offset="45%" stop-color="#ff6a1f"/><stop offset="100%" stop-color="#ff6a1f" stop-opacity="0"/></radialGradient>';
      g.appendChild(defs);
      for(let i=0;i<11;i++){
        const y=6+i*5.2, sq=1-Math.abs(i-5)/5*0.55;
        const w=52*Math.sqrt(Math.max(0.05,1-((i-5)/5.5)**2))*(0.85+0.3*Math.sin(i*2.1));
        mk("ellipse",{cx:60+Math.sin(i*1.7)*3,cy:y,rx:w/2,ry:2.1*sq,fill:"url(#glb)",opacity:0.95});
      }
    }
  },
  {
    cat:"motion", name:"Word Switcher",
    desc:"単語／SVGを切り替えるモーショングラフィック",
    href:"tools/word-switcher.html",
    thumb:`<svg viewBox="0 0 120 66" xmlns="http://www.w3.org/2000/svg">
      <rect x="8" y="24" width="104" height="18" rx="2" fill="none" stroke="#333"/>
      <rect x="8" y="24" width="104" height="18" rx="2" fill="#5c68ff" opacity="0.14"/>
      <text x="60" y="37" fill="#dfe1ff" font-size="11" font-family="monospace" text-anchor="middle" letter-spacing="1">DESIGN</text>
      <line x1="8" y1="14" x2="30" y2="14" stroke="#4a4a4a" stroke-width="1.5"/>
      <line x1="90" y1="52" x2="112" y2="52" stroke="#4a4a4a" stroke-width="1.5"/>
    </svg>`
  },
  {
    cat:"motion", name:"Wireframe",
    desc:"ジオメトリックなワイヤーフレーム系モーショングラフィック",
    href:"tools/wireframe.html",
    thumb:`<svg viewBox="0 0 120 66" xmlns="http://www.w3.org/2000/svg"><g id="d" stroke="#5c68ff" stroke-width="0.8" fill="none" opacity="0.85"></g></svg>`,
    draw(svg){
      const g=svg.querySelector("#d");
      for(let i=0;i<7;i++){
        const s=1-i*0.12, w=100*s, h=54*s, x=60-w/2, y=33-h/2;
        const r=document.createElementNS("http://www.w3.org/2000/svg","rect");
        r.setAttribute("x",x);r.setAttribute("y",y);r.setAttribute("width",w);r.setAttribute("height",h);
        r.setAttribute("opacity",(1-i*0.1).toFixed(2));g.appendChild(r);
      }
      [[10,6],[110,6],[110,60],[10,60]].forEach(([x,y])=>{
        const l=document.createElementNS("http://www.w3.org/2000/svg","line");
        l.setAttribute("x1",x);l.setAttribute("y1",y);l.setAttribute("x2",60);l.setAttribute("y2",33);
        g.appendChild(l);
      });
    }
  },
];

/* ------------------------------------------------------------------ */
const catalog = document.getElementById("catalog");
CATEGORIES.forEach(cat=>{
  const tools = TOOLS.filter(t=>t.cat===cat.key);
  if(!tools.length) return;
  const sec = document.createElement("section");
  sec.className = "cat";
  sec.innerHTML = `<div class="cat-head"><span class="cat-name">${cat.name}</span><span class="cat-desc">${cat.desc}</span></div>`;
  const grid = document.createElement("div");
  grid.className = "grid";
  tools.forEach(t=>{
    const a = document.createElement("a");
    a.className = "card";
    a.href = t.href;
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML = `
      <div class="thumb">${t.thumb}</div>
      <div class="body">
        <div class="name">${t.name}</div>
        <div class="desc">${t.desc}</div>
        <div class="foot">
          <span class="tag">${cat.name}</span>
          <span class="open">開く <span class="arrow">→</span></span>
        </div>
      </div>`;
    if(t.draw) t.draw(a.querySelector("svg"));
    grid.appendChild(a);
  });
  sec.appendChild(grid);
  catalog.appendChild(sec);
});
document.getElementById("count").textContent = `${TOOLS.length} tools`;
</script>
</body>
</html>
